/* ================= 学習ロード(テーマ制・第6段階) ================= */
// レッスンのdiff(出題条件)に従って5問を毎回生成/抽選する。問題はマスに固定しない。
// 麻雀ロジック(生成器・判定・採点)は既存のものをそのまま呼ぶだけで、一切変更しない。
function buildThemeQuestions(c,diff,n){
  n=n||LESSON_QN_DEFAULT;
  if(c.type==='ch1') return buildCh1(diff&&diff.ch1);  // 第1章: レッスンごとの固定シナリオ(問題数もレッスン定義側)
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const qs=[];
  if(c.type==='waits'){
    const lvls=(diff&&diff.waitsLevels)||[4,7,10,13];
    for(let i=0;i<n;i++){
      const level=pick(lvls);
      const seed=(Math.random()*0x7fffffff)|0;
      const rng=mulberry32(seed);
      const g=genSuitTenpai(level,rng);
      if(g){
        const ankou=g.counts.filter(x=>x>=3).length;
        qs.push({wtype:true,level,counts:g.counts,waits:g.waits,
          suit:['m','p','s'][Math.floor(rng()*3)],
          seed,lv:waitsLv(level,g.waits.length),
          fs:'w:t'+level+':w'+g.waits.length+':a'+ankou});
      }
    }
  }else if(c.type==='ukeire1'){
    const lvls=(diff&&diff.ukeireLevels)||[7,10,13,34];
    // 実戦形: 4パターンを必ず網羅し、残り枠はランダム
    const patPlan=[1,2,3,4];
    while(patPlan.length<n) patPlan.push(1+Math.floor(Math.random()*4));
    shuffle(patPlan);
    for(let i=0;i<n;i++){
      const level=pick(lvls);
      const seed=(Math.random()*0x7fffffff)|0;
      const rng=mulberry32(seed);
      if(level===34){
        const g=genFullIishanten(rng,patPlan[i]);
        if(g) qs.push({u1:true,full:true,level:'full',counts34:g.counts,accepts:g.accepts,
          pattern:g.pattern,seed,lv:9,fs:'u1:full:p'+g.pattern+':a'+g.accepts.length});
      }else{
        const g=genSuitIishanten(level,rng);
        if(g) qs.push({u1:true,level,counts:g.counts,accepts:g.accepts,
          suit:['m','p','s'][Math.floor(rng()*3)],
          seed,lv:u1Lv(level,g.accepts.length),fs:'u1:t'+level+':a'+g.accepts.length});
      }
    }
  }else if(c.type==='discard'){
    const r=(diff&&diff.lvRange)||[2,9];
    for(let i=0;i<n;i++){
      const target=r[0]+Math.floor(Math.random()*(r[1]-r[0]+1));
      const g=genNanikiruAt(target);            // ±1Lv妥協・フォールバックは既存実装のまま
      if(g) qs.push(g);
    }
  }else if(c.id==='riichi'){
    const r=(diff&&diff.lvRange)||[2,5];
    let pool=c.questions.filter(q=>q.lv>=r[0]&&q.lv<=r[1]);
    if(pool.length<n) pool=c.questions;         // 帯のプールがn問未満なら全プールから(承認済み13問のみ)
    return shuffle(pool.slice()).slice(0,n);
  }else{
    return shuffle(c.questions.slice()).slice(0,n);  // 静的プール(rules/yaku/score)
  }
  return qs;
}
/* ============================================================
   第1章「麻雀を打てる」v1.0 — A1/B1/B2の11レッスン
   設計原則(指示・カリキュラムv1.0):
   ・Teach→Try→Quiz→Review。Teachは長文ページ禁止(イソピィの一言+牌+短い説明)
   ・正解は必ず下の決定論バリデータで決める(人手の思い込みやAIで固定しない)
   ・未導入用語を問題文に使わない(用語導入順: 体験→意味→名前→使用。カンツ・ターツは第1章未導入)
   ・教育的な固定例は固定のまま。ランダム化は★まとめ・そっくりさん系のみ
   ============================================================ */
/* ---- 決定論バリデータ(生成側とテスト側の両方がこれを使う) ---- */
function ch1IsRun(tiles){        // シュンツ: 数牌3枚・同じ種類・数字が連続(8-9-1×・種類混じり×・字牌×)
  if(!tiles||tiles.length!==3) return false;
  if(tiles.some(t=>t.length!==2)) return false;          // 字牌が混ざればシュンツ不可
  const su=tiles[0][1];
  if(tiles.some(t=>t[1]!==su)) return false;             // マンズ・ピンズ・ソーズ混在は不可
  const ns=tiles.map(t=>+t[0]).sort((a,b)=>a-b);
  return ns[0]+1===ns[1]&&ns[1]+1===ns[2];               // 9の次に1へは戻らない(8-9-1は連続でない)
}
function ch1IsTriplet(tiles){    // コーツ: まったくおなじ牌3枚(字牌も数牌もOK。東東東○・白發中×)
  return !!tiles&&tiles.length===3&&tiles[0]===tiles[1]&&tiles[1]===tiles[2];
}
function ch1IsPair(tiles){       // トイツ: まったくおなじ牌2枚
  return !!tiles&&tiles.length===2&&tiles[0]===tiles[1];
}
function ch1IsMentsu(tiles){ return ch1IsRun(tiles)||ch1IsTriplet(tiles); }
/* 4枚ミニ麻雀のアガリ判定(決定論): 5枚が「1メンツ+1アタマ」に分解できるか。
   アタマ候補(同一牌ペア)を固定し、残り3枚がメンツ(ch1IsMentsu)かを全探索。
   字牌シュンツ不可・8-9-1不可はch1IsRunが保証。分解(インデックス)を返す(なければnull) */
function ch1MiniWin5(tiles){ return (tiles&&tiles.length===5)?ch1MiniWin(tiles):null; }
/* ミニ麻雀のアガリ判定(決定論・共通): Nメンツ+1アタマ(5枚=1/8枚=2/11枚=3)。
   ①アタマ候補(同一牌ペア)を全固定 ②残り3N枚を再帰全探索でN個のメンツへ分解。
   各段で「残りの先頭の牌を必ず含む3枚」を試すため、探索は完全かつ重複がない
   (先頭3+次3の決め打ちはしない。複数の分解候補がある牌姿も正しく判定)。
   ch1IsMentsu再利用のため字牌シュンツ×・8-9-1×・種類混じり×は自動保証 */
function ch1MiniDecomp(idxs,tiles){
  if(idxs.length===0) return [];
  const a=idxs[0];                                        // 先頭の牌はどれかのメンツに必ず属す
  for(let x=1;x<idxs.length;x++)for(let y=x+1;y<idxs.length;y++){
    const g=[a,idxs[x],idxs[y]];
    if(!ch1IsMentsu(g.map(k=>tiles[k]))) continue;
    const rest=idxs.filter(k=>!g.includes(k));
    const sub=ch1MiniDecomp(rest,tiles);
    if(sub) return [g].concat(sub);
  }
  return null;
}
function ch1MiniWin(tiles){
  const n=tiles?tiles.length:0;
  if(n!==5&&n!==8&&n!==11&&n!==14) return null;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    if(tiles[i]!==tiles[j]) continue;                     // アタマ=まったくおなじ2枚
    const rest=[];
    for(let k=0;k<n;k++) if(k!==i&&k!==j) rest.push(k);
    const sets=ch1MiniDecomp(rest,tiles);
    if(sets){
      const r={headIdx:[i,j], head:[tiles[i],tiles[j]],
        mentsuSets:sets, mentsuIdx:sets[0], mentsu:sets[0].map(k=>tiles[k])};
      if(sets[1]){ r.mentsu2Idx=sets[1]; r.mentsu2=sets[1].map(k=>tiles[k]); }
      if(sets[2]){ r.mentsu3Idx=sets[2]; r.mentsu3=sets[2].map(k=>tiles[k]); }
      if(sets[3]){ r.mentsu4Idx=sets[3]; r.mentsu4=sets[3].map(k=>tiles[k]); }
      return r;
    }
  }
  return null;
}
function ch1MiniWin8(tiles){ return (tiles&&tiles.length===8)?ch1MiniWin(tiles):null; }
function ch1MiniWin11(tiles){ return (tiles&&tiles.length===11)?ch1MiniWin(tiles):null; }
function ch1MiniWin14(tiles){ return (tiles&&tiles.length===14)?ch1MiniWin(tiles):null; }
/* 待ち判定(決定論): 4枚手牌に34種を1枚ずつ仮追加し、アガリになる牌を列挙。
   7枚手牌はch1MiniWin8で同様に判定(C2)。
   手牌ですでに4枚つかっている牌は5枚目が存在しないため待ちに出さない */
const CH1_ALL34=(()=>{const a=[];for(const su of ['m','p','s'])for(let n=1;n<=9;n++)a.push(n+su);
  for(const z of 'ESWNBGR')a.push(z);return a;})();
/* 理牌表示(初心者向け): ソートし、つながらない牌の間にスキマを入れて横一列で見せる。
   つながる=同じ牌 or 同スートで数字差1(組のなかみを教えないよう、それ以上はまとめない) */
function ch1HandGrouped(str){
  // つながる牌をグループ(span.hgrp)にまとめ、折り返しはグループ間でのみ起きるようにする
  const tiles=sortTiles(parseHand(str));
  const groups=[[]];
  tiles.forEach((t,i)=>{
    if(i>0){
      const p=tiles[i-1];
      const linked=(t===p)||(t.length===2&&p.length===2&&t[1]===p[1]&&(+t[0]-+p[0])<=1);
      if(!linked) groups.push([]);
    }
    groups[groups.length-1].push(t);
  });
  return '<div class="hand">'
    +groups.map(g=>'<span class="hgrp">'+g.map(t=>tileHTML(t)).join('')+'</span>').join('<span class="hand-gap"></span>')
    +'</div>';
}
function ch1MiniWaits(hand){
  if(!hand||(hand.length!==4&&hand.length!==7&&hand.length!==10&&hand.length!==13)) return [];
  const cnt={}; hand.forEach(t=>cnt[t]=(cnt[t]||0)+1);
  return CH1_ALL34.filter(cd=>(cnt[cd]||0)<4&&ch1MiniWin(hand.concat([cd])));
}
/* ---- ミニ麻雀 実行状態(L.mg)。renderQごとに初期化されるため復習の再挑戦も新品から ---- */
function ch1MiniInit(q){
  L.mg={hand:sortTiles(q.mini.hand), wall:q.mini.wall.slice(), disc:[],
        tsumo:null, phase:'draw', miss:0, won:false, windec:null,
        level:q.mini.level||2, target:parseHand(q.mini.target),
        riichiOn:!!q.mini.riichi, riichi:false};  // D2: リーチ対応ミニ(slotは局開始から常設)
}
function ch1MiniCounts(a){ const c={}; a.forEach(t=>c[t]=(c[t]||0)+1); return c; }
function ch1MiniContains(big,small){  // bigのmultisetがsmallを包含するか
  const b=ch1MiniCounts(big), sm=ch1MiniCounts(small);
  return Object.keys(sm).every(k=>(b[k]||0)>=sm[k]);
}
/* 切ってよい牌か(決定論): 切った残り4枚が目標アガリ形の部分集合で、
   かつ残りの山とあわせて目標形を完成できること(=教材山で必ずアガれる牌だけがOK) */
function ch1MiniOk(i){
  const mg=L.mg, five=mg.hand.concat([mg.tsumo]);
  const rest=five.slice(); rest.splice(i,1);
  return ch1MiniContains(mg.target,rest)&&ch1MiniContains(rest.concat(mg.wall),mg.target);
}
function ch1MiniGuide(){
  const mg=L.mg; if(!mg) return '';
  if(mg.won){
    const w=mg.windec;
    const sets=w.mentsuSets||[w.mentsuIdx];
    // 盤面固定原則: プレイ中の吹き出しは1〜3行。長い分解説明は下の「こう分かれていたよ！」と
    // 解説カードへ分離し、吹き出しには短いお祝いだけを出す
    return '<b>アガリ！🎉</b> '+sets.length+'メンツ＋1アタマ、そろったね！';
  }
  if(mg.phase==='discard'){
    // アガリは自動確定しない: ユーザー自身に「アガリ！」を判断させる(手牌UI共通原則⑦)
    if(mg.level===1){
      return ch1MiniWin(mg.hand.concat([mg.tsumo]))
        ?'そろったかも…！「アガリ！」をおしてみよう！'
        :(mg.riichi?'まだアガリじゃない…ツモった牌をそのまま切ろう！'
                   :'まだアガリじゃない…ひかっている「いらない牌」を切ろう！');
    }
    if(mg.riichi) return 'リーチ中！アガリでなければ、ツモった牌をそのまま切ろう';
    return 'アガリになっているかな？なっていれば「アガリ！」、まだなら いらない牌を1枚タップ！';
  }
  // リーチ対応ミニ: テンパイしたら、ツモの前に「リーチ！」(初心者用の基本手順)
  if(mg.riichiOn&&!mg.riichi&&ch1MiniWaits(mg.hand).length)
    return mg.level===1?'テンパイした！「リーチ！」をおしてみよう！':'テンパイ！「リーチ！」できるよ';
  if(mg.riichi) return 'リーチ中！山からツモろう';
  if(mg.disc.length===0&&mg.tsumo===null&&mg.level===1) return '「ツモる」をおして、山から1枚引いてみよう！';
  return '山からツモろう！';
}
function ch1MiniHTML(){
  /* 手牌UI共通原則(JANTORE_PLAN.md §手牌UI共通原則):
     ①手牌は枚数によらず常に横1列(縮小で収める・折返し/横スクロール禁止)
     ②プレイ中に牌順を変えない ③ツモ牌は常に一番右 ④ツモ牌は金枠+間隔で区別
     ⑤アガリ時も手牌の並びは維持 ⑥分解の説明は別領域(mg-decomp) ⑦アガリは宣言制 */
  const mg=L.mg; if(!mg) return '';
  let html='';
  const winNow=mg.tsumo!==null&&!mg.won?ch1MiniWin(mg.hand.concat([mg.tsumo])):null;
  // リーチ可能=リーチ対応ミニで、未リーチ・ツモ番(phase draw)・手牌13枚がテンパイのとき
  const canRiichi=mg.riichiOn&&!mg.riichi&&!mg.won&&mg.phase==='draw'&&ch1MiniWaits(mg.hand).length>0;
  // 山: 裏向き牌+操作ボタン(盤面固定原則: slotは局開始から常設、状態だけが変わる。
  // リーチslotはリーチ対応ミニのみ=リーチ未習のC1〜D1の見た目は変えない)
  html+='<div class="mg-wall'+(mg.riichiOn?' mg-r3':'')+'"><span class="mg-lab">山</span><span class="mg-stack">'
    +Array(mg.wall.length).fill('<span class="tile mg-back"></span>').join('')
    +(mg.wall.length===0?'<span class="mg-empty">なし</span>':'')+'</span>'
    +'<span class="mg-btns">'
    +'<button class="btn mg-draw'+(mg.phase==='draw'&&mg.level===1&&!canRiichi?' mg-pulse':'')+'" id="mg-draw" '
    +(mg.phase==='draw'&&mg.wall.length&&!mg.won?'':'disabled')+' onclick="ch1MiniDraw()">ツモる</button>'
    +(mg.riichiOn?'<button class="btn mg-riichi'+(mg.riichi?' rc-on':'')+(canRiichi&&mg.level===1?' mg-pulse':'')
      +'" id="mg-riichi" '+(canRiichi?'':'disabled')+' onclick="ch1MiniRiichi()">'
      +(mg.riichi?'リーチ中':'リーチ！')+'</button>':'')
    +'<button class="btn mg-agari'+(mg.level===1&&winNow?' mg-pulse':'')+'" id="mg-agari" '
    +(mg.phase==='discard'&&!mg.won?'':'disabled')+' onclick="ch1MiniAgari()">アガリ！</button>'
    +'</span></div>';
  // 手牌: 常に横1列・牌順固定・ツモ牌は右はし(タップ領域は透明ラッパーで拡大)
  const five=mg.tsumo!==null;
  const tiles=mg.hand.concat(five?[mg.tsumo]:[]);
  html+='<div class="mg-lab">手牌（'+(five?mg.hand.length+'枚＋ツモ牌':tiles.length+'枚')+'）</div>';
  // 盤面固定原則: slot数=手牌+ツモ1枚(常時)。ツモ前は右端に不可視の予約slotを置き、
  // ツモしても既存牌のサイズ・位置が変わらないようにする(gap8px込みで事前予約)
  const slots=mg.hand.length+1;
  html+='<div class="mg-hand'+(mg.won?' mg-won':'')+'" id="mg-hand" style="--mgn:'+slots
    +';--mg-gapsum:'+((slots-1)*2+8)+'px">'+tiles.map((t,i)=>{
    const isTsumo=five&&i===tiles.length-1;
    let cls='tile '+(t.length===2?t[1]:'z');
    if(isTsumo) cls+=' mg-tsumo';
    if(!mg.won&&mg.phase==='discard'&&mg.level===1&&!winNow
      &&(mg.riichi?isTsumo:ch1MiniOk(i))) cls+=' mg-hint';
    const tap=(mg.phase==='discard'&&!mg.won)?' onpointerdown="ch1MiniDiscard('+i+')"':'';
    return '<button class="tw'+(isTsumo?' tw-tsumo':'')+'" id="mgt-'+i+'"'+tap+'>'
      +'<div class="'+cls+'">'+tileFace(t)+'</div></button>';
  }).join('')
  +(five?'':'<div class="tw tw-tsumo mg-resv" aria-hidden="true"></div>')
  +'</div>';
  if(mg.won){
    html+='<div class="mg-banner">アガリ！</div>';
    // 解説用の分解表示: プレイ中の手牌とは別領域(手牌の並びは変えない)
    const w=mg.windec;
    const sets=w.mentsuSets||[w.mentsuIdx].concat(w.mentsu2Idx?[w.mentsu2Idx]:[]);
    html+='<div class="mg-lab">こう分かれていたよ！</div><div class="mg-decomp" id="mg-decomp">'
      +sets.map(g=>'<span class="hgrp">'+g.map(k=>{const t=tiles[k];
        return '<span class="tile '+(t.length===2?t[1]:'z')+' correct">'+tileFace(t)+'</span>';}).join('')+'</span>')
        .join('<span class="hand-gap"></span>')
      +'<span class="hand-gap"></span><span class="hgrp">'
      +w.headIdx.map(k=>{const t=tiles[k];
        return '<span class="tile '+(t.length===2?t[1]:'z')+' miss">'+tileFace(t)+'</span>';}).join('')
      +'</span></div>';
  }
  // 捨て牌
  html+='<div class="mg-lab">捨て牌</div><div class="mg-disc">'
    +(mg.disc.length?mg.disc.map(t=>tileHTML(t)).join(''):'<span class="mg-empty">まだなし</span>')+'</div>';
  return html;
}
function ch1MiniPaint(){
  const a=document.getElementById('mg-area'); if(a) a.innerHTML=ch1MiniHTML();
  const g=document.getElementById('mg-guide'); if(g) g.innerHTML=ch1MiniGuide();
}
function ch1MiniDraw(){
  if(!L||!L.mg||L.checked) return;
  const mg=L.mg;
  if(mg.phase!=='draw'||mg.won||!mg.wall.length) return;
  if(mg.riichiOn&&!mg.riichi&&ch1MiniWaits(mg.hand).length){
    // テンパイ: 今回の練習ではさきにリーチ宣言(操作手順のガイド・ミスにはしない)
    const g=document.getElementById('mg-guide');
    if(g) g.innerHTML='テンパイ！さきに「リーチ！」をしてからツモろう';
    const b=document.getElementById('mg-riichi');
    if(b){ b.classList.add('ch1-shake');
      setTimeout(()=>{const b2=document.getElementById('mg-riichi'); if(b2) b2.classList.remove('ch1-shake');},500); }
    return;
  }
  const t=mg.wall.shift();
  mg.tsumo=t;
  // 自動アガリはしない(手牌UI共通原則⑦): アガリ形でもユーザー自身が「アガリ！」を押して判定する
  mg.phase='discard';
  ch1MiniPaint();
}
/* リーチ宣言(D2): 鳴かずに作った手がテンパイのとき、ユーザー自身が宣言する。
   宣言後は「ツモった牌をそのまま切る」だけ(初心者用の基本ルールに限定) */
function ch1MiniRiichi(){
  if(!L||!L.mg||L.checked) return;
  const mg=L.mg;
  if(!mg.riichiOn||mg.riichi||mg.won||mg.phase!=='draw') return;
  if(!ch1MiniWaits(mg.hand).length) return;   // 非テンパイでは宣言不可(ボタンもdisabled)
  mg.riichi=true;
  L.riichiDone=true;                          // テスト/検証用フラグ
  ch1MiniPaint();
}
/* アガリ宣言: ユーザーが「アガリ！」を押したときだけ判定する */
function ch1MiniAgari(){
  if(!L||!L.mg||L.checked) return;
  const mg=L.mg, q=L.qs[L.idx];
  if(mg.phase!=='discard'||mg.won||mg.tsumo===null) return;
  const five=mg.hand.concat([mg.tsumo]);
  const win=ch1MiniWin(five);
  if(win&&mg.riichiOn&&!mg.riichi){
    // 役なし(未リーチ)ガード: 通常はツモ前のリーチ手順で防がれるが、念のため案内(ミスにしない)
    const g=document.getElementById('mg-guide');
    if(g) g.innerHTML='アガるには役がいるよ！テンパイのときに「リーチ！」してからアガろう';
    return;
  }
  if(!win){
    // 誤アガリ: 責めずにもう一度見させる(採点ミニではミスとして記録・操作は続行)
    if(!q.ch1t) mg.miss++;
    const g=document.getElementById('mg-guide');
    if(g) g.innerHTML='まだアガリじゃないみたい。もう一度よく見てみよう！';
    const b=document.getElementById('mg-agari');
    if(b){ b.classList.add('ch1-shake');
      setTimeout(()=>{const b2=document.getElementById('mg-agari'); if(b2) b2.classList.remove('ch1-shake');},500); }
    return;
  }
  mg.won=true; mg.phase='won'; mg.windec=win;   // 手牌の並びは変えず、分解は別領域で解説表示
  L.actDone=true;                                // 誘導(teach系)の「つづける」解放フラグを共用
  ch1MiniPaint();
  if(q.ch1t){ renderFoot(); }                    // 誘導ミニ: スコア外・つづけるで進む
  else{ check(); }                               // 採点ミニ: 正しい宣言で判定(ミス0=せいかい)
}
function ch1MiniDiscard(i){
  if(!L||!L.mg||L.checked) return;
  const mg=L.mg;
  if(mg.phase!=='discard'||mg.won) return;
  const five=mg.hand.concat([mg.tsumo]);
  if(i<0||i>=five.length) return;
  if(ch1MiniWin(five)){
    // アガリ見逃し: 学習UIなので切らせず気づきを促す(ミスにはしない・その場で再判断)
    const g=document.getElementById('mg-guide');
    if(g) g.innerHTML='アガれる形になっているよ！もう一度見てみよう！';
    const el=(document.getElementById('mgt-'+i)||{}).firstElementChild;
    if(el){ el.classList.add('ch1-shake');
      setTimeout(()=>{const b2=document.getElementById('mgt-'+i); if(b2&&b2.firstElementChild) b2.firstElementChild.classList.remove('ch1-shake');},500); }
    return;
  }
  if(mg.riichi&&i!==five.length-1){
    // リーチ後は基本ツモ切り(初心者用の簡略化): 手牌の別牌は切らせず軽く案内(ミスにしない)
    const g=document.getElementById('mg-guide');
    if(g) g.innerHTML='リーチしたあとは、基本的にツモった牌をそのまま切るよ';
    const el2=(document.getElementById('mgt-'+i)||{}).firstElementChild;
    if(el2){ el2.classList.add('ch1-shake');
      setTimeout(()=>{const b2=document.getElementById('mgt-'+i); if(b2&&b2.firstElementChild) b2.firstElementChild.classList.remove('ch1-shake');},500); }
    return;
  }
  if(!ch1MiniOk(i)){
    // 組でつかう牌: 切らせない(教材山で必ずアガれる保証)。誘導以外はミスとして記録
    if(!L.qs[L.idx].ch1t) mg.miss++;
    const el=(document.getElementById('mgt-'+i)||{}).firstElementChild;
    if(el) el.classList.add('ch1-shake');
    const g=document.getElementById('mg-guide');
    if(g) g.innerHTML='その牌は組でつかえるよ！ペアや、ならんでいる牌はのこそう。';
    setTimeout(()=>{ const e2=document.getElementById('mgt-'+i); if(e2&&e2.firstElementChild) e2.firstElementChild.classList.remove('ch1-shake'); },500);
    return;
  }
  mg.disc.push(five[i]);
  five.splice(i,1);
  mg.hand=five;              // 牌順は変えない(理牌しない)。ツモ牌はそのまま右はしに定着
  mg.tsumo=null; mg.phase='draw';
  ch1MiniPaint();
}

/* ==== 数牌マッチング(A1-4まとめ・共通再利用可能な小さなマッチングUI) ====
   目的: 萬子/筒子/索子の1〜9(計27種)を「見た瞬間に数字が分かる」か網羅確認する。
   形式: 左=牌 / 右=数字 の2列ペア当て(どちらから先にタップしてもよい)。
   網羅: 各ステップで1〜9を5+4の2セットに分けて全数字を必ず出題(未出題管理)。
   MIX: 1〜9を1回ずつ(セット内で数字重複なし=1対1対応)・3スート混在・1索を必ず含む。
   UI: 正解ペアはslot位置を残したまま非表示(盤面固定原則)・誤答は消さず再回答可。 */
function ch1Match(kind,opt){ return Object.assign({mt:{kind}},opt||{}); }
const CH1MT_NAME={m:'萬子',p:'筒子',s:'索子',mix:'ミックス'};
function ch1MatchInit(q){
  const kind=q.mt.kind;
  let sets;
  if(kind==='mix'){
    // 1〜9を1回ずつ使い、スートを混在させる(=セット内の数字は必ず一意)。
    // 1は必ず「1索」(イソピィ牌も通常の索子の1として認識させる)。各セットに3スートが登場
    let tiles, ok=false, guard=0;
    while(!ok&&guard++<200){
      tiles=shuffle([1,2,3,4,5,6,7,8,9]).map(n=>({n,su:shuffle(['m','p','s'])[0]}));
      tiles.find(x=>x.n===1).su='s';
      const s1=tiles.slice(0,5), s2=tiles.slice(5);
      ok=['m','p','s'].every(su=>s1.some(x=>x.su===su))&&['m','p','s'].every(su=>s2.some(x=>x.su===su));
    }
    sets=[tiles.slice(0,5),tiles.slice(5)].map(g=>g.map(x=>({t:x.n+x.su,n:x.n})));
  }else{
    const nums=shuffle([1,2,3,4,5,6,7,8,9]);   // 1〜9全部を必ず出題(未出題残り=後半セット)
    sets=[nums.slice(0,5),nums.slice(5)].map(g=>g.map(n=>({t:n+kind,n})));
  }
  // 数字側は牌側と別順(位置では答えられない)。偶然同順になったら1つ回転
  const nums=sets.map(set=>{
    let a=shuffle(set.map(x=>x.n));
    if(a.length>1&&a.every((n,i)=>n===set[i].n)) a=a.slice(1).concat([a[0]]);
    return a;
  });
  L.mt={kind, sets, nums, si:0, selT:null, selN:null, gotT:sets[0].map(()=>false),
        gotN:sets[0].map(()=>false), miss:0, finished:false, lock:false};
}
function ch1MtGuideMsg(kind,phase){
  if(phase==='mid') return 'そのちょうし！のこりもペアにしよう！';
  return {m:'牌と、おなじ数字をタップしてペアにしよう！',p:'つぎは筒子！おなじ数字をペアにしよう！',
    s:'つぎは索子！おなじ数字をペアにしよう！',mix:'さいごは、ぜんぶまぜてみよう！'}[kind];
}
function ch1MatchSetHTML(){
  const mt=L.mt, set=mt.sets[mt.si], nums=mt.nums[mt.si];
  let html='<div class="mt-grid" id="mt-grid">';
  for(let i=0;i<set.length;i++){
    const cd=set[i].t;
    html+='<button class="tw mt-t'+(mt.gotT[i]?' mt-done':'')+'" id="mtt-'+i+'" onpointerdown="ch1MtPickT('+i+')">'
      +'<div class="tile '+cd[1]+'">'+tileFace(cd)+'</div></button>';
    html+='<button class="mt-num'+(mt.gotN[i]?' mt-done':'')+'" id="mtn-'+i+'" onpointerdown="ch1MtPickN('+i+')">'
      +nums[i]+'</button>';
  }
  html+='</div>';
  return html;
}
function ch1MtProg(){
  const mt=L.mt;
  return CH1MT_NAME[mt.kind]+'　'+mt.sets.map((s2,i)=>i<mt.si?'●':(i===mt.si?'◎':'○')).join('');
}
function ch1MatchHTML(q){
  const mt=L.mt;
  let html='<div class="q-type">数牌マッチング・'+CH1MT_NAME[mt.kind]+'</div>';
  html+='<div class="teach-card mt-guide-card"><img class="tc-iso" src="'+S1IMG+'" alt="イソピィ">'
    +'<div class="tc-bub" id="mt-guide">'+ch1MtGuideMsg(mt.kind,'start')+'</div></div>';
  html+='<div class="mt-prog" id="mt-prog">'+ch1MtProg()+'</div>';
  html+='<div id="mt-area">'+ch1MatchSetHTML()+'</div>';
  L.sel=null;
  return html;
}
function ch1MtTile(i){ const b=document.getElementById('mtt-'+i); return b?b.firstElementChild:null; }
function ch1MtPickT(i){
  const mt=L.mt; if(!L||L.checked||!mt||mt.lock||mt.finished||mt.gotT[i]) return;
  mt.selT=(mt.selT===i?null:i);
  mt.sets[mt.si].forEach((x,k)=>{ const t=ch1MtTile(k); if(t) t.classList.toggle('sel',mt.selT===k); });
  ch1MtResolve();
}
function ch1MtPickN(j){
  const mt=L.mt; if(!L||L.checked||!mt||mt.lock||mt.finished||mt.gotN[j]) return;
  mt.selN=(mt.selN===j?null:j);
  mt.nums[mt.si].forEach((x,k)=>{ const e=document.getElementById('mtn-'+k); if(e) e.classList.toggle('sel',mt.selN===k); });
  ch1MtResolve();
}
function ch1MtResolve(){
  const mt=L.mt;
  if(mt.selT===null||mt.selN===null) return;
  const ti=mt.selT, nj=mt.selN;
  const tile=mt.sets[mt.si][ti], num=mt.nums[mt.si][nj];
  const tEl=document.getElementById('mtt-'+ti), nEl=document.getElementById('mtn-'+nj);
  mt.selT=null; mt.selN=null; mt.lock=true;
  if(tile.n===num){
    // 正解: 軽いフィードバック→slot位置を保ったまま非表示(残りは動かさない)
    mt.gotT[ti]=true; mt.gotN[nj]=true;
    if(tEl&&tEl.firstElementChild){ tEl.firstElementChild.classList.remove('sel'); tEl.firstElementChild.classList.add('correct'); }
    if(nEl){ nEl.classList.remove('sel'); nEl.classList.add('ok'); }
    setTimeout(()=>{
      if(tEl) tEl.classList.add('mt-done');
      if(nEl) nEl.classList.add('mt-done');
      mt.lock=false;
      if(mt.gotT.every(x=>x)) ch1MtNextSet();
    },220);
  }else{
    // 不正解: ペアは消さない・答えは教えない・もう一度(採点対象としてmiss記録)
    mt.miss++;
    if(tEl&&tEl.firstElementChild){ tEl.firstElementChild.classList.remove('sel'); tEl.firstElementChild.classList.add('ch1-shake'); }
    if(nEl){ nEl.classList.remove('sel'); nEl.classList.add('ch1-shake'); }
    setTimeout(()=>{
      const t2=document.getElementById('mtt-'+ti), n2=document.getElementById('mtn-'+nj);
      if(t2&&t2.firstElementChild) t2.firstElementChild.classList.remove('ch1-shake');
      if(n2) n2.classList.remove('ch1-shake');
      mt.lock=false;
    },420);
  }
}
function ch1MtNextSet(){
  const mt=L.mt;
  if(mt.si<mt.sets.length-1){
    mt.si++;
    mt.gotT=mt.sets[mt.si].map(()=>false);
    mt.gotN=mt.sets[mt.si].map(()=>false);
    const a=document.getElementById('mt-area'); if(a) a.innerHTML=ch1MatchSetHTML();
    const p2=document.getElementById('mt-prog'); if(p2) p2.innerHTML=ch1MtProg();

  }else{

    L.actDone=true;
    const p2=document.getElementById('mt-prog'); if(p2) p2.innerHTML=ch1MtProg().replace(/◎/,'●');
    check();
  }
}

/* ---- 問題ビルダー(正解インデックスは必ずバリデータ/コード比較で算出) ---- */
function ch1Teach(text,opt){ return Object.assign({ch1t:true,text},opt||{}); }
function ch1SamePick(target,distractors,opt){
  // そっくりさん探し: 正解=targetと完全一致する牌(1枚だけ混ぜること)
  const cands=shuffle([target].concat(distractors));
  const a=cands.findIndex(cd=>cd===target);
  return Object.assign({pick1:true,tlab:'そっくりさん探し',q:'この牌とおなじ牌はどれ？',
    hand:target,cands,a},opt||{});
}
function ch1CompleteRun(baseStr,cands,q,opt){
  // シュンツ完成: 正解=base2枚と合わせてch1IsRunになる牌(候補は1枚だけにすること)
  const base=parseHand(baseStr);
  const c2=shuffle(cands.slice());
  const a=c2.findIndex(cd=>ch1IsRun(base.concat([cd])));
  return Object.assign({pick1:true,tlab:'ならべてみよう',q,hand:baseStr,cands:c2,a},opt||{});
}
function ch1CompleteTriplet(baseStr,cands,q,opt){
  const base=parseHand(baseStr);
  const c2=shuffle(cands.slice());
  const a=c2.findIndex(cd=>ch1IsTriplet(base.concat([cd])));
  return Object.assign({pick1:true,tlab:'あつめてみよう',q,hand:baseStr,cands:c2,a},opt||{});
}
function ch1PairPick(target,distractors,q,opt){
  const c2=shuffle([target].concat(distractors));
  const a=c2.findIndex(cd=>ch1IsPair([target,cd]));
  return Object.assign({pick1:true,tlab:'ペアづくり',q:q||'この牌とペアになる、おなじ牌を選ぼう！',
    hand:target,cands:c2,a},opt||{});
}
function ch1SuitMulti(cands,suit,q,opt){
  // 種類あつめ: 正解=そのスートの数牌ぜんぶ
  const c2=shuffle(cands.slice());
  const answers=c2.map((cd,i)=>({cd,i})).filter(x=>x.cd.length===2&&x.cd[1]===suit).map(x=>x.i);
  return Object.assign({pickm:true,tlab:'なかまあつめ',q,cands:c2,answers},opt||{});
}
function ch1HonorMulti(cands,wantHonor,q,opt){
  // 字牌/数牌あつめ: 正解=字牌(コード1文字)か数牌(2文字)か
  const c2=shuffle(cands.slice());
  const answers=c2.map((cd,i)=>({cd,i})).filter(x=>(x.cd.length===1)===wantHonor).map(x=>x.i);
  return Object.assign({pickm:true,tlab:'なかまあつめ',q,cands:c2,answers},opt||{});
}
function ch1PairMulti(cands,q,opt){
  // トイツさがし: 正解=リストの中に「ちょうど2枚」ある牌ぜんぶ(3枚以上は並べないこと)
  const cnt={}; cands.forEach(cd=>cnt[cd]=(cnt[cd]||0)+1);
  const c2=shuffle(cands.slice());
  const answers=c2.map((cd,i)=>({cd,i})).filter(x=>cnt[x.cd]===2).map(x=>x.i);
  return Object.assign({pickm:true,tlab:'トイツさがし',q,cands:c2,answers},opt||{});
}
function ch1HeadMulti(handStr,q,opt){
  // アタマさがし: 形のなかで「ちょうど2枚」の牌がアタマ(3枚はコーツ=メンツ側)。並べたまま出題
  const tiles=sortTiles(parseHand(handStr));
  const cnt={}; tiles.forEach(cd=>cnt[cd]=(cnt[cd]||0)+1);
  const answers=tiles.map((cd,i)=>({cd,i})).filter(x=>cnt[x.cd]===2).map(x=>x.i);
  return Object.assign({pickm:true,tlab:'アタマさがし',
    q:q||'この形のなかで、アタマになっている牌を選ぼう！',cands:tiles,answers},opt||{});
}
function ch1RunMcq(handStr,exp){
  const ok=ch1IsRun(parseHand(handStr));

function ch1MentsuMcq(handStr,exp){

/* ---- C1用ビルダー(正解は必ずch1MiniWin5/ch1MiniWaitsで算出) ---- */
function ch1Mini(hand,wall,target,opt){
  opt=opt||{};
  const q={mini:{hand,wall,target,level:opt.level||2}};
  if(opt.riichi) q.mini.riichi=true;   // D2: リーチあり(テンパイ→宣言→ツモ切り→アガリ宣言)
  if(opt.guided){ q.ch1t=true; q.act=1; q.mini.level=1; }   // 誘導=LEVEL1・スコア外
  if(opt.exp) q.exp=opt.exp;
  return q;
}
function ch1WinMcq5(handStr,exp){
  const ok=!!ch1MiniWin5(parseHand(handStr));
  return {q:'この5枚、アガリの形になっている？',hand:handStr,
    choices:['アガリの形になっている','なっていない'],a:ok?0:1,exp};
}
function ch1PartMulti(handStr,part,q,exp){
  // アガリ形5枚から「メンツの3枚」or「アタマの2枚」を選ばせる(分解はch1MiniWin5)
  const tiles=sortTiles(parseHand(handStr));
  const win=ch1MiniWin5(tiles);
  const answers=win?(part==='head'?win.headIdx:win.mentsuIdx):[];
  return {pickm:true,tlab:part==='head'?'アタマさがし':'メンツさがし',q,cands:tiles,answers,exp};
}
function ch1WaitPick(handStr,distractors,q,exp){
  // 待ちが1種の4枚形: 「なにが来たらアガリ？」(正解=ch1MiniWaits)
  const hand=parseHand(handStr);
  const waits=ch1MiniWaits(hand);
  const cands=shuffle(waits.concat(distractors));
  const a=cands.findIndex(cd=>waits.includes(cd));
  return {pick1:true,tlab:'なにが来たらアガリ？',q:q||'この手牌、なにが来たらアガリ？',
    hand:handStr,cands,a,exp,grouped:true};
}
function ch1WaitMulti(handStr,cands,exp){
  const waits=ch1MiniWaits(parseHand(handStr));
  const c2=shuffle(cands.slice());
  const answers=c2.map((cd,i)=>({cd,i})).filter(x=>waits.includes(x.cd)).map(x=>x.i);
  return {pickm:true,tlab:'待ちさがし',q:'この手牌の待ちを、ぜんぶ選ぼう！',
    hand:handStr,cands:c2,answers,exp,grouped:true};
}
/* D2-2: リーチできる？(正解=ch1MiniWaitsでテンパイ判定・鳴きなし前提を問題文に明記) */
function d2RiichiMcq(handStr,exp){
  const a=ch1MiniWaits(parseHand(handStr)).length?0:1;
  return {q:'この13枚（鳴かずに自分の手だけで作っている）。「リーチ！」できる？',hand:handStr,
    choices:['リーチできる（テンパイ！）','まだできない（テンパイじゃない）'],a,exp,ghand:true};
}
function ch1TenpaiMcq(handStr,exp){
  const a=ch1MiniWaits(parseHand(handStr)).length?0:1;
  return {q:'この手牌はテンパイ？',hand:handStr,choices:['テンパイしている','していない'],a,exp,ghand:true};
}

/* ---- C2用ビルダー(正解は必ずch1MiniWin8/ch1MiniWaitsで算出) ---- */
function ch1GapsOf(tiles){
  // 理牌済みタイル列の「つながらない場所」(後ろにスキマを入れるインデックス)を返す
  const gaps=[];
  for(let i=0;i<tiles.length-1;i++){
    const t=tiles[i], n=tiles[i+1];
    const linked=(t===n)||(t.length===2&&n.length===2&&t[1]===n[1]&&(+n[0]-+t[0])<=1);
    if(!linked) gaps.push(i);
  }
  return gaps;
}
function ch1WinMcq8(handStr,exp){
  const ok=!!ch1MiniWin8(parseHand(handStr));
  return {q:'この8枚、アガリの形になっている？',hand:handStr,
    choices:['アガリの形になっている','なっていない'],a:ok?0:1,exp};
}
function ch1Part8Multi(handStr,part,q,exp){
  // 8枚アガリ形から「メンツの6枚(2組とも)」or「アタマの2枚」を選ばせる(分解はch1MiniWin8)
  const tiles=sortTiles(parseHand(handStr));
  const win=ch1MiniWin8(tiles);
  const answers=win?(part==='head'?win.headIdx.slice():win.mentsuIdx.concat(win.mentsu2Idx)):[];
  answers.sort((a,b)=>a-b);
  return {pickm:true,tlab:part==='head'?'アタマさがし':'メンツさがし',q,cands:tiles,answers,exp};
}
function ch1JunkPick(handStr,opt){
  /* C2-3 いらない牌さがし(牌姿認識・牌効率ではない):
     8枚=「メンツ+トイツ2つ+余り1枚」型の固定教材のみを使う。
     正解(決定論)=「その1枚を除いた7枚に待ちが残る」牌がちょうど1つ、をテストで強制。
     ※アガリ形の8枚は使わない(完成していたら切らずにアガリ、という既習と矛盾させない) */
  opt=opt||{};
  const tiles=sortTiles(parseHand(handStr));
  const junks=tiles.map((t,i)=>i).filter(i=>{
    const rest=tiles.slice(); rest.splice(i,1);
    return ch1MiniWaits(rest).length>0;
  });
  const a=junks.length===1?junks[0]:-1;   // 一意でない教材は-1(テストで検出して排除)
  const q={pick1:true,tlab:'いらない牌さがし',
    q:opt.q||'この8枚のなかで、どの組にも入っていない“余っている牌”を選ぼう！',
    cands:tiles,a,exp:opt.exp};
  if(opt.grouped) q.cgaps=ch1GapsOf(tiles);   // 前半: 組ごとのスキマで見やすく(後半はスキマなし)
  return q;
}

function ch1PartNMulti(handStr,part,q,exp){
  // 5/8/11枚アガリ形から「メンツ全部」or「アタマの2枚」を選ばせる(分解は共通ch1MiniWin)
  const tiles=sortTiles(parseHand(handStr));
  const win=ch1MiniWin(tiles);
  let answers=[];
  if(win){
    answers=part==='head'?win.headIdx.slice()
      :win.mentsuSets.reduce((a,g)=>a.concat(g),[]);
    answers.sort((x,y)=>x-y);
  }
  return {pickm:true,tlab:part==='head'?'アタマさがし':'メンツさがし',q,cands:tiles,answers,exp};
}

function ch1ThemeUnlocked(t){

  if(!t||!t.requires) return true;

}
function startThemeLesson(tid,idx){
  const t=themeOf(tid); if(!t) return;
  const list=themeLessons(t);
  if(idx<0||idx>=list.length) return;
  if(!ch1ThemeUnlocked(t)){                     // 前提テーマ未クリア: 開始しない
    openModal('<h3>🔒 まだロック中</h3><p>「'+themeOf(t.requires).title+'」をぜんぶクリアすると解放されるよ。</p>'
      +'<button class="btn gray" onclick="closeModal()">とじる</button>');
    return;
  }
  if(idx>themeFrontier(t)){                     // 順次アンロック: 未解放マスは開始しない
    openModal('<h3>🔒 まだロック中</h3><p>前のレッスンをクリアすると解放されるよ。</p>'
      +'<button class="btn gray" onclick="closeModal()">とじる</button>');
    return;
  }
  if(!staminaFree()&&S.hearts<=0){ staminaModal(); return; }
  const c=COURSES.find(x=>x.id===t.course);
  const qs=buildThemeQuestions(c,list[idx].diff,list[idx].qn);
  if(!qs.length) return;
  // ロード＝学ぶ場所: レーティングは動かさない（トレーニングのみ変動）
  // baseN=基本問題数(EXP/正解率/PERFECTの基準)。review=レッスン内復習キュー(ロードのレッスン専用。
  // トレーニングはタイム比較、Compareは条件比較が目的のため復習は入れない)
  L={course:c,themeId:tid,lessonIndex:idx,qs,idx:0,correct:0,sel:null,checked:false,done:false,
     rcat:null,ratingStart:null,startedAt:Date.now(),combo:0,maxCombo:0,
     baseN:qs.length,baseAnswered:0,seq:0,review:[],
     teachN:qs.filter(x=>x&&x.ch1t).length};  // 第1章: Teach問数(正解率/PERFECT分母から除外)
  document.getElementById('lesson').classList.add('show');
  renderQ();
}
/* 復習キューから次に出す1問を選ぶ。出せる問題がなければnull。
   strict(基本問題が残っている間): 間隔REVIEW_GAP以上空いたものだけ差し込む。
   relaxed(基本問題を出し切った回収フェーズ): 最も間隔が空いたものから出す
   (最終問題でミスした場合など間隔を満たせないときも、レッスン終了保証を優先して出す)。
   出題する問題は元Questionの浅いコピー(_rv付き)で、選択/開示などのUI状態は一切持たない */
function pickReview(relaxed){
  if(!L||!L.review) return null;
  const cand=L.review.map((e,k)=>({e,k})).filter(x=>!x.e.resolved&&!x.e.needsReview&&!x.e.inFlight);
  if(!cand.length) return null;
  const gap=x=>L.seq-x.e.lastMissSeq;
  let pick=cand.filter(x=>gap(x)>=REVIEW_GAP).sort((a,b)=>a.e.lastMissSeq-b.e.lastMissSeq)[0]||null;
  if(!pick&&relaxed) pick=cand.sort((a,b)=>gap(b)-gap(a))[0];
  if(!pick) return null;
  pick.e.attempts++; pick.e.inFlight=true;
  return Object.assign({},pick.e.q,{_rv:{k:pick.k,attempt:pick.e.attempts}});
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

}

/* ============================================================
   v3 P2-B: 責務分離
   1) QFORMATS  … questionType別レンダラー（render/回答取り出し/正解開示/文言）
   2) SCORERS   … 純粋関数 (Question, UserAnswer) → ScoreResult
   3) applyOutcome … 進行・報酬処理（answered/correct・ハート・レーティング・ログ・保存）
   4) renderFeedback … フィードバック描画（マーク・変動・デバッグ・スタミナ切れ）
   挙動はP2-A時点の完全再現（ゴールデンテストで固定）。
   ============================================================ */
function qFormatKey(q){
  if(q.mini) return 'mini';       // 第1章C: 4枚ミニ麻雀(体験ゲーム。ch1t併用=誘導・スコア外)
  if(q.mt) return 'match';        // A1-4: 数牌マッチング(Duolingo型ペア当て。将来他教材でも再利用可)
  if(q.ch1t) return 'teach';      // 第1章: 教えるページ(スコア外・check()非経由)
  if(q.pick1) return 'pickone';   // 第1章: 牌を1枚えらぶ
  if(q.pickm) return 'pickmulti'; // 第1章: 牌を複数えらぶ
  if(q.sr) return 'riichi';  // P5: 承認済みリーチ判断問題（レーティング対象の2択）
  if(q.u1) return 'ukeire1'; // P5: 1シャンテン受け入れ当て（待ち当てと同UI）
  // 第一情報源: v3 questionType（P1注釈または問題データ自身）
  const qt=(q.v3&&q.v3.questionType)||q.questionType||null;
  if(qt==='discard') return 'discard';
  if(qt==='tile_select') return q.wtype?'waits':'tchoices';
  if(qt==='action'||qt==='multiple_choice') return 'mcq';
  // fallback: 旧フィールドから推定（生成問題・未注釈問題）
  if(q.wtype) return 'waits';
  if(q.gen) return 'discard';
  if(L&&L.course&&L.course.type==='discard') return 'discard';
  if(q.tchoices) return 'tchoices';
  return 'mcq';
}

function goalLabel(level){
  if(level===4) return '1面子＋雀頭（3枚組1つ＋同じ牌2枚）';
  if(level===13) return '4面子＋雀頭（アガリの形）';
  return ((level-1)/3)+'面子＋雀頭';
}

    cat:null, scoring:'idxset',

      html+='<div class="q-text">'+q.q+'</div>';
      if(q.hand) html+=(q.grouped?'<div class="tc-lab">手牌</div>'+ch1HandGrouped(q.hand):handHTML(q.hand));
      if(q.grouped) html+='<div class="tc-lab">↓ この中からえらぼう</div>';
      // 複数選択(共通UI): タップ選択に加え「押したままなぞる」連続選択を標準対応
      html+='<div class="ch1-cands" onpointerdown="ch1CandDown(event)">'+q.cands.map((cd,i)=>
        '<button class="tw" id="ckb-'+i+'">'
        +'<div class="tile '+(cd.length===2?cd[1]:'z')+'">'+tileFace(cd)+'</div></button>'
        +(q.cgaps&&q.cgaps.includes(i)?'<span class="hand-gap"></span>':'')).join('')+'</div>';
      html+='<p class="ch1-hint">タップ、または おしたまま横になぞって まとめて選択できるよ</p>';
      L.sel=new Set();
      return html;
    },
    answer(q){ return {kind:'idxSet', set:L.sel}; },
    reveal(q,ans,res){
      for(const i of q.answers){
        const el=ch1CkTile(i); if(!el) continue;
        if(ans.set.has(i)){ el.classList.remove('sel'); el.classList.add('correct'); }
        else el.classList.add('miss');
      }
      for(const i of ans.set){
        if(q.answers.includes(i)) continue;
        const el=ch1CkTile(i);
        if(el){ el.classList.remove('sel'); el.classList.add('wrong'); }
      }
    },
    feedback(q,res){
      const d=res.details||{};
      let diff='';
      if(d.miss&&d.miss.length) diff+='<br>❌ えらび忘れ： '+d.miss.map(i=>tileLabel(q.cands[i])).join('・');
      if(d.extra&&d.extra.length) diff+='<br>⚠️ ちがう牌を選んだ： '+d.extra.map(i=>tileLabel(q.cands[i])).join('・');
      return {ansText:'正解： '+q.answers.map(i=>tileLabel(q.cands[i])).join('・')+diff, expText:q.exp||''};
    },
  },
};

/* ---- scorer: 副作用なしの純粋関数 (Question, UserAnswer) → ScoreResult ---- */
const SCORERS={
  binary:(q,ans)=>{
    const ok=ans.index===q.a;
    return {S:ok?1:0, isCorrect:ok, isPerfect:ok, details:null};
  },
  match:(q,ans)=>{
    // 数牌マッチング: 全ペア完了+誤マッチ0回でせいかい(ミニ麻雀と同じ思想)
    const ok=!!ans.done&&ans.miss===0;
    return {S:ok?1:0, isCorrect:ok, isPerfect:ok, details:{miss:ans.miss}};
  },
  mini:(q,ans)=>{
    // 4枚ミニ麻雀: アガリ到達+誤discard(組の牌を切ろうとした)0回でせいかい。
    // 教材山は必ずアガれる設計のため、doneは実質常にtrue(ミスの有無だけを採点)
    const ok=!!ans.done&&ans.miss===0;
    return {S:ok?1:0, isCorrect:ok, isPerfect:ok, details:{miss:ans.miss||0}};
  },
  idxset:(q,ans)=>{
    // 第1章pickmulti: インデックス集合の採点。待ち当てと同じ max(0,(当てた数-誤選択数)/正解数)
    const want=new Set(q.answers);
    let hit=0, wrongN=0;
    for(const i of ans.set){ if(want.has(i)) hit++; else wrongN++; }
    const S=Math.max(0,(hit-wrongN)/(want.size||1));
    const miss=q.answers.filter(i=>!ans.set.has(i));
    const extra=[...ans.set].filter(i=>!want.has(i));
    return {S, isCorrect:S>=1, isPerfect:S>=1, details:{miss,extra}};
  },
  waits:(q,ans)=>{
    const S=qualityWaits(ans.set,q.waits);
    return {S, isCorrect:S>=1, isPerfect:S>=1, details:{waitCount:q.waits.length}};
  },
  ukeire1:(q,ans)=>{
    const St=qualityWaits(ans.set,q.accepts); // 牌採点は待ち当てと同一: max(0,(当てた数-誤選択数)/正解数)
    const miss=q.accepts.filter(a=>!ans.set.has(a));
    const extra=[...ans.set].filter(x=>!q.accepts.includes(x));
    if(q.full){
      // 本番形: 形の判定30% + 受け入れ70%。両方完答で◎
      const patOK=ans.pat===q.pattern;
      const S=0.3*(patOK?1:0)+0.7*St;
      return {S, isCorrect:S>=0.999, isPerfect:S>=0.999,
        details:{acceptCount:q.accepts.length, patOK, tileS:St, miss, extra}};
    }
    return {S:St, isCorrect:St>=1, isPerfect:St>=1,
      details:{acceptCount:q.accepts.length, miss, extra}};
  },
  ukeire:(q,ans)=>{
    const S=qualityNanikiru(q,ans.tile);
    return {S, isCorrect:ans.tile===q.a, isPerfect:S>=1, details:{chosen:ans.tile}};
  },
};

/* ================= レッスンシェル ================= */
function renderQ(){
  if(L.course.training&&!L.qs[L.idx]){
    const lv=pickTargetLv(L.rcat);
    L.qs[L.idx]=L.rcat==='waits'?genWaitsAt(lv):genNanikiruAt(lv);
  }
  const q=L.qs[L.idx];
  L.sel=null; L.checked=false; L.actDone=false;
  // 進捗バー: 復習ありレッスンは「基本問題の消化率」(復習問題ではバーを進めない。
  // 基本10問終了後の復習回収フェーズは満タンのまま、下の復習チップで残数を示す)
  const frac=L.review?Math.min(1,L.baseAnswered/(L.baseN||1)):(L.idx/L.qs.length);
  document.getElementById('pbar-fill').style.width=(frac*100)+'%';
  document.getElementById('lesson-hearts').textContent='❤️'+(staminaFree()?'∞':S.hearts);
  const area=document.getElementById('q-area');
  let pre='';
  // 復習問題の表示: 責めずに「もう一度」のポジティブな一言だけ(第7段階追加改善)
  if(q._rv&&L.review){
    const rest=L.review.filter(e=>!e.resolved&&!e.needsReview).length;
    pre+='<div class="rv-chip">🔁 もう一度チャレンジ！'+(rest>1?'（復習 あと'+rest+'問）':'')+'</div>';
  }
  if(q.compareId){
    pre+='<div class="q-type">くらべる問題 '+q.compareStep+'</div>';
    if(q.showCompareBanner) pre+=compareBannerHTML(q);
  }
  area.innerHTML=pre+QFORMATS[qFormatKey(q)].render(q);
  area.scrollTop=0;
  L.qStart=Date.now();
  renderFoot();
}
function selChoice(i){
  if(L.checked) return;
  L.sel=i;
  const q=L.qs[L.idx];
  const n=(q.tchoices||q.choices).length;
  for(let k=0;k<n;k++){ const el=document.getElementById('ch-'+k); if(el) el.classList.toggle('sel',k===i); }
  renderFoot();
}
function selTile(i){
  if(L.checked) return;
  const tiles=sortTiles(parseHand(L.qs[L.idx].hand));
  L.sel=i;
  tiles.forEach((t,k)=>{ const el=document.getElementById('ht-'+k); if(el) el.classList.toggle('sel',k===i); });

/* 第1章: 牌タップ選択(pickone=単選 / pickmulti=トグル)。
   候補牌はタップ領域拡大のためbutton.tw>div.tile構造(選択/開示クラスは内側tileへ) */
function ch1CkTile(i){ const b=document.getElementById('ckb-'+i); return b?b.firstElementChild:null; }
function ch1Pick(i){
  if(!L||L.checked) return;
  const q=L.qs[L.idx]; if(!q) return;
  if(q.pickm){
    if(L.sel.has(i)) L.sel.delete(i); else L.sel.add(i);
    const el=ch1CkTile(i); if(el) el.classList.toggle('sel',L.sel.has(i));
  }else{
    L.sel=i;
    for(let k=0;k<q.cands.length;k++){ const el=ch1CkTile(k); if(el) el.classList.toggle('sel',k===i); }
  }
  renderFoot();
}
/* なぞり選択(アプリ共通UI仕様): 複数牌選択問題では、押したまま牌の上を滑らせると
   通過した牌をその場で「追加選択」できる(1gesture中は訪問済み管理で往復しても解除しない)。
   動かずに離した場合は従来のタップ(トグル選択/解除)。入力方法のみでScorerは不変。
   pointerdown+pointermove(elementFromPoint)方式=touch/mouse/pen共通・click二重発火なし */
function ch1SelAdd(i){
  if(!L||L.checked||!(L.sel instanceof Set)) return;
  if(!L.sel.has(i)){ L.sel.add(i); const t=ch1CkTile(i); if(t) t.classList.add('sel'); renderFoot(); }
}
function ch1CandDown(ev){
  if(!L||L.checked) return;
  const q=L.qs[L.idx]; if(!q||!q.pickm) return;
  const startBtn=ev.target.closest?ev.target.closest('button.tw'):null;
  if(!startBtn||!startBtn.id||startBtn.id.indexOf('ckb-')!==0) return;
  ev.preventDefault();
  const idxOf=b=>parseInt(b.id.slice(4),10);
  const visited=[idxOf(startBtn)];        // 訪問済み: 往復しても反転させない
  let drag=false;
  const hit=e=>{
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const b=el&&el.closest?el.closest('button.tw'):null;
    return (b&&b.id&&b.id.indexOf('ckb-')===0)?b:null;
  };
  const move=e=>{
    if(!L||L.checked) return;
    const b=hit(e); if(!b) return;        // 牌の隙間を通ってもgestureは継続
    const i=idxOf(b);
    if(visited.includes(i)) return;
    if(!drag){ drag=true; ch1SelAdd(visited[0]); }  // ドラッグ確定: 1枚目も追加選択に切替
    visited.push(i);
    ch1SelAdd(i);                          // 通過した瞬間にリアルタイムで選択
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    if(!drag) ch1Pick(visited[0]);        // 動かなかった=通常タップ(トグル)
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}
/* 第1章Teach: 体験操作(牌をならべてみる等)。結果表示+牌ゆらしで「さわった」実感を返す */
function ch1Act(){
  if(!L) return;
  const q=L.qs[L.idx]; if(!q||!q.ch1t||!q.act) return;
  L.actDone=true;
  const b=document.getElementById('ch1-act'); if(b) b.disabled=true;
  const r=document.getElementById('ch1-act-res'); if(r) r.innerHTML=q.act.result;
  document.querySelectorAll('#q-area .hand .tile').forEach(el=>el.classList.add('ch1-shake'));
  renderFoot();
}
/* 第1章Teach: スコア外で次へ。applyOutcomeを通らないためEXP/正解率/コンボ/ハートは一切動かない。
   進捗バーと復習の間隔管理のためにseq/baseAnsweredだけ進める */
function teachNext(){
  if(!L||L.checked) return;
  const q=L.qs[L.idx]; if(!q||!q.ch1t) return;
  if(q.act&&!L.actDone) return;
  L.checked=true;                 // next()の未回答ガードを通すため(直後にnext→renderQでfalseへ戻る)
  if(L.review){ L.seq++; L.baseAnswered++; }
  next();
}
function toggleNum(n){
  if(L.checked) return;
  const eln=document.getElementById('np-'+n);
  if(eln&&eln.disabled) return;  // 4枚使用済み牌は選択不可

}
function toggle34(cd){
  if(L.checked) return;
  const elc=document.getElementById('np34-'+cd);
  if(elc&&elc.disabled) return;  // 4枚使用済み牌は選択不可
  if(L.sel.has(cd)) L.sel.delete(cd); else L.sel.add(cd);
  document.getElementById('np34-'+cd).classList.toggle('sel',L.sel.has(cd));

// なぞり選択: 押したまま滑らせると通過した牌を連続で選択/解除できる。
// 最初に触れた牌の状態で「選択モード/解除モード」を決め、ドラッグ中は同じ操作を適用する。
function pickDrag(ev,kind){
  if(!L||L.checked) return;
  const inPicker=b=>b&&b.id&&b.id.indexOf(kind+'-')===0&&!b.disabled;
  const start=ev.target.closest?ev.target.closest('button.tile'):null;
  if(!inPicker(start)) return;
  ev.preventDefault();
  const keyOf=b=>{const k=b.id.slice(kind.length+1); return kind==='np'?parseInt(k,10):k;};
  const mode=!L.sel.has(keyOf(start));
  const visited=new Set();
  const apply=b=>{
    if(visited.has(b.id)) return;
    visited.add(b.id);
    const key=keyOf(b), has=L.sel.has(key);
    if(mode&&!has){ L.sel.add(key); b.classList.add('sel'); }
    else if(!mode&&has){ L.sel.delete(key); b.classList.remove('sel'); }
    renderFoot();
  };
  apply(start);
  const move=e=>{
    if(!L||L.checked) return;
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const b=t&&t.closest?t.closest('button.tile'):null;
    if(inPicker(b)) apply(b);
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}
function selPat(i){
  if(L.checked) return;
  L.patSel=i;
  for(let k=1;k<=4;k++){ const el=document.getElementById('pat-'+k); if(el) el.classList.toggle('sel',k===i); }
  renderFoot();
}
function renderFoot(){
  const foot=document.getElementById('lesson-foot');
  foot.className='lesson-foot';
  const qNow=L.qs[L.idx];
  if(qNow&&qNow.mt&&!L.checked){
    foot.innerHTML='<button class="btn" id="answer-btn" disabled>ぜんぶペアにしよう！</button>';
    return;
  }
  if(qNow&&qNow.mini&&!L.checked){
    // ミニ麻雀: こたえあわせボタンなし。誘導(ch1t)はアガリ後つづける、採点対象はアガリで自動check()
    if(qNow.ch1t){
      const okM=!!(L.mg&&L.mg.won);
      foot.innerHTML='<button class="btn" id="answer-btn" '+(okM?'':'disabled')+' onclick="teachNext()">つづける</button>';
    }else{
      foot.innerHTML='<button class="btn" id="answer-btn" disabled>アガリをめざそう！</button>';
    }
    return;
  }
  if(qNow&&qNow.ch1t){
    // 第1章Teach: こたえあわせなし。体験操作(q.act)がある場合は終えるまで進めない
    const ok=!qNow.act||L.actDone;
    foot.innerHTML='<button class="btn" id="answer-btn" '+(ok?'':'disabled')+' onclick="teachNext()">つづける</button>';
    return;
  }
  const patReady=!(qNow&&qNow.full)||L.patSel!=null;
  const ready=L.sel!==null&&(!(L.sel instanceof Set)||L.sel.size>0)&&patReady;
  foot.innerHTML='<button class="btn" id="answer-btn" '+(ready?'':'disabled')+' onclick="answerNow(this)">こたえあわせ</button>';
}
// こたえあわせ: 押した瞬間に押下状態+disabledで反応を見せ、描画後に判定する(二重タップ防止)。
// 判定はローカルで即時完了するため人工的な待ち時間は入れない。
function answerNow(btn){
  if(!L||L.checked) return;
  btn.disabled=true;
  btn.classList.add('pressing');
  btn.textContent='判定中…';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(L&&!L.checked) check(); }));
}

/* ================= Compareフロー（P4-A） =================
   Compareは出題フロー: variantは通常のQuestionで、既存QFORMATS/SCORERSをそのまま使う。
   ロードのレッスンとして実行するため、既存原則（road=学ぶ場所）によりレーティング・能力測定ログは対象外。 */
function buildVariantQuestion(group,variant,index){
  const q=applyPatch(group.baseQuestion, variant.patch);   // baseはdeep copyされ不変
  q.a=variant.a;
  q.exp=variant.exp||'';
  q.lv=variant.lv!=null?variant.lv:3;
  q.compareId=group.id;
  q.variantId=variant.id;
  q.changedCategories=changedCategoriesOf(variant.patch);
  q.compareStep=(index+1)+'/'+group.variants.length;
  q.showCompareBanner=index>0&&variant.patch.length>0;
  return q;
}
function compareBannerHTML(q){

function startCompare(groupId){

function logCompare(entry){

/* ================= 進行・報酬処理 ================= */
function applyOutcome(q,cat,qid,res,elapsed){
  L.checked=true;
  // コンボ: 正解で+1、不正解で即0(責めない・小表示のみ)。演出専用のカウンタであり、
  // レーティング計算にもEXP計算式にも一切影響させない(第6段階指示)。maxComboは将来ミッション用に保持。
  L.prevCombo=L.combo||0;
  if(res.isCorrect){ L.combo=(L.combo||0)+1; if(L.combo>(L.maxCombo||0)) L.maxCombo=L.combo; }
  else L.combo=0;
  // デイリーミッション: 5COMBO到達(学習ロードのみ・復習中の到達もOK・二重達成はbump側で防止)
  if(L.themeId!=null&&L.combo>=5) bumpMission('dm_combo',1);
  if(cat) L.bigMiss = res.S<0.5 ? (L.bigMiss||0)+1 : 0;
  // L.correctは「基本問題の初回回答」だけを数える(EXP/正解率/PERFECTの基準)。
  // 復習(_rv付き)の正解はEXP・正解率へ加算しない(復習はEXP稼ぎでなく学習機会)
  S.answered++; if(res.isCorrect){S.correct++; if(!q._rv) L.correct++;}
  // レッスン内復習キュー管理(ロードのレッスンのみ。L.reviewはstartThemeLessonでのみ初期化)
  if(L.review){
    L.seq++;
    if(!q._rv) L.baseAnswered++;
    if(q._rv){
      const e=L.review[q._rv.k];
      if(e){
        e.inFlight=false;
        if(res.isCorrect){ e.resolved=true; }               // 復習クリア
        else if(e.attempts>=REVIEW_MAX){ e.needsReview=true; } // 上限到達: 未解決のまま記録に残す
        else { e.lastMissSeq=L.seq; }                        // 間隔を空けてキューの後ろへ
      }
    }else if(!res.isCorrect){
      L.review.push({q,no:L.seq,attempts:0,resolved:false,needsReview:false,
        lastMissSeq:L.seq,inFlight:false});
    }
  }
  if(!res.isCorrect&&!staminaFree()){ S.hearts=Math.max(0,S.hearts-1); }
  // レーティング更新＋回答ログ（トレーニングのみ。ロードは学ぶ場所なので変動なし。XPには影響しない）
  let ratingRes=null;
  if(cat&&L.course.training){
    const isReview=(cat==='nanikiru'&&q.curated)?!!S.seenNk[qid]
      :(cat==='riichi')?!!S.seenRq[qid]:false;
    ratingRes=ratingUpdate(cat,q.lv,res.S,isReview);
    if(cat==='nanikiru'&&q.curated) S.seenNk[qid]=true;
    if(cat==='riichi') S.seenRq[qid]=true;
    const vm=v3MetaOf(q);
    logAnswer({
      category:cat,
      questionId:qid,
      questionType:vm?vm.questionType:null,
      primarySkill:vm?vm.primarySkill:null,
      learningDepth:vm?vm.learningDepth:null,
      seed:(q.seed!==undefined?q.seed:null),
      featureSignature:q.fs||null,
      questionLv:q.lv,
      difficulty:q.lv*10+5,
      ratingBefore:ratingRes.R0,
      ratingAfter:ratingRes.R1,
      S:res.S,
      isReview,
      elapsedTime:elapsed,
      answeredAt:new Date().toISOString()
    });
  }
  save();
  return ratingRes;
}

/* ================= フィードバック描画 ================= */
function renderFeedback(q,cat,res,ratingRes,fb){
  document.getElementById('lesson-hearts').textContent='❤️'+(staminaFree()?'∞':S.hearts);
  let ratingLine='';
  if(ratingRes){
    const up=ratingRes.R1>=ratingRes.R0;
    ratingLine='<p class="fb-rate '+(up?'up':'down')+'">'+CAT_LABEL[cat]+' '
      +Math.floor(ratingRes.R0)+' → '+Math.floor(ratingRes.R1)+(up?' ▲':' ▼')+'</p>';
  }
  let dbgLine='';
  if(S.dev&&cat){
    const dd=q.lv*10+5;
    dbgLine='<p class="dbg">DEV Lv'+q.lv+' d'+dd
      +(q.dbg?(' sh'+q.dbg.sh+' 受'+q.dbg.ub+'/次'+q.dbg.us+' 候補'+q.dbg.cand):'')
      +(q.wtype?(' 待ち'+q.waits.length+'種'):'')
      +' S='+(res.S!=null?res.S.toFixed(2):'-')
      +(ratingRes?(' R '+ratingRes.R0.toFixed(2)+'→'+ratingRes.R1.toFixed(2)+' K'+ratingRes.K):' (ロード:変動なし)')
      +' seed:'+(q.seed!=null?q.seed:'-')+'</p>';
  }
  const foot=document.getElementById('lesson-foot');
  const mark=cat?qualityMark(res.S,cat):null;
  const cls=mark?mark.cls:(res.isCorrect?'ok':'ng');
  const title=mark?mark.label:(res.isCorrect?'せいかい！ 🎉':'ざんねん…');
  // 実機レビュー第1回: 結果・解説は問題の直下にカードで連続表示し、
  // 下部固定フットにはボタンだけを残す(問題とフィードバックの間の巨大空白を解消)
  const staminaOut=!staminaFree()&&S.hearts<=0&&!res.isCorrect;
  // コンボ表示(第7段階): 「正解！」と同じ行の右側に配置して常に目に入るように。
  // 節目(COMBO_MILESTONES)は加えて中央オーバーレイの専用演出(下)。
  // 不正解時は責めずに「コンボ終了」を小さく出すのみ(2連続以上続いていた場合のみ)。
  let comboChip='', comboEnd='';
  const milestone=!staminaOut&&res.isCorrect&&COMBO_MILESTONES[L.combo]!=null;
  if(!staminaOut){
    if(res.isCorrect&&(L.combo||0)>=2){
      comboChip='<span class="fb-combo'+(milestone?' big':'')+'">🔥 '+L.combo+' COMBO</span>';
    }else if(!res.isCorrect&&(L.prevCombo||0)>=2){
      comboEnd='<div class="combo-end">コンボ終了（'+L.prevCombo+'まで続いた）</div>';
    }
  }
  // 復習クリア: さっき間違えた問題を取り返せたことを小さく示す(コンボ節目より弱い表示のみ)
  const rvClear=(!staminaOut&&q._rv&&res.isCorrect)?'<div class="rv-clear">🔁 復習クリア ✓</div>':'';
  const card='<div class="fb-card '+(staminaOut?'ng':cls)+'" id="fb-card">'
    +'<div class="fb-head"><p class="fb-title '+(staminaOut?'ng':cls)+'">'
    +(staminaOut?'スタミナが切れた…':title)+'</p>'+comboChip+'</div>'
    +rvClear+comboEnd+ratingLine+dbgLine
    +(!staminaOut&&fb.ansText?'<p class="fb-exp"><b>'+fb.ansText+'</b></p>':'')
    +'<p class="fb-exp">'+fb.expText+'</p>'
    +'</div>';
  const area=document.getElementById('q-area');
  area.insertAdjacentHTML('beforeend',card);
  foot.className='lesson-foot '+cls;
  foot.innerHTML=staminaOut
    ?'<button class="btn red" onclick="quitLesson();staminaModal()">レッスン終了</button>'
    :'<button class="btn'+(cls==='ng'?' red':'')+'" onclick="next()">つづける</button>';
  // 解説へ自動スクロール: 画面に収まる解説はカード全体をボタンの上に収め、
  // 1画面より長い解説はカード先頭から自然に読み始められる位置へ(下へスクロールで続き)
  requestAnimationFrame(()=>{
    const fc2=document.getElementById('fb-card');
    if(!fc2) return;
    const visible=area.clientHeight-foot.offsetHeight;
    const cardTop=fc2.getBoundingClientRect().top-area.getBoundingClientRect().top+area.scrollTop;
    const target=fc2.offsetHeight<=visible-16 ? area.scrollHeight : cardTop-8;
    area.scrollTo({top:target, behavior:'smooth'});
  });
  // 節目コンボ専用演出(Level3): 中央に約1秒ポップ。解説は上で既に表示済み・進行も塞がない
  if(milestone){
    playFx('<div class="fx-ico">🔥</div><div class="fx-t">'+L.combo+' COMBO!</div>'
      +'<div class="fx-s">'+COMBO_MILESTONES[L.combo]+'</div>','fx-combo',MOTION.comboMilestone);
  }
}

/* ================= 判定（薄いオーケストレーション） ================= */
function check(){
  if(L.checked) return;  // 二重実行防止(連打対策)
  const q=L.qs[L.idx];
  const elapsed=Date.now()-(L.qStart||Date.now());
  const fmt=QFORMATS[qFormatKey(q)];
  const ans=fmt.answer(q);
  const res=SCORERS[fmt.scoring](q,ans);
  const cat=fmt.cat, qid=cat?fmt.qid(q):null;
  fmt.reveal(q,ans,res);
  const ratingRes=applyOutcome(q,cat,qid,res,elapsed);
  if(q.compareId){
    // Compare学習履歴: 能力測定ログ(jantore-anslog)とは別ストア。Ratingの根拠には使わない。
    logCompare({compareId:q.compareId,variantId:q.variantId,changedCategories:q.changedCategories,
      S:res.S,isCorrect:res.isCorrect,answeredAt:new Date().toISOString()});
  }
  renderFeedback(q,cat,res,ratingRes,fmt.feedback(q,res));
}
function next(){
  // 二重実行防止(第7段階): 未回答時・終了処理後の「つづける」連打では進まない
  // (renderQがL.checked=falseへ戻すため、連打の2回目以降はここで止まる)
  if(!L||L.done||!L.checked) return;
  L.idx++;
  if(L.course.compare&&L.idx>=L.qs.length&&!L.contrastShown){ showContrast(); return; }
  // レッスン内復習の差し込み: 間隔を満たした復習問題を次の1問として出す。
  // 基本問題を出し切った後は、残った復習を回収し切るまでレッスンを終了しない
  // (基本問題数の消化だけでは終了しない。needsReviewだけが残った時点で終了可能)
  if(L.review){
    const nq=pickReview(L.idx>=L.qs.length);
    if(nq){ L.qs.splice(L.idx,0,nq); renderQ(); return; }
  }
  if(L.idx>=L.qs.length){ finishLesson(); } else { renderQ(); }
}

/* ================= レッスン終了 ================= */
// 直近クリアしたマス/解放されたマスの演出用メモ(ロード復帰時に一度だけ使用・保存しない)
let ROAD_FX=null;
function finishLesson(){
  /* 状態確定フェーズ: 報酬(EXP/gems)・王冠・roadProgress・streak・自己ベストを
     ここで一度だけ確定する。演出(タイマー/CSS animation)には一切依存させず、
     L.doneガードで「つづける」連打等による二重発火・二重付与を防ぐ(第7段階) */
  if(L.done) return;
  L.done=true;
  document.getElementById('pbar-fill').style.width='100%';
  const foot0=document.getElementById('lesson-foot');
  foot0.className='lesson-foot'; foot0.innerHTML='';   // クリア演出中の誤タップ防止
  // L.correct=基本問題の初回正解数(復習正解は含まない)。復習で問題数が増えても
  // 最大EXPは従来どおり(10問なら40)。パーフェクトも基本問題の初回全正解のみ
  const baseN=L.baseN||L.qs.length;
  // 第1章: Teach問はスコア外。全問正解ボーナスの分母はQuiz/Try問のみ(teachN=0なら従来どおり)
  const quizN=Math.max(1,baseN-(L.teachN||0));
  const xp=10+L.correct*3;
  const gems=5+(L.correct===quizN?10:0);
  S.xp+=xp; S.gems+=gems;
  const cid=L.course.id;
  if(!L.course.training) S.crowns[cid]=Math.min(5,(S.crowns[cid]||0)+1);
  // 学習ロード(テーマ制): 現在フロンティアのマスをクリアしたら次のマスを解放。
  // クリア済みマスの再挑戦(lessonIndex<フロンティア)では進捗は動かさない。
  // フロンティア前進時=初回クリア時のみ、小テーマ制覇/大テーマ制覇イベントを検出。
  const roadEvents=[];
  if(L.themeId!=null){
    const t=themeOf(L.themeId);
    const list=themeLessons(t);
    const cur=S.roadProgress[t.id]||0;
    if(L.lessonIndex===cur&&cur<list.length){
      S.roadProgress[t.id]=cur+1;
      ROAD_FX={theme:t.id,cleared:cur,unlocked:(cur+1<list.length)?cur+1:null};
      if(list[cur].isLast) roadEvents.push({type:'subtheme',title:list[cur].sub.title});
      if(cur+1===list.length) roadEvents.push({type:'theme',title:t.title});
    }
  }
  // レッスン単位のクリア時間(開始→終了。バックグラウンド時間の除外は将来ネイティブ化時に精密化)
  const duration=Date.now()-(L.startedAt||Date.now());
  // streak: 「この完了でその日の学習を初達成したか」を更新前に判定(当日初回のみ祝う)
  const today=todayStr();
  const firstToday=!(S.lastDay===today&&S.streak>0);
  if(S.lastDay!==today){
    if(S.lastDay){
      const gap=Math.round((new Date(today)-new Date(S.lastDay))/86400000);
      if(gap===1){ S.streak++; }
      else if(gap>1&&S.freeze>0){ S.freeze--; S.streak++; }
      else if(gap>1){ S.streak=1; }
    }else{ S.streak=1; }
    S.lastDay=today;
  }else if(S.streak===0){ S.streak=1; }
  if(S.streak>(S.bestStreak||0)) S.bestStreak=S.streak;  // 最長連続記録
  // 日別学習履歴(カレンダー用)。将来'protected'(連続記録ブロック)と区別するため状態文字列で保存
  if(S.learningDays[today]!=='protected') S.learningDays[today]='completed';
  // デイリーミッション進行(第8段階): 学習ロードのレッスンのみ対象(トレーニング/Compareは対象外)。
  // EXPミッションは実際に付与された学習EXP(復習水増しなし・宝箱ボーナス対象外)。
  // ストリークとは独立: ミッション未達成でもストリークは上の既存処理どおり継続する
  if(L.themeId!=null){
    bumpMission('dm_lesson',1);
    bumpMission('dm_xp',xp);
  }
  // トレーニング自己ベスト(完走時のみ・種別ごとに分離。将来waits_4等の粒度キーも同じ器で持てる)
  let bestInfo=null;
  if(L.course.training&&L.rcat){
    const key=L.rcat;
    const prev=S.trainingBest[key];
    const isBest=!prev||duration<prev.ms;
    if(isBest) S.trainingBest[key]={ms:duration,at:today};
    bestInfo={key,isBest,prevMs:prev?prev.ms:null,ms:duration};
  }
  // レッスン内復習の結果を専用ストアへ記録(既存の回答ログjantore-anslog-v1には手を付けない。
  // ロードのレッスンは元々レーティング対象外でanslogへ書いていないため、復習の二重記録も発生しない。
  // needsReviewを含むこの記録は将来の「あとで復習」「弱点トレーニング」「AI Coach」の入力になる)
  if(L.review&&L.review.length){
    try{
      const k='jantore-reviewlog-v1';
      const arr=JSON.parse(localStorage.getItem(k)||'[]');
      L.review.forEach(e=>{
        let qid=null;
        try{ const f=QFORMATS[qFormatKey(e.q)]; qid=f.qid?f.qid(e.q):null; }catch(_){}
        arr.push({at:new Date().toISOString(),themeId:L.themeId||null,
          lessonIndex:(L.lessonIndex!=null?L.lessonIndex:null),course:L.course.id,
          originalQuestionId:qid,seed:(e.q.seed!=null?e.q.seed:null),fs:e.q.fs||null,
          lv:(e.q.lv!=null?e.q.lv:null),firstMissNo:e.no,isReview:true,
          reviewAttempts:e.attempts,resolved:!!e.resolved,needsReview:!!e.needsReview});
      });
      if(arr.length>500) arr.splice(0,arr.length-500);
      localStorage.setItem(k,JSON.stringify(arr));
    }catch(e){}
  }
  save();
  // ここまでで報酬・進捗はすべて確定済み。以降は演出のみ:
  // 通常は直接リザルト。初回制覇時のみ COMPLETE または MASTER を1回だけ挟む
  playClearSequence(roadEvents,()=>renderResult({xp,duration,firstToday,bestInfo,cid}));
}
/* 達成演出(第7段階追補×2): 上位が下位を包含し、出るのは最大1回。
   優先順位: 大テーマMASTER > 小テーマCOMPLETE > (なし=直接リザルト)。
   通常Lesson・トレーニング・制覇済み再挑戦は中間演出も待ち時間もなく直接リザルトへ
   (達成の表示はリザルトページ自体が担うため「LESSON CLEAR!」中間演出は廃止)。
   reduced-motion時はplayFx側でスキップされ、進行はタイマーのみで保証される */
function playClearSequence(events,then){
  const ev=(events||[]).find(e=>e.type==='theme')||(events||[]).find(e=>e.type==='subtheme')||null;
  if(!ev){ if(then)then(); return; }
  const s=ev.type==='subtheme'
    ?{cls:'fx-sub',dur:MOTION.subthemeClear,
      html:'<div class="fx-ico">🏅</div><div class="fx-t">'+ev.title+' COMPLETE!</div><div class="fx-s">小テーマ制覇！</div>'}
    :{cls:'fx-theme',dur:MOTION.themeClear,
      html:'<div class="fx-ico">👑</div><div class="fx-t">'+ev.title+' MASTER!</div><div class="fx-s">テーマ制覇！</div>'};
  playFx(s.html,s.cls,s.dur,then);
}
function renderResult(ctx){
  if(!L) return;                                // 演出中に✕で離脱した場合は描画しない(状態は確定済み)
  const {xp,duration,firstToday,bestInfo,cid}=ctx;
  const area=document.getElementById('q-area');
  // 正解率・PERFECTは基本問題の初回回答のみで判定(復習で取り返しても書き換えない=従来と比較可能)
  const baseN=L.baseN||L.qs.length;
  const quizN=Math.max(1,baseN-(L.teachN||0));  // 第1章: Teach問はスコア外
  const perfect=L.correct===quizN;
  const accuracy=Math.round(L.correct/quizN*100);
  const rv=(L.review&&L.review.length)?{n:L.review.length,ok:L.review.filter(e=>e.resolved).length}:null;
  let ratingSummary='';
  if(L.rcat){
    const r0=Math.floor(L.ratingStart), r1=Math.floor(S.ratings[L.rcat]);
    const up=S.ratings[L.rcat]>=L.ratingStart;
    ratingSummary='<div class="rating-strip" style="margin:8px 0 0;"><span class="lab">📈 '+CAT_LABEL[L.rcat]+'</span>'
      +'<b style="color:var(--'+(up?'jade-deep':'verm')+')">'+r0+' → '+r1+(up?' ▲':' ▼')+'</b></div>';
  }
  // リザルトの順次表示(第7段階): 見出し→EXP→正解率→…を短い間隔で(全体約1秒・reduced時は即時表示)
  let SI=2;                                      // 0=絵文字, 1=見出し, 以降は登場順
  const stagStyle=i=>' style="animation-delay:'+(i*MOTION.resultStagger)+'ms"';
  // 当日初回の学習達成のみ、連続記録を大きく祝う(同日2回目以降は通常リザルト)
  const streakCelebrate=firstToday
    ?'<div class="streak-celebrate stag"'+stagStyle(SI++)+'><div class="sc-flame">🔥</div>'
      +'<div class="sc-num">'+S.streak+'</div><div class="sc-label">日連続！</div>'
      +'<p class="sc-sub">今日の学習を達成しました</p></div>'
    :'';
  const statBox=(v,k,extra)=>'<div class="res-box stag'+(extra||'')+'"'+stagStyle(SI++)+'>'
    +'<div class="v">'+v+'</div><div class="k">'+k+'</div></div>';
  const noteStyle='color:var(--ink-soft);font-size:12px;margin:2px 0 0;';
  let stats;
  if(L.course.training&&bestInfo){
    // トレーニング: 正解率・今回タイム・自己ベスト・ランクが中心(ランク基準は設定データ・未設定種別は非表示)
    const rank=rankForTime(bestInfo.key,duration);
    stats='<div class="res-grid">'
      +statBox(accuracy+'%','正解率')
      +statBox(fmtDur(duration,true),'今回タイム')
      +statBox(bestInfo.isBest?fmtDur(duration,true):fmtDur(bestInfo.prevMs,true),'BEST')
      +(rank?statBox(rank,'ランク'):'')
      +'</div>'
      +(bestInfo.isBest?'<div class="best-badge stag"'+stagStyle(SI++)+'>🏅 自己ベスト！</div>':'')
      +'<div class="stag"'+stagStyle(SI++)+'><span class="xp-chip" style="font-size:12px;padding:6px 12px;">+'+xp+' EXP</span></div>'
      +ratingSummary;
  }else{
    // 通常ロード: EXP(獲得ポップ付き)・正解率・最大コンボ・クリア時間(flex-wrapで自然折返し)
    stats='<div class="res-grid">'
      +statBox('+'+xp,'EXP',' exp-pop')
      +statBox(accuracy+'%','正解率')
      +statBox('🔥'+(L.maxCombo||0),'最大コンボ')
      +statBox(fmtDur(duration),'クリアタイム')
      +(rv?statBox(rv.ok+'/'+rv.n+(rv.ok===rv.n?' ✓':''),'復習クリア'):'')
      +'</div>'
      +(rv&&rv.ok===rv.n?'<div class="best-badge stag"'+stagStyle(SI++)+'>🔁 復習コンプリート！ぜんぶ取り返した！</div>':'')
      +(L.themeId
        ?'<p class="stag" style="'+noteStyle+'animation-delay:'+(SI++)*MOTION.resultStagger+'ms">📍 '
          +themeOf(L.themeId).title+'：'+(S.roadProgress[L.themeId]||0)+'/'+themeLessons(themeOf(L.themeId)).length+' レッスン</p>'
        :'<p class="stag" style="'+noteStyle+'animation-delay:'+(SI++)*MOTION.resultStagger+'ms">👑 '
          +L.course.title+'：'+(S.crowns[cid]||0)+'/5</p>');
  }
  area.innerHTML='<div class="center-col" style="gap:12px;">'
    +'<div class="big-emoji stag"'+stagStyle(0)+'>'+(perfect?'🏆':'🐦')+'</div>'
    +'<h2 class="stag" style="margin:0;animation-delay:'+MOTION.resultStagger+'ms">'
    +(L.course.training?'トレーニング完了！':(perfect?'パーフェクト！':'レッスンクリア！'))+'</h2>'
    +streakCelebrate
    +stats
    +'</div>';
  area.scrollTop=0;
  const foot=document.getElementById('lesson-foot');
  foot.className='lesson-foot';
  foot.innerHTML='<button class="btn" onclick="afterLesson()">つづける</button>';
  // DAILY COMPLETE(第8段階): 3ミッション全達成のその日1回だけ、解説を邪魔しない
  // リザルト表示のタイミングで再生(COMPLETE/MASTER演出の後に順番に流れる。操作は塞がない)
  if(DAILY_FX_PENDING){
    DAILY_FX_PENDING=false;
    playFx('<div class="fx-ico">🎯</div><div class="fx-t">DAILY COMPLETE!</div>'
      +'<div class="fx-s">今日のミッション達成！　🔥 '+S.streak+'日連続</div>'
      +'<div class="fx-s2">また明日！</div>','fx-daily',MOTION.dailyComplete);
  }
}
function afterLesson(){
  document.getElementById('lesson').classList.remove('show');
  L=null; renderHUD(); renderPath();
  // ロード復帰演出(第7段階): クリアしたマス(✓ポップ)と解放された次マス(ロック解除グロー)が
  // 見える位置へスクロール。演出情報は一度使ったら破棄(再描画では再生しない)
  if(ROAD_FX){
    const el=document.querySelector('.node.just-unlocked')||document.querySelector('.node.just-cleared');
    if(el){ try{ el.scrollIntoView({block:'center'}); }catch(e){} }
    ROAD_FX=null;
  }
  if(!PROTOTYPE_MODE&&!S.owned.adfree) showAd();  // プロトタイプでは広告モックを出さない
}

/* ================= 広告モック ================= */
function showAd(){
  const ad=document.getElementById('ad');
  const skip=document.getElementById('ad-skip');
  ad.classList.add('show');
  let t=3;
  skip.disabled=true; skip.textContent='スキップ ('+t+')';
  const timer=setInterval(()=>{
    t--;
    if(t<=0){ clearInterval(timer); skip.disabled=false; skip.textContent='スキップ ▶'; }
    else skip.textContent='スキップ ('+t+')';
  },1000);
  skip.onclick=()=>{ if(!skip.disabled) ad.classList.remove('show'); };
}

const AVATARS_PAID=['🦜','🦉','🐦‍⬛','🕊️'];
/* 雀力レーティング(マイページ・第8段階追加改善)。
   計測済み=S.ratingsに実データがあるカテゴリのみ数値表示。将来カテゴリは架空値を
   出さず「― 未計測」として折りたたみ内に表示(Rating計測へ接続されたら自動で数値化) */
const RATING_CATALOG=[
 {key:'waits',label:'待ち'},{key:'nanikiru',label:'何切る'},{key:'riichi',label:'リーチ判断'},
 {key:'katachi',label:'形・牌効率'},{key:'tegumi',label:'手組'},{key:'yaku_r',label:'役'},
 {key:'score_r',label:'点数'},{key:'naki_r',label:'鳴き判断'},{key:'anzen_r',label:'安全度'},

 {key:'alllast_r',label:'オーラス'}];
function ratingSectionHTML(){
  const row=(label,val)=>'<div class="rt-row"><span>'+label+'</span>'
    +(val!=null?'<b>'+Math.floor(val)+'</b>':'<i>― 未計測</i>')+'</div>';

    +'<div style="margin-top:8px;">'
    +measured.map(c=>row(c.label,S.ratings[c.key])).join('')
    +'</div>'
    +(rest.length?'<details class="rt-more"><summary>その他のカテゴリを見る（'+rest.length+'）</summary>'
      +rest.map(c=>row(c.label,null)).join('')
      +'<p style="font-size:10.5px;color:var(--ink-soft);margin:6px 0 0;">学習ロードの進行・トレーニング解放にあわせて計測が始まります</p>'
      +'</details>':'')
    +'</div>';

    +'<div class="card"><b style="font-size:14px;">📊 記録</b><div class="stat-grid" style="margin-top:10px;">'
    +'<div class="stat-box"><div class="v">'+S.xp+'</div><div class="k">合計XP</div></div>'
    +'<div class="stat-box"><div class="v">'+S.streak+'🔥</div><div class="k">連続学習</div></div>'
    +'<div class="stat-box"><div class="v">'+(S.bestStreak||0)+'日</div><div class="k">最長連続</div></div>'

/* ================= 連続記録詳細・カレンダー（第5段階） ================= */
let CAL_OFFSET=0;  // 表示中の月(0=今月, -1=先月, ...)
function showStreakDetail(off){
  CAL_OFFSET=(off===undefined)?0:CAL_OFFSET+off;
  const now=new Date();
  const base=new Date(now.getFullYear(), now.getMonth()+CAL_OFFSET, 1);
  const y=base.getFullYear(), m=base.getMonth();
  const todayKey=todayStr();
  const dayKey=d=>[y,String(m+1).padStart(2,'0'),String(d).padStart(2,'0')].join('-');
  const daysInMonth=new Date(y,m+1,0).getDate();
  const firstDow=new Date(y,m,1).getDay();
  let grid='<div class="cal">'+'日月火水木金土'.split('').map(d=>'<span class="dow">'+d+'</span>').join('');
  for(let i=0;i<firstDow;i++) grid+='<span></span>';
  for(let d=1;d<=daysInMonth;d++){
    const st=S.learningDays[dayKey(d)];  // 'completed' | 'protected'(将来の連続記録ブロック) | undefined
    const cls=(st==='completed'?' done':st==='protected'?' protected':'')
      +(dayKey(d)===todayKey?' today':'');
    grid+='<span class="cal-day'+cls+'">'+d+'</span>';
  }
  grid+='</div>';
  openModal('<h3 style="margin-top:0;">🔥 '+S.streak+'日連続</h3>'
    +'<p style="margin:0 0 4px;color:var(--ink-soft);font-weight:700;font-size:13px;">最長 '+(S.bestStreak||0)+'日</p>'
    +'<div class="cal-head">'
    +'<button onclick="showStreakDetail(-1)">‹</button>'
    +'<b>'+y+'年'+(m+1)+'月</b>'
    +'<button onclick="showStreakDetail(1)">›</button></div>'
    +grid
    +'<div class="cal-legend">'
    +'<span><i style="background:var(--jade)"></i>学習した日</span>'
    +'<span><i style="background:var(--gold)"></i>記録ブロック(予定)</span>'
    +'<span><i style="border:2px solid var(--jade-deep)"></i>今日</span>'
    +'</div>');
}
function openModal(html){
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }
