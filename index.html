:root{
  --jade:#1fa46b; --jade-deep:#0e7a4c; --jade-soft:#e2f3ea;
  --ink:#243430; --ink-soft:#5c6f68;
  --paper:#f4f6f2; --card:#ffffff; --line:#dde5df;
  --tile-face:#fbf8ee; --tile-edge:#d8d2bd; --tile-shadow:#c9c2a8;
  --verm:#d8433b; --verm-deep:#a92e28; --gold:#e8a93c; --gold-deep:#b97f1e;
  --blue:#2c76b8; --sgreen:#2e7d32; --mred:#b3282d;
  --locked:#c3ccc6; --overlay:rgba(16,27,22,.55);
  /* 実機レビュー第1回: 画面幅追従トークン(clamp/vwで連続追従・固定px脱却) */
  --content-max:480px;
  --node-size:clamp(50px, 14vw, 60px);   /* 第7段階: 1画面に5〜7マス見える密度へ縮小(旧74-96px) */
  --node-off:clamp(30px, 9vw, 42px);     /* 蛇行の左右振れもコンパクトに(旧46-66px) */
  --road-w:min(82vw, 330px);             /* ロード主線の幅。左右は将来のキャラ/装飾用の余白 */
  --tile-w:clamp(38px, 10.5vw, 48px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --jade:#27b378; --jade-deep:#0c6b43; --jade-soft:#17352a;
    --ink:#e8efe9; --ink-soft:#93a69c;
    --paper:#0f1a15; --card:#1a2a22; --line:#2b3f34;
    --tile-face:#f4f0e2; --tile-edge:#b5ae94; --tile-shadow:#8f8971;
    --locked:#3a4a41; --overlay:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --jade:#27b378; --jade-deep:#0c6b43; --jade-soft:#17352a;
  --ink:#e8efe9; --ink-soft:#93a69c;
  --paper:#0f1a15; --card:#1a2a22; --line:#2b3f34;
  --tile-face:#f4f0e2; --tile-edge:#b5ae94; --tile-shadow:#8f8971;
  --locked:#3a4a41; --overlay:rgba(0,0,0,.65);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'M PLUS Rounded 1c','Noto Sans JP',system-ui,sans-serif;
  min-height:100vh;
}
button{font-family:inherit; cursor:pointer; touch-action:manipulation;} /* タップ遅延(ダブルタップズーム待ち)排除 */
.app{max-width:var(--content-max); margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

/* ---------- header ---------- */
.hud{position:sticky; top:0; z-index:20; background:var(--paper); display:flex; align-items:center;
  justify-content:space-between; padding:12px 16px 8px; border-bottom:2px solid var(--line);}
.hud .stat{display:flex; align-items:center; gap:5px; font-weight:800; font-size:clamp(15px, 4.3vw, 19px);}
.hud .stat small{font-size:11px; color:var(--ink-soft); font-weight:700;}
.logo{font-weight:800; font-size:clamp(17px, 4.8vw, 21px); letter-spacing:.06em; color:var(--jade); display:flex; align-items:center; gap:6px;}
.logo .logo-img{width:clamp(26px, 7vw, 31px); height:auto; border-radius:8px; display:block;}

/* ---------- path ---------- */
.path-wrap{flex:1; padding:8px 0 96px; overflow-y:auto;}
.section-band{margin:18px 16px 6px; background:var(--jade); color:#fff; border-radius:14px;
  padding:12px 16px; box-shadow:0 4px 0 var(--jade-deep);}
.section-band h2{margin:0; font-size:clamp(15px, 4.1vw, 18px); letter-spacing:.08em;}
.section-band p{margin:2px 0 0; font-size:clamp(11.5px, 3.2vw, 13.5px); opacity:.92;}
/* ロード本体(lesson-path)と将来の装飾レイヤーを分離できる構造。
   deco-layerは現状空で非表示相当(pointer-events:none)。キャラ・吹き出し等は将来ここへ */
.subtheme-road{position:relative; width:var(--road-w); margin:0 auto;}
.subtheme-road .deco-layer{position:absolute; inset:0; pointer-events:none; z-index:0;}
.subtheme-road .path{position:relative; z-index:1;}
.path{display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 0 4px; position:relative;}
.node{width:var(--node-size); height:var(--node-size); border-radius:50%; border:none; position:relative;
  background:var(--card); box-shadow:0 6px 0 var(--line); display:flex; flex-direction:column;
  align-items:center; justify-content:center; transition:transform .08s;}
.node:active{transform:translateY(4px); box-shadow:0 2px 0 var(--line);}
.node .ico{font-size:clamp(20px, 5.6vw, 25px); line-height:1;}
.node.done{background:var(--gold); box-shadow:0 6px 0 var(--gold-deep);}
.node.done .ico{filter:none;}
.node.next{background:var(--jade); box-shadow:0 6px 0 var(--jade-deep);}
.node.next .ico{font-size:clamp(22px, 6vw, 27px);}
.node .crowns{position:absolute; bottom:-8px; background:var(--card); border:2px solid var(--line);
  border-radius:999px; font-size:10px; font-weight:800; padding:1px 7px; color:var(--gold-deep);}
.node.done{color:#fff; font-weight:900;}            /* クリア済み: 金地+白✓ */
.node.locked{background:var(--locked); box-shadow:0 6px 0 var(--line); cursor:default;}
.node.locked .ico{font-size:clamp(16px, 4.4vw, 20px); opacity:.8;}
.node.final{outline:2.5px solid var(--gold); outline-offset:2px;}  /* 小テーマ最終「まとめ」 */
/* ロード演出(第7段階): クリア直後のマスのポップ / 次マスのアンロック(Lesson Clearより弱い)
   transformは蛇行(translateX)が使うため、拡大は.icoへ・ノード本体は光のみ */
.node.just-cleared .ico{animation:nodePop .55s cubic-bezier(.34,1.56,.64,1);}
.node.just-unlocked{animation:unlockGlow var(--m-unlock,.6s) ease;}
.node.just-unlocked .ico{animation:nodePop var(--m-unlock,.6s) cubic-bezier(.34,1.56,.64,1);}
@keyframes nodePop{0%{transform:scale(.4);}55%{transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes unlockGlow{0%{box-shadow:0 6px 0 var(--jade-deep),0 0 0 0 rgba(31,164,107,.55);}
  70%{box-shadow:0 6px 0 var(--jade-deep),0 0 0 10px rgba(31,164,107,0);}
  100%{box-shadow:0 6px 0 var(--jade-deep),0 0 0 0 rgba(31,164,107,0);}}

/* 大テーマ帯(theme-band): SECTION帯の下・小テーマ見出しの上の階層 */
.theme-band{margin:16px 16px 0; background:var(--card); border:2px solid var(--line); border-radius:14px;
  padding:10px 14px; display:flex; align-items:center; gap:10px; box-shadow:0 3px 0 var(--line);}
.theme-band .tb-ico{font-size:clamp(24px, 6.6vw, 30px); line-height:1;}
.theme-band .tb-txt{flex:1; min-width:0;}
.theme-band h3{margin:0; font-size:clamp(14.5px, 4vw, 17px);}
.theme-band p{margin:1px 0 0; font-size:clamp(11px, 3.1vw, 13px); color:var(--ink-soft);}
.theme-band .tb-prog{font-size:clamp(11px, 3.1vw, 13px); font-weight:800; color:var(--jade-deep);
  background:var(--jade-soft); border-radius:999px; padding:4px 10px; white-space:nowrap;}
/* 小テーマ見出し: ── 4枚形 ── の区切り */
.subtheme-head{display:flex; align-items:center; gap:10px; margin:14px 28px 0;
  color:var(--ink-soft); font-size:clamp(11.5px, 3.2vw, 13.5px); font-weight:800;}
.subtheme-head::before,.subtheme-head::after{content:''; flex:1; height:2px; background:var(--line); border-radius:1px;}

.node.l{transform:translateX(calc(-1*var(--node-off)));} .node.r{transform:translateX(var(--node-off));}
.node.l:active{transform:translateX(calc(-1*var(--node-off))) translateY(4px);} .node.r:active{transform:translateX(var(--node-off)) translateY(4px);}
.node-label{font-size:clamp(9.5px, 2.7vw, 11.5px); font-weight:800; color:var(--ink-soft); margin-top:-8px;}
.node-label.l{transform:translateX(calc(-1*var(--node-off)));} .node-label.r{transform:translateX(var(--node-off));}

/* ---------- bottom nav ---------- */
.nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:var(--content-max);
  background:var(--card); border-top:2px solid var(--line); display:flex; z-index:30;}
.nav button{flex:1; background:none; border:none; padding:clamp(10px,2.8vw,13px) 0 calc(clamp(12px,3vw,14px) + env(safe-area-inset-bottom)); display:flex; flex-direction:column;
  align-items:center; gap:2px; font-size:clamp(10.5px, 3vw, 12.5px); font-weight:800; color:var(--ink-soft);}
.nav button.on{color:var(--jade);}
.nav button span.i{font-size:clamp(22px, 6.2vw, 27px); line-height:1;}

/* ---------- generic card / buttons ---------- */
.card{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:16px; margin:12px 16px;}
.btn{display:block; width:100%; border:none; border-radius:14px; padding:clamp(13px,3.8vw,16px); font-size:clamp(15.5px, 4.3vw, 17.5px); font-weight:800;
  background:var(--jade); color:#fff; box-shadow:0 4px 0 var(--jade-deep); transition:transform .08s;}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--jade-deep);}
.btn.gray{background:var(--card); color:var(--ink-soft); box-shadow:0 4px 0 var(--line); border:2px solid var(--line);}
.btn.red{background:var(--verm); box-shadow:0 4px 0 var(--verm-deep);}
.btn.gold{background:var(--gold); box-shadow:0 4px 0 var(--gold-deep);}
.btn:disabled{background:var(--locked); box-shadow:0 4px 0 var(--line); color:var(--card);}
.btn.pressing{transform:translateY(3px); box-shadow:0 1px 0 var(--jade-deep); background:var(--jade-deep); color:#fff; opacity:.95;}

/* ---------- lesson ---------- */
.lesson{position:fixed; inset:0; z-index:40; background:var(--paper); display:none; flex-direction:column;}
.lesson.show{display:flex;}
.lesson-inner{max-width:var(--content-max); margin:0 auto; width:100%; height:100%; display:flex; flex-direction:column; position:relative;}
.lesson-top{display:flex; align-items:center; gap:10px; padding:14px 16px;}
.lesson-top .x{background:none; border:none; font-size:22px; color:var(--ink-soft); font-weight:800; padding:2px 6px;}
.pbar{flex:1; height:14px; background:var(--line); border-radius:999px; overflow:hidden;}
.pbar>div{height:100%; background:var(--jade); border-radius:999px; width:0%; transition:width .3s;}
.hearts{font-weight:800; color:var(--verm); font-size:15px; white-space:nowrap;}
.q-area{flex:1; overflow-y:auto; padding:6px clamp(8px, 4vw, 16px) calc(120px + env(safe-area-inset-bottom));}
.q-type{font-size:clamp(11.5px, 3.2vw, 13.5px); font-weight:800; color:var(--jade); letter-spacing:.1em; margin:6px 0 2px;}
.q-text{font-size:clamp(17px, 4.8vw, 21px); font-weight:800; margin:4px 0 12px; line-height:1.5;}
.q-ctx{font-size:clamp(12.5px, 3.5vw, 14.5px); color:var(--ink-soft); font-weight:700; background:var(--jade-soft);
  border-radius:10px; padding:8px 12px; margin-bottom:12px;}

/* ---------- tiles ---------- */
.hand{display:flex; flex-wrap:nowrap; gap:2px; justify-content:center; margin:10px 0 14px;}
.tile{background:var(--tile-face); border:1px solid var(--tile-edge);
  border-radius:5px; box-shadow:0 3px 0 var(--tile-shadow), inset 0 1px 0 #fff;
  user-select:none; position:relative; padding:0; overflow:hidden;
  width:var(--tile-w); aspect-ratio:5/7; height:auto;}
.tile svg{width:100%; height:100%; display:block;}
.hand .tile{flex:1 1 0; min-width:0; max-width:var(--tile-w);}
button.tile{transition:transform .08s;}
/* 選択中: 太枠+緑地+浮き+影+✓バッジ(色だけに依存しない複合表現)。開示時のcorrect/miss/wrongとは別表現 */
button.tile.sel{transform:translateY(-6px); outline:4px solid var(--jade); outline-offset:1px;
  background:color-mix(in srgb, var(--jade) 20%, var(--tile-face));
  box-shadow:0 8px 14px rgba(14,122,76,.35), 0 3px 0 var(--tile-shadow), inset 0 1px 0 #fff;}
button.tile.sel::after{content:'✓'; position:absolute; top:1px; right:1px; width:16px; height:16px;
  background:var(--jade); color:#fff; font-size:11px; font-weight:800; border-radius:50%;
  display:flex; align-items:center; justify-content:center; z-index:2; line-height:1;}
/* 開示: 選んで正解=緑(浮きなし)/見逃し=金点線/誤選択=赤+✕ */
button.tile.correct{outline:4px solid var(--jade); outline-offset:1px;
  background:color-mix(in srgb, var(--jade) 14%, var(--tile-face));}
button.tile.wrong{outline:4px solid var(--verm); outline-offset:1px;
  background:color-mix(in srgb, var(--verm) 14%, var(--tile-face));}
button.tile.wrong::after{content:'✕'; position:absolute; top:1px; right:1px; width:16px; height:16px;
  background:var(--verm); color:#fff; font-size:11px; font-weight:800; border-radius:50%;
  display:flex; align-items:center; justify-content:center; z-index:2; line-height:1;}
button.tile.miss{outline:3px dashed var(--gold-deep); outline-offset:1px;
  background:color-mix(in srgb, var(--gold) 15%, var(--tile-face));}
/* 選択不可(4枚使用済み): 薄グレー地+減彩。タップしても反応しない */
button.tile.off{opacity:.5; filter:grayscale(.65);
  background:color-mix(in srgb, var(--ink-soft) 14%, var(--tile-face));
  box-shadow:none; cursor:default; transform:none;}
button.tile.off:active{transform:none;}
.tile-choices .tile{width:clamp(54px, 15vw, 66px);}

/* ---------- situation card ---------- */
.situ{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:9px 12px; margin-bottom:10px;}
.situ-bar{display:flex; gap:12px; align-items:center; font-size:12.5px; font-weight:800; color:var(--ink);}
.situ-bar .sub{color:var(--ink-soft);}
.situ-dora{margin-left:auto; display:inline-flex; align-items:center; gap:5px; color:var(--ink-soft);}
.situ-dora .tile{width:26px;}
.situ-note{margin-top:7px; font-size:12px; font-weight:800; color:var(--verm);}
.situ-claim{display:flex; align-items:center; gap:8px; justify-content:center; font-size:13px; font-weight:800; margin:-2px 0 12px;}
.situ-claim .tile{width:34px;}

/* ---------- Compare (P4-A) ---------- */
.cmp-banner{background:var(--jade-soft); border:2px solid var(--jade); border-radius:12px;
  padding:9px 12px; margin-bottom:10px; font-size:13px; display:flex; flex-direction:column; gap:6px;}
.cmp-badges{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px; font-weight:800; color:var(--ink-soft);}
.cmp-badge{background:var(--gold); color:#fff; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:800;}

/* ---------- TableView (P3-A) ---------- */
.tv{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
.tv-info{display:flex; align-items:center; gap:10px; background:var(--card); border:2px solid var(--line);
  border-radius:12px; padding:8px 12px; font-size:12.5px; font-weight:800;}
.tv-info .sub{color:var(--ink-soft);}
.tv-dora{margin-left:auto; display:inline-flex; align-items:center; gap:4px; color:var(--ink-soft); font-size:11.5px;}
.tv-dora .tile{width:clamp(22px, 6vw, 27px);}
.tv-note{font-size:12px; font-weight:800; color:var(--verm); padding:0 2px;}
.tv-opps{display:flex; flex-direction:column; gap:6px;}
.tv-opp{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:7px 10px;}
.tv-opp.focus{border-color:var(--jade); box-shadow:0 0 0 1px var(--jade);}
.tv-opp-head{display:flex; align-items:center; gap:6px; font-size:12.5px; margin-bottom:4px;}
.tv-badge{font-size:10px; font-weight:800; border-radius:6px; padding:1px 6px; color:#fff;}
.tv-badge.oya{background:var(--verm);} .tv-badge.ko{background:var(--ink-soft);}
.tv-badge.riichi{background:var(--gold); color:#fff;}
.tv-score{margin-left:auto; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink-soft);}
.tv-score b{color:var(--ink);}
.tv-calls{display:flex; gap:8px; margin:2px 0 4px; flex-wrap:wrap;}
.tv-call{display:inline-flex; align-items:flex-end; gap:2px;}
.tv-call .tile{width:17px;}
.tv-call i{font-style:normal; font-size:10px; font-weight:800; color:var(--ink-soft); margin-left:2px;}
.tv-river{display:flex; flex-wrap:wrap; gap:2px; align-items:center;}
.tv-river .tile{width:19px;}
.tv-river.tvr-s .tile{width:17px;}
.tv-river.tvr-xs .tile{width:15px;}
.tv-riichi-tile{display:inline-flex; transform:rotate(90deg); margin:0 5px;}
.tv-myriver{background:var(--card); border:2px dashed var(--line); border-radius:12px; padding:6px 10px;}
.tv-lab{font-size:10.5px; font-weight:800; color:var(--ink-soft); margin-bottom:3px;}
.tv-me{background:var(--jade-soft); border:2px solid var(--jade); border-radius:12px; padding:8px 10px;}
.tv-me-head{display:flex; align-items:center; gap:6px; font-size:12.5px; margin-bottom:6px;}
.tv-hand{display:flex; align-items:center; gap:8px;}
.tv-hand .hand{flex:1 1 0; min-width:0; margin:0; gap:2px;}
.tv-hand .hand .tile{max-width:clamp(22px, 6.2vw, 28px);}
.tv-draw{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:1px; padding-left:8px; border-left:2px solid var(--line);}
.tv-draw .tile{width:clamp(24px, 6.6vw, 30px);}
.tv-draw span{font-size:9.5px; font-weight:800; color:var(--ink-soft);}
/* 開発用TableViewプレビュー */
.tvprev{position:fixed; inset:0; z-index:70; background:var(--paper); display:none; flex-direction:column;}
.tvprev.show{display:flex;}
.tvprev-head{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:2px solid var(--line);}
.tvprev-head b{font-size:13px; flex:1;}
.tvprev-head button{border:2px solid var(--line); background:var(--card); border-radius:8px; font-weight:800;
  font-size:12px; padding:5px 9px; color:var(--ink-soft);}
.tvprev-head button.on{border-color:var(--jade); color:var(--jade);}
.tvprev-body{flex:1; overflow-y:auto; padding:12px 16px 40px; max-width:var(--content-max); margin:0 auto; width:100%;}

/* ---------- choices ---------- */
.choices{display:flex; flex-direction:column; gap:10px;}
.choice{border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px;
  padding:clamp(12px,3.6vw,15px) 14px; font-size:clamp(14.5px, 4vw, 16.5px); font-weight:700; text-align:left; box-shadow:0 3px 0 var(--line);}
.choice.sel{border-color:var(--jade); color:var(--jade); background:var(--jade-soft); box-shadow:0 3px 0 var(--jade-deep);}
.choice.correct{border-color:var(--jade); background:var(--jade-soft); color:var(--jade-deep);}
.choice.wrong{border-color:var(--verm); background:color-mix(in srgb, var(--verm) 12%, var(--card)); color:var(--verm);}
.tile-choices{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
/* 9択ピッカー: 3x3配置のまま、牌をひと回り小さく(幅追従・タップ領域は確保) */
.numpick{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(6px,1.8vw,9px); max-width:min(224px, 60vw); margin:8px auto 0;}
.numpick .tile{width:100%; max-width:none;}
.numpick34{display:grid; grid-template-columns:repeat(9,1fr); gap:clamp(3px,1vw,6px); max-width:min(440px, 97vw); margin:8px auto 0;}
.numpick34 .tile{width:100%; max-width:none; padding:0;}
.numpick,.numpick34{touch-action:none; user-select:none; -webkit-user-select:none;}

/* ---------- footer / feedback ---------- */
.lesson-foot{position:absolute; bottom:0; left:0; right:0; background:var(--card);
  border-top:2px solid var(--line); padding:14px 16px calc(14px + env(safe-area-inset-bottom));}
.lesson-foot.ok{background:var(--jade-soft); border-top-color:var(--jade);}
.lesson-foot.ng{background:color-mix(in srgb, var(--verm) 10%, var(--card)); border-top-color:var(--verm);}
.fb-title{font-weight:800; font-size:clamp(16.5px, 4.6vw, 19px); margin:0 0 4px;}
.fb-title.ok{color:var(--jade-deep);} .fb-title.ng{color:var(--verm);} .fb-title.mid{color:var(--gold-deep);}
/* ================= 第7段階: ゲームフィール ================= */
/* 通常コンボ: 「正解！」と同じ行の右側に常時見える(解説カード2段目から昇格) */
.fb-head{display:flex; align-items:center; justify-content:space-between; gap:6px 10px; flex-wrap:wrap;}
.fb-head .fb-title{margin:0;}
.fb-combo{display:inline-block; padding:3px 11px; border-radius:999px; white-space:nowrap;
  background:var(--jade-soft); color:var(--jade-deep); font-weight:900;
  font-size:clamp(12.5px, 3.5vw, 14.5px); animation:comboPop var(--m-answer,.26s) cubic-bezier(.34,1.56,.64,1);}
.fb-combo.big{background:var(--gold); color:#fff; box-shadow:0 2px 0 var(--gold-deep);}
.combo-end{margin:2px 0 4px; color:var(--ink-soft); font-size:clamp(11px, 3.1vw, 12.5px);}
/* レッスン内復習: 「もう一度」チップ(責めないポジティブ表示)と復習クリアの小表示 */
.rv-chip{display:inline-block; margin:0 0 8px; padding:4px 12px; border-radius:999px;
  background:var(--jade-soft); color:var(--jade-deep); font-weight:800;
  font-size:clamp(11.5px, 3.2vw, 13px);}
.rv-clear{margin:2px 0 4px; color:var(--jade-deep); font-weight:800;
  font-size:clamp(11.5px, 3.2vw, 12.5px);}
@keyframes comboPop{from{transform:scale(.5); opacity:0;} to{transform:scale(1); opacity:1;}}

/* Level1: 正解/不正解の軽い反応(0.2〜0.4秒)。牌・選択肢そのものが動く */
.tile.correct,.choice.correct{animation:okPop var(--m-answer,.26s) cubic-bezier(.34,1.56,.64,1);}
.tile.wrong,.choice.wrong{animation:ngShake var(--m-wrong,.32s) ease;}
.fb-card{animation:cardIn var(--m-answer,.26s) ease-out;}
@keyframes okPop{0%{transform:scale(1);} 45%{transform:translateY(-4px) scale(1.07);} 100%{transform:none;}}
@keyframes ngShake{0%,100%{transform:none;} 25%{transform:translateX(-3px);} 55%{transform:translateX(3px);} 80%{transform:translateX(-2px);}}
@keyframes cardIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* Level3〜6: 中央オーバーレイ演出(#fx)。pointer-events:noneで進行を一切ブロックしない */
.fx{position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  z-index:60; pointer-events:none;}
.fx.show{display:flex;}
.fx .fx-box{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
  padding:22px 34px; border-radius:22px; background:var(--overlay); color:#fff;
  animation:fxIn .9s cubic-bezier(.34,1.56,.64,1) both;}
.fx .fx-ico{font-size:clamp(40px, 12vw, 54px); line-height:1.1;}
.fx .fx-t{font-size:clamp(19px, 5.4vw, 24px); font-weight:900; letter-spacing:.06em;}
.fx .fx-s{font-size:clamp(12.5px, 3.6vw, 15px); font-weight:800; opacity:.9;}
.fx.fx-combo .fx-box{background:rgba(16,27,22,.78);}
.fx.fx-sub .fx-box{background:var(--gold); box-shadow:0 6px 0 var(--gold-deep); animation-duration:1.05s;}
.fx.fx-theme .fx-box{background:linear-gradient(160deg,var(--gold),var(--verm)); box-shadow:0 6px 0 var(--gold-deep); animation-duration:1.15s;}
@keyframes fxIn{0%{transform:scale(.35); opacity:0;} 45%{transform:scale(1.08); opacity:1;}
  62%{transform:scale(1);} 82%{transform:scale(1); opacity:1;} 100%{transform:scale(1); opacity:1;}}
.fx.fade .fx-box{animation:fxOut .22s ease-in both;}
@keyframes fxOut{from{transform:scale(1); opacity:1;} to{transform:scale(.9); opacity:0;}}

/* ================= 第8段階: Daily Engagement ================= */
/* ホーム画面: カードを縦に積む構造(将来カードを追記可能) */
.home-wrap{padding:4px 0 96px;}
.hc-continue{display:flex; align-items:center; gap:12px; width:calc(100% - 32px); margin:10px 16px 0;
  border:none; background:var(--jade); color:#fff; border-radius:14px; padding:13px 16px;
  box-shadow:0 4px 0 var(--jade-deep); text-align:left; cursor:pointer;}
.hc-continue:active{transform:translateY(3px); box-shadow:0 1px 0 var(--jade-deep);}
.hc-continue .hc-play{font-size:clamp(19px,5.2vw,23px); line-height:1;}
.hc-continue .hc-txt{display:flex; flex-direction:column; gap:1px; min-width:0;}
.hc-continue .hc-txt b{font-size:clamp(14.5px,4vw,16.5px); letter-spacing:.04em;}
.hc-continue .hc-txt span{font-size:clamp(11px,3.1vw,12.5px); opacity:.92; font-weight:700;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.today-strip .ts-cal{font-size:clamp(14px,4vw,17px); opacity:.75;}
/* コースの現在地フローティングボタン(ロードが長くなっても現在地へ一発。過去マス閲覧の邪魔をしない) */
.loc-btn{position:fixed; right:14px; bottom:calc(78px + env(safe-area-inset-bottom)); z-index:25;
  border:none; background:var(--jade); color:#fff; font-weight:800; border-radius:999px;
  padding:9px 14px; font-size:clamp(11px,3.1vw,12.5px); box-shadow:0 3px 0 var(--jade-deep),0 4px 10px rgba(0,0,0,.15);}
.loc-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--jade-deep);}
/* マイページ: 雀力レーティング */
.rt-row{display:flex; justify-content:space-between; align-items:center; padding:5px 2px;
  font-size:clamp(12.5px,3.5vw,14px); font-weight:700; border-bottom:1px solid var(--line);}
.rt-row:last-child{border-bottom:none;}
.rt-row b{font-variant-numeric:tabular-nums; font-size:clamp(14px,3.9vw,16px);}
.rt-row i{font-style:normal; color:var(--ink-soft); font-size:clamp(11px,3.1vw,12.5px);}
.rt-more{margin-top:4px;}
.rt-more summary{font-size:clamp(11.5px,3.2vw,13px); font-weight:800; color:var(--jade-deep);
  cursor:pointer; padding:4px 0;}
/* 今日の学習状況(ストリーク)+つづきから */
.today-strip{margin:10px 16px 0; background:var(--card); border:2px solid var(--line); border-radius:12px;
  padding:8px 12px; display:flex; align-items:center; gap:8px; cursor:pointer;}
.today-strip .ts-streak{font-size:clamp(12.5px,3.5vw,14px); white-space:nowrap;}
.today-strip .ts-state{flex:1; min-width:0; font-size:clamp(10.5px,3vw,12px); color:var(--ink-soft); font-weight:700;}
.today-strip .ts-state.done{color:var(--jade-deep);}
.today-strip .ts-go{border:none; background:var(--jade); color:#fff; font-weight:800; border-radius:999px;
  padding:6px 12px; font-size:clamp(11px,3.1vw,12.5px); box-shadow:0 2px 0 var(--jade-deep); white-space:nowrap;}
.today-strip .ts-go:active{transform:translateY(2px); box-shadow:none;}
/* 今日のミッションカード(コンパクト・ロードを圧迫しない) */
.mission-card{margin:8px 16px 0; background:var(--card); border:2px solid var(--line); border-radius:12px;
  padding:8px 12px 10px;}
.mission-card .mc-head{display:flex; justify-content:space-between; align-items:center;
  font-weight:800; font-size:clamp(12.5px,3.5vw,14px); margin-bottom:4px;}
.mission-card .mc-count{color:var(--jade-deep); background:var(--jade-soft); border-radius:999px;
  padding:2px 10px; font-size:clamp(11px,3.1vw,12.5px);}
.mission-card .mc-count.comp{background:var(--gold); color:#fff; box-shadow:0 2px 0 var(--gold-deep);}
.mission-card .mc-item{display:flex; align-items:center; gap:6px; padding:3px 0;
  font-size:clamp(11.5px,3.2vw,13px); font-weight:700; color:var(--ink);}
.mission-card .mc-item.done{color:var(--jade-deep);}
.mission-card .mc-prog{margin-left:auto; color:var(--ink-soft); font-size:clamp(10.5px,3vw,12px);
  font-variant-numeric:tabular-nums;}
.mission-card .mc-bar{display:block; width:64px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; flex:none;}
.mission-card .mc-bar i{display:block; height:100%; background:var(--jade); border-radius:3px;}
.mission-card .mc-tomorrow{margin-top:4px; color:var(--ink-soft); font-size:clamp(10.5px,3vw,12px);}
/* ミッション達成トースト: 上部の小チップ。操作を塞がない */
.toast{position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%;
  transform:translateX(-50%) translateY(-16px); max-width:min(86vw,340px);
  background:var(--card); border:2px solid var(--jade); border-radius:14px; padding:8px 16px;
  box-shadow:0 4px 12px rgba(0,0,0,.18); z-index:70; pointer-events:none;
  opacity:0; transition:opacity .22s ease, transform .22s ease; text-align:center;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast .toast-t{font-weight:900; color:var(--jade-deep); font-size:clamp(12.5px,3.5vw,14px);}
.toast .toast-s{font-weight:700; color:var(--ink-soft); font-size:clamp(11px,3.1vw,12.5px);}
/* 宝箱ノード: レッスンより少し小さく・金アクセント。available時のみ軽いpulse */
.chest-node{width:calc(var(--node-size)*.82); height:calc(var(--node-size)*.82); border-radius:16px;
  border:2.5px solid var(--gold); background:var(--card); position:relative;
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 var(--gold-deep);}
.chest-node .ci{font-size:clamp(19px,5.2vw,24px); line-height:1;}
.chest-node.locked{border-color:var(--line); background:var(--locked); box-shadow:0 4px 0 var(--line);}
.chest-node.locked .ci{opacity:.55; filter:grayscale(.6);}
.chest-node.available{animation:chestPulse 1.6s ease-in-out infinite;}
.chest-node.available:active{transform:translateY(3px); box-shadow:0 1px 0 var(--gold-deep);}
.chest-node.claimed{background:var(--jade-soft); animation:none;}
.chest-node.claimed .ci{opacity:.6;}
.chest-node .cb{position:absolute; right:-6px; top:-6px; background:var(--jade); color:#fff;
  border-radius:50%; width:18px; height:18px; font-size:11px; font-weight:900;
  display:flex; align-items:center; justify-content:center; box-shadow:0 1px 0 var(--jade-deep);}
@keyframes chestPulse{0%,100%{transform:scale(1); box-shadow:0 4px 0 var(--gold-deep);}
  50%{transform:scale(1.07); box-shadow:0 4px 0 var(--gold-deep),0 0 0 6px rgba(232,169,60,.18);}}
/* 宝箱OPEN/DAILY COMPLETEオーバーレイ配色 */
.fx.fx-chest .fx-box{background:var(--gold); box-shadow:0 6px 0 var(--gold-deep);}
.fx.fx-daily .fx-box{background:linear-gradient(160deg,var(--jade),var(--jade-deep)); box-shadow:0 6px 0 var(--jade-deep);}
.fx .fx-s2{font-size:clamp(11.5px,3.2vw,13px); font-weight:800; opacity:.85; margin-top:2px;}

/* リザルトの順次表示(全体で1秒前後)+EXPポップ */
.stag{opacity:0; animation:stagIn .3s ease-out forwards;}
@keyframes stagIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.res-box.exp-pop .v{display:inline-block; animation:expPop .5s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:inherit;}
@keyframes expPop{0%{transform:scale(.6);} 55%{transform:scale(1.18);} 100%{transform:scale(1);}}

/* prefers-reduced-motion: 大きな動きを止め、ほぼ即時表示(進行はJS側タイマーで別途短縮) */
@media (prefers-reduced-motion: reduce){
  .tile.correct,.choice.correct,.tile.wrong,.choice.wrong,.fb-card,.fb-combo,
  .node.just-cleared .ico,.node.just-unlocked,.node.just-unlocked .ico,
  .fx .fx-box,.fx.fade .fx-box,.res-box.exp-pop .v{animation:none !important;}
  .stag{animation:none !important; opacity:1;}
  .streak-celebrate,.sc-flame{animation:none !important;}
  .chest-node.available{animation:none !important;}
  .toast{transition:none !important;}
}
.lesson-foot.mid{background:color-mix(in srgb, var(--gold) 12%, var(--card)); border-top-color:var(--gold);}
.fb-rate{margin:0 0 6px; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;}
.fb-rate.up{color:var(--jade-deep);} .fb-rate.down{color:var(--verm);}
.rating-strip{display:flex; align-items:center; justify-content:center; gap:clamp(10px,3.5vw,18px); margin:12px 16px 0;
  background:var(--card); border:2px solid var(--line); border-radius:14px; padding:clamp(10px,2.8vw,13px) 14px;
  font-weight:800; font-size:clamp(12.5px, 3.6vw, 15px); font-variant-numeric:tabular-nums;}
.rating-strip .lab{color:var(--ink-soft); font-size:12px;}
.rating-strip b{font-size:clamp(15px, 4.4vw, 19px);}
.fb-exp{font-size:clamp(13px, 3.7vw, 15px); line-height:1.6; color:var(--ink); margin:0 0 12px; font-family:'Noto Sans JP',sans-serif;}
/* 回答結果カード: 問題の直下に連続して表示(問題→結果→解説→つづける の流れ) */
.fb-card{border:2px solid var(--line); border-radius:16px; padding:14px 16px; margin:16px 0 8px;
  background:var(--card);}
.fb-card.ok{border-color:var(--jade); background:var(--jade-soft);}
.fb-card.mid{border-color:var(--gold); background:color-mix(in srgb, var(--gold) 10%, var(--card));}
.fb-card.ng{border-color:var(--verm); background:color-mix(in srgb, var(--verm) 8%, var(--card));}
.fb-card .fb-exp:last-child{margin-bottom:0;}

/* ---------- result / shop / profile ---------- */
.center-col{display:flex; flex-direction:column; align-items:center; gap:10px; padding:40px 24px; text-align:center;}
/* ---------- 第5段階: リザルト/連続記録/カレンダー ---------- */
.res-grid{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; width:100%;}
.res-box{background:var(--card); border:2px solid var(--line); border-radius:14px;
  padding:clamp(10px,2.8vw,14px) clamp(12px,3.4vw,18px); min-width:clamp(84px,24vw,104px);}
.res-box .v{font-size:clamp(19px,5.4vw,24px); font-weight:800; font-variant-numeric:tabular-nums;}
.res-box .k{font-size:clamp(10.5px,3vw,12px); color:var(--ink-soft); font-weight:700; margin-top:2px;}
.best-badge{background:var(--gold); color:#fff; font-weight:800; border-radius:999px;
  padding:8px 20px; box-shadow:0 3px 0 var(--gold-deep); font-size:clamp(14px,4vw,16px);}
.streak-celebrate{background:linear-gradient(180deg,var(--gold),#f0bc55); border-radius:20px;
  padding:18px 34px; color:#fff; box-shadow:0 5px 0 var(--gold-deep); width:min(280px,80%);
  animation:scpop .45s cubic-bezier(.2,1.6,.4,1);}
/* リザルト順次表示と併用時: scpopが.stagのstagInを上書きしてopacity:0のまま
   になるのを防ぐ(両アニメーションを併走・delayはインラインのanimation-delayが両方に適用) */
.streak-celebrate.stag{animation:scpop .45s cubic-bezier(.2,1.6,.4,1), stagIn .3s ease-out forwards;}
.streak-celebrate .sc-flame{font-size:clamp(38px,11vw,48px); line-height:1;}
.streak-celebrate .sc-num{font-size:clamp(46px,14vw,60px); font-weight:800; line-height:1.05;
  text-shadow:0 2px 0 rgba(0,0,0,.15); font-variant-numeric:tabular-nums;}
.streak-celebrate .sc-label{font-size:clamp(17px,5vw,21px); font-weight:800;}
.streak-celebrate .sc-sub{margin:6px 0 0; font-size:clamp(11px,3.2vw,12.5px); font-weight:700; opacity:.94;}
@keyframes scpop{0%{transform:scale(.6); opacity:0;} 100%{transform:scale(1); opacity:1;}}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin:10px 0 6px;}
.cal-head b{font-size:15px;}
.cal-head button{border:2px solid var(--line); background:var(--card); border-radius:10px;
  font-weight:800; font-size:15px; padding:4px 12px; color:var(--ink-soft);}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
.cal .dow{font-size:10.5px; font-weight:800; color:var(--ink-soft); padding:2px 0;}
.cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border-radius:50%; font-size:12.5px; font-weight:700; color:var(--ink);}
.cal-day.done{background:var(--jade); color:#fff;}
.cal-day.protected{background:var(--gold); color:#fff;}
.cal-day.today{outline:2.5px solid var(--jade-deep); outline-offset:1px;}
.cal-legend{display:flex; gap:12px; justify-content:center; font-size:10.5px; font-weight:700;
  color:var(--ink-soft); margin-top:8px;}
.cal-legend i{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:4px; vertical-align:-1px;}
.big-emoji{font-size:64px;}
.xp-chip{background:var(--gold); color:#fff; font-weight:800; border-radius:12px; padding:8px 18px; box-shadow:0 3px 0 var(--gold-deep);}
.shop-item{display:flex; gap:12px; align-items:center;}
.shop-item .ico{font-size:34px;}
.shop-item .info{flex:1;}
.shop-item h3{margin:0; font-size:15px;}
.shop-item p{margin:2px 0 0; font-size:12px; color:var(--ink-soft); font-family:'Noto Sans JP',sans-serif;}
.shop-item .buy{border:none; border-radius:12px; font-weight:800; padding:10px 14px; background:var(--jade);
  color:#fff; box-shadow:0 3px 0 var(--jade-deep); white-space:nowrap;}
.shop-item .buy.owned{background:var(--locked); box-shadow:0 3px 0 var(--line);}
.avatars{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.av{font-size:30px; background:var(--card); border:2px solid var(--line); border-radius:14px; width:58px; height:58px;}
.av.sel{border-color:var(--jade); background:var(--jade-soft);}
.av.lock{opacity:.4;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-box{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px; text-align:center;}
.stat-box .v{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
.stat-box .k{font-size:11px; color:var(--ink-soft); font-weight:700;}

/* ---------- modal ---------- */
.modal-bg{position:fixed; inset:0; background:var(--overlay); z-index:50; display:none; align-items:flex-end; justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--card); width:100%; max-width:430px; border-radius:22px 22px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));}
.modal h3{margin:0 0 6px; font-size:18px;}
.modal p{margin:0 0 14px; font-size:13.5px; color:var(--ink-soft); line-height:1.6; font-family:'Noto Sans JP',sans-serif;}

/* ---------- ad mock ---------- */
.ad{position:fixed; inset:0; z-index:60; background:#101b16; color:#fff; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px;}
.ad.show{display:flex;}
.ad .tag{border:1px solid #ffffff55; border-radius:6px; font-size:11px; padding:2px 8px; letter-spacing:.2em;}
.ad h2{margin:0; font-size:22px;}
.ad p{margin:0; font-size:13px; opacity:.7;}
.screen{display:none;} .screen.show{display:block;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>

function canSets(c){

  if(i<27&&(i%9)<=6&&c[i+1]>0&&c[i+2]>0){

// シャンテン数計算（標準形＋七対子＋国士）
function shantenStandard(c){
  let best=8;
  function walk(i, sets, partials, hasPair){
    while(i<34 && c[i]===0) i++;
    if(i===34){
      // ブロック上限補正: 面子+ターツは合計4まで（超過ターツは無効）
      const useSets=Math.min(sets,4);
      const usePartials=Math.min(partials, 4-useSets);
      const val=2*useSets+usePartials+(hasPair?1:0);
      if(8-val<best) best=8-val;
      return;
    }
    // 枝刈り: 理論上の残り最大値
    const optimistic = 8 - 2*sets - partials - (hasPair?1:0) - 2*(4-sets);
    if(optimistic >= best) { /* 続行しても更新不可のケースは粗いので刈らない */ }
    // 刻子
    if(c[i]>=3){ c[i]-=3; walk(i, sets+1, partials, hasPair); c[i]+=3; }
    // 順子
    if(i<27 && i%9<=6 && c[i+1]>0 && c[i+2]>0){
      c[i]--;c[i+1]--;c[i+2]--; walk(i, sets+1, partials, hasPair); c[i]++;c[i+1]++;c[i+2]++;
    }
    // 雀頭
    if(c[i]>=2 && !hasPair){ c[i]-=2; walk(i, sets, partials, true); c[i]+=2; }
    // 対子（刻子の種）
    if(c[i]>=2 && sets+partials<4){ c[i]-=2; walk(i, sets, partials+1, hasPair); c[i]+=2; }
    // 両面・ペンチャン
    if(i<27 && i%9<=7 && c[i+1]>0 && sets+partials<4){
      c[i]--;c[i+1]--; walk(i, sets, partials+1, hasPair); c[i]++;c[i+1]++;
    }
    // カンチャン
    if(i<27 && i%9<=6 && c[i+2]>0 && sets+partials<4){
      c[i]--;c[i+2]--; walk(i, sets, partials+1, hasPair); c[i]++;c[i+2]++;
    }
    // この牌を使わず進む
    const save=c[i]; c[i]=0; walk(i+1, sets, partials, hasPair); c[i]=save;
  }
  walk(0,0,0,false);
  return best;
}
function shanten(c){
  let s = shantenStandard(c);
  // 七対子
  let pairs=0,kinds=0;
  for(let i=0;i<34;i++){ if(c[i]>0){kinds++; if(c[i]>=2)pairs++;} }
  s = Math.min(s, 6 - pairs + Math.max(0, 7-kinds));
  // 国士無双
  const terms=[0,8,9,17,18,26,27,28,29,30,31,32,33];
  let t=0, tp=false;
  for(const x of terms){ if(c[x]>0){t++; if(c[x]>=2)tp=true;} }
  s = Math.min(s, 13 - t - (tp?1:0));
  return s;
}
// 受け入れ: 13枚手牌に対しシャンテンが下がる牌の(種類,枚数)
function ukeire(c){
  const base=shanten(c);
  const tiles=[]; let count=0;
  for(let t=0;t<34;t++){
    if(c[t]>=4) continue;
    c[t]++;
    if(shanten(c)<base){ tiles.push(t); count+=4-(c[t]-1); }
    c[t]--;
  }
  return {shanten:base, tiles, count};
}

function genSuitTenpai(numTiles,rng){
  rng=rng||Math.random;
  const nSets=(numTiles-1)/3;
  for(let attempt=0;attempt<800;attempt++){
    const cnt=new Array(9).fill(0);
    cnt[Math.floor(rng()*9)]+=2;
    let ok=true;
    for(let s=0;s<nSets;s++){
      let placed=false;
      for(let tr=0;tr<30&&!placed;tr++){
        if(rng()<0.35){
          const t=Math.floor(rng()*9);
          if(cnt[t]+3<=4){cnt[t]+=3;placed=true;}
        }else{
          const st=Math.floor(rng()*7);
          if(cnt[st]<4&&cnt[st+1]<4&&cnt[st+2]<4){cnt[st]++;cnt[st+1]++;cnt[st+2]++;placed=true;}
        }
      }
      if(!placed){ok=false;break;}
    }
    if(!ok) continue;
    const present=[];
    for(let i=0;i<9;i++)for(let k=0;k<cnt[i];k++)present.push(i);
    cnt[present[Math.floor(rng()*present.length)]]--;
    const full=new Array(34).fill(0);
    for(let i=0;i<9;i++)full[i]=cnt[i];
    const waits=getWaits(full).map(w=>w%9+1);
    if(waits.length>=(numTiles>=7?2:1)){
      return {counts:cnt, waits};
    }
  }
  return null;
}
// ---- 清一色形パズル用の枚数対応シャンテン（shanten()は13枚/4面子専用のため別実装） ----
// cnt: 9要素配列、3*nSets+1枚。目標 = nSets面子+雀頭。13枚(nSets=4)のみ七対子も考慮。
function suitShanten(cnt,nSets){
  let best=2*nSets;
  function walk(i,sets,partials,hasPair){
    while(i<9&&cnt[i]===0)i++;
    if(i===9){
      const useSets=Math.min(sets,nSets);
      const usePartials=Math.min(partials,nSets-useSets);
      const val=2*useSets+usePartials+(hasPair?1:0);
      if(2*nSets-val<best)best=2*nSets-val;
      return;
    }
    if(cnt[i]>=3){cnt[i]-=3;walk(i,sets+1,partials,hasPair);cnt[i]+=3;}
    if(i<=6&&cnt[i+1]>0&&cnt[i+2]>0){cnt[i]--;cnt[i+1]--;cnt[i+2]--;walk(i,sets+1,partials,hasPair);cnt[i]++;cnt[i+1]++;cnt[i+2]++;}
    if(cnt[i]>=2&&!hasPair){cnt[i]-=2;walk(i,sets,partials,true);cnt[i]+=2;}
    if(cnt[i]>=2&&sets+partials<nSets){cnt[i]-=2;walk(i,sets,partials+1,hasPair);cnt[i]+=2;}
    if(i<=7&&cnt[i+1]>0&&sets+partials<nSets){cnt[i]--;cnt[i+1]--;walk(i,sets,partials+1,hasPair);cnt[i]++;cnt[i+1]++;}
    if(i<=6&&cnt[i+2]>0&&sets+partials<nSets){cnt[i]--;cnt[i+2]--;walk(i,sets,partials+1,hasPair);cnt[i]++;cnt[i+2]++;}
    const sv=cnt[i];cnt[i]=0;walk(i+1,sets,partials,hasPair);cnt[i]=sv;
  }
  walk(0,0,0,false);
  if(nSets===4){
    let pairs=0,kinds=0;
    for(let i=0;i<9;i++){if(cnt[i]>0){kinds++;if(cnt[i]>=2)pairs++;}}
    const ch=6-pairs+Math.max(0,7-kinds);
    if(ch<best)best=ch;
  }
  return best;
}
// 受け入れ: tを引くと(最善の1枚を切って)テンパイに到達できる牌
function suitAccepts(cnt,nSets){
  const out=[];
  for(let t=0;t<9;t++){
    if(cnt[t]>=4)continue;
    cnt[t]++;
    let ok=false;
    for(let d=0;d<9&&!ok;d++){
      if(cnt[d]===0)continue;
      cnt[d]--;
      if(suitShanten(cnt,nSets)===0)ok=true;
      cnt[d]++;
    }
    cnt[t]--;
    if(ok)out.push(t+1);
  }
  return out;
}
// ================= 本番形: 4パターンの1シャンテン手牌生成 =================
// パターン: 1=2面子+雀頭+2ターツ(+ターツ関連の余り牌) 2=3面子+雀頭+くっつき
//           3=雀頭なし(3面子+2ターツ) 4=七対子(対子5+浮き3)
// 生成後にu1PatternOf(分類器)で「そのパターンとして一意」を保証し、
// accepts はengineのukeire()（シャンテンが1→0に下がる牌）で機械算出する。
const U1_PATTERNS={
 1:{name:'2面子＋2ターツ',
    exp:'2面子＋雀頭＋ターツ2つ。どちらかのターツが完成すればテンパイ。余り牌がターツと複合しているぶん、単純な形より受け入れが広い。'},
 2:{name:'3面子＋雀頭＋くっつき',
    exp:'3面子＋雀頭は完成していて、浮き牌の周りに引けばターツができてテンパイ。浮き牌の近く（±2まで）と浮き牌自身の重なりに加えて、見落としやすいのが雀頭の重なり——雀頭が刻子になると4面子目が完成して浮き牌の単騎テンパイになる。見た目よりずっと広い形。'},
 3:{name:'雀頭なし',
    exp:'面子3つ＋ターツ2つで雀頭がない形。ターツが完成すれば単騎テンパイ、手牌のどれかが重なれば雀頭ができてテンパイ。「雀頭がない」と気づけるかがポイント。'},
 4:{name:'七対子',
    exp:'対子5つ＋浮き牌3枚の七対子1シャンテン。浮き牌のどれかが重なればテンパイ。受け入れは浮き牌の3種だけと狭い。'},
};
function u1MaxSets(c){
  let best=0;
  function walk(i,sets){
    while(i<34&&c[i]===0)i++;
    if(i===34){ if(sets>best)best=sets; return; }
    if(c[i]>=3){c[i]-=3;walk(i,sets+1);c[i]+=3;}
    if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){
      c[i]--;c[i+1]--;c[i+2]--;walk(i,sets+1);c[i]++;c[i+1]++;c[i+2]++;}
    const sv=c[i];c[i]=0;walk(i+1,sets);c[i]=sv;
  }
  walk(0,0);
  return best;
}
// 13枚・全体シャンテン1の手をパターン1〜4に分類。一意に決まらなければ0。
function u1PatternOf(c){
  let pairs=0,kinds=0,hasPair=false;
  for(let i=0;i<34;i++){ if(c[i]>0){kinds++; if(c[i]>=2){pairs++;hasPair=true;}} }
  const ch=6-pairs+Math.max(0,7-kinds);
  const st=shantenStandard(c);
  if(ch===1&&st>=2) return 4;      // 七対子でのみ1シャンテン
  if(st!==1||ch<=1) return 0;      // 標準形1シャンテンでない/七対子と両立→曖昧として排除
  if(!hasPair) return 3;           // 雀頭なし
  return u1MaxSets(c)>=3?2:1;      // 完成面子数で判別
}
function genFullIishanten(rng,forcePat){
  rng=rng||Math.random;
  const c=new Array(34).fill(0);
  const addRun=()=>{const su=Math.floor(rng()*3),st=su*9+Math.floor(rng()*7);
    if(c[st]<4&&c[st+1]<4&&c[st+2]<4){c[st]++;c[st+1]++;c[st+2]++;return true;}return false;};
  const addTriplet=()=>{const t=Math.floor(rng()*34);if(c[t]+3<=4){c[t]+=3;return true;}return false;};
  const addSet=()=>(rng()<0.25?addTriplet():addRun());
  const addPair=()=>{const t=rng()<0.2?27+Math.floor(rng()*7):Math.floor(rng()*27);
    if(c[t]+2<=4){c[t]+=2;return true;}return false;};
  const taatsuTiles=[];
  const addTaatsu=()=>{const su=Math.floor(rng()*3);
    if(rng()<0.7){const st=su*9+Math.floor(rng()*8);
      if(c[st]<4&&c[st+1]<4){c[st]++;c[st+1]++;taatsuTiles.push(st,st+1);return true;}}
    else{const st=su*9+Math.floor(rng()*7);
      if(c[st]<4&&c[st+2]<4){c[st]++;c[st+2]++;taatsuTiles.push(st,st+2);return true;}}
    return false;};
  // パターン1の余り牌: 孤立牌でなく、残ったターツの±2以内(同色)か重なり
  const addTaatsuRelated=()=>{
    if(!taatsuTiles.length) return false;
    const base=taatsuTiles[Math.floor(rng()*taatsuTiles.length)];
    const off=[-2,-1,0,1,2][Math.floor(rng()*5)];
    const t=base+off;
    if(t<0||t>=27||Math.floor(t/9)!==Math.floor(base/9)) return false;
    if(c[t]>=4) return false;
    c[t]++; return true;};
  // パターン2のくっつき牌: 中張(3-7)の孤立牌
  const addMiddleFloat=()=>{const su=Math.floor(rng()*3),t=su*9+2+Math.floor(rng()*5);
    if(c[t]>0) return false;
    if((t%9)>0&&c[t-1]>0) return false;
    if((t%9)<8&&c[t+1]>0) return false;
    if(c[t]<4){c[t]++;return true;}return false;};
  const addDistinct=(allowHonor,noAdjacent)=>{
    const t=allowHonor&&rng()<0.25?27+Math.floor(rng()*7):Math.floor(rng()*27);
    if(c[t]>0) return false;
    if(noAdjacent&&t<27){
      if((t%9)>0&&c[t-1]>0) return false;
      if((t%9)<8&&c[t+1]>0) return false;
    }
    return (c[t]=1,true);};
  const addDistinctPair=()=>{const t=rng()<0.25?27+Math.floor(rng()*7):Math.floor(rng()*27);
    if(c[t]>0) return false;
    c[t]=2; return true;};
  for(let attempt=0;attempt<3000;attempt++){
    c.fill(0); taatsuTiles.length=0;
    const pat=forcePat||1+Math.floor(rng()*4);
    const steps=
      pat===1?[addSet,addSet,addPair,addTaatsu,addTaatsu,addTaatsuRelated]
     :pat===2?[addSet,addSet,addSet,addPair,addMiddleFloat,addMiddleFloat]
     :pat===3?[addRun,addRun,addRun,addTaatsu,addTaatsu]
     :[addDistinctPair,addDistinctPair,addDistinctPair,addDistinctPair,addDistinctPair,
       ()=>addDistinct(true,false),()=>addDistinct(true,false),()=>addDistinct(true,false)];
    let ok=true;
    for(const f of steps){
      let placed=false;
      for(let tr=0;tr<30&&!placed;tr++)placed=f();
      if(!placed){ok=false;break;}
    }
    if(!ok) continue;
    if(c.reduce((a,x)=>a+x,0)!==13) continue;
    if(pat===3&&c.some(x=>x>=2)) continue;        // 雀頭なし: 対子が一切ないこと
    if(shanten(c)!==1) continue;
    if(u1PatternOf(c)!==pat) continue;            // 分類が一意に目標パターンと一致
    const u=ukeire(c);
    const maxAcc=pat===2?12:9;  // くっつきは性質上受け入れが広い
    if(u.tiles.length>=3&&u.tiles.length<=maxAcc)
      return {counts:c.slice(), accepts:u.tiles.map(idx2code), pattern:pat};
  }

}
// 1シャンテン手牌の生成（清一色形・待ち当てと同形式）。ランダム生成＋rejection sampling。
function genSuitIishanten(numTiles,rng){
  rng=rng||Math.random;
  const nSets=(numTiles-1)/3;
  for(let attempt=0;attempt<1200;attempt++){
    const cnt=new Array(9).fill(0);
    let left=numTiles;
    while(left>0){
      const t=Math.floor(rng()*9);
      if(cnt[t]<4){cnt[t]++;left--;}
    }
    if(suitShanten(cnt,nSets)!==1) continue;
    const accepts=suitAccepts(cnt,nSets);
    if(accepts.length>=2&&accepts.length<=6) return {counts:cnt, accepts};
  }
  return null;
}
function u1Lv(numTiles,acceptCount){
  if(numTiles===7) return acceptCount>=4?5:4;
  if(numTiles===10) return acceptCount>=4?7:6;
  return acceptCount>=5?9:8;
}

function pinDot(x,y,r,c){
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/>'
    +'<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.58)+'" fill="'+TC.face+'"/>'
    +'<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.26)+'" fill="'+c+'"/>';
}
function souStick(x,y,h,c,cap){
  cap=cap||c;
  const t=y-h/2;
  return '<rect x="'+(x-3.6)+'" y="'+t+'" width="7.2" height="'+h+'" rx="3.2" fill="'+c+'"/>'
    +'<rect x="'+(x-3.6)+'" y="'+(t+h*0.32)+'" width="7.2" height="2.1" fill="'+TC.face+'" opacity="0.85"/>'
    +'<rect x="'+(x-3.6)+'" y="'+(t+h*0.66)+'" width="7.2" height="2.1" fill="'+TC.face+'" opacity="0.85"/>'
    +'<circle cx="'+x+'" cy="'+(t+2)+'" r="2.6" fill="'+cap+'"/><circle cx="'+x+'" cy="'+(t+h-2)+'" r="2.6" fill="'+cap+'"/>';
}
function tileFace(code){
  const B=TC.blue,R=TC.red,G=TC.green;
  let g='';
  if(code.length===1){
    if(code==='B'){ g=''; } // 白＝何も描かない無地の牌
    else{
      const col=code==='G'?G:code==='R'?R:'#2c3630';
      // 縦長バランス: 中心(30,42)基準で縦方向のみ1.3倍に伸長（横幅は従来サイズ）
      g='<g transform="translate(30,42) scale(1,1.3)"><text x="0" y="16.5" text-anchor="middle" font-size="46" font-family="'+BRUSH+'" fill="'+col+'" stroke="'+col+'" stroke-width="0.6">'+HONOR[code]+'</text></g>';
    }
  }else{
    const num=+code[0], su=code[1];
    if(su==='m'){
      g='<text x="30" y="36" text-anchor="middle" font-size="31" font-family="'+BRUSH+'" fill="'+TC.ink+'" stroke="'+TC.ink+'" stroke-width="0.7">'+KANJI[num-1]+'</text>'

    }else if(su==='p'){
      const P=[];
      if(num===1){ g='<circle cx="30" cy="42" r="19" fill="'+R+'"/><circle cx="30" cy="42" r="14" fill="'+TC.face+'"/><circle cx="30" cy="42" r="10" fill="'+B+'"/><circle cx="30" cy="42" r="5.5" fill="'+TC.face+'"/><circle cx="30" cy="42" r="2.6" fill="'+R+'"/>'; }
      else if(num===2){ P.push([30,23,10,B],[30,61,10,B]); }
      else if(num===3){ P.push([15,19,9,B],[30,42,9,R],[45,65,9,B]); }
      else if(num===4){ P.push([18,23,9.5,B],[42,23,9.5,B],[18,61,9.5,B],[42,61,9.5,B]); }
      else if(num===5){ P.push([16,21,8.5,B],[44,21,8.5,B],[30,42,8.5,R],[16,63,8.5,B],[44,63,8.5,B]); }
      else if(num===6){ P.push([19,19,8.5,B],[41,19,8.5,B],[19,42,8.5,R],[41,42,8.5,R],[19,65,8.5,R],[41,65,8.5,R]); }
      else if(num===7){ P.push([13,15,7,B],[29,19,7,B],[45,23,7,B],[19,47,8,R],[41,47,8,R],[19,67,8,R],[41,67,8,R]); }
      else if(num===8){ P.push([19,15,7.5,B],[41,15,7.5,B],[19,33,7.5,B],[41,33,7.5,B],[19,51,7.5,B],[41,51,7.5,B],[19,69,7.5,B],[41,69,7.5,B]); }
      else { P.push([15,19,7.5,B],[30,19,7.5,B],[45,19,7.5,B],[15,42,7.5,R],[30,42,7.5,R],[45,42,7.5,R],[15,65,7.5,B],[30,65,7.5,B],[45,65,7.5,B]); }
      for(const [x,y,r,c] of P) g+=pinDot(x,y,r,c);
    }else{
      if(num===1){
        // 一索: トレース版（他の牌と同じフラットなベクター）／ USE_1S_TRACE=false で実物画像版
        g=USE_1S_TRACE ? S1TRACE : '<image href="'+S1IMG+'" x="5.5" y="6" width="49" height="72"/>';
      }else if(num===8){
        // 八索: 上が「M」、下が「W」— 外側は縦、内側の2本が中央でV字に合わさる
        const P8=[[14,23,26,0],[24,24,24,35],[36,24,24,-35],[46,23,26,0],
                  [14,61,26,0],[24,60,24,-35],[36,60,24,35],[46,61,26,0]];
        for(const [x,y,h,a] of P8){
          const st=souStick(x,y,h,G);
          g+=a?'<g transform="rotate('+a+' '+x+' '+y+')">'+st+'</g>':st;
        }
      }else{
        const S=[];
        if(num===2){ S.push([30,23,26,G],[30,60,26,G]); }
        else if(num===3){ S.push([30,20,24,G],[18,58,24,G],[42,58,24,G]); }
        else if(num===4){ S.push([18,23,26,G],[42,23,26,G],[18,61,26,G],[42,61,26,G]); }
        else if(num===5){ S.push([16,21,24,G],[44,21,24,G],[30,42,24,R],[16,63,24,G],[44,63,24,G]); }
        else if(num===6){ S.push([16,23,26,G],[30,23,26,G],[44,23,26,G],[16,61,26,G],[30,61,26,G],[44,61,26,G]); }
        else if(num===7){ S.push([30,17,20,R],[16,45,20,G],[30,45,20,G],[44,45,20,G],[16,69,20,G],[30,69,20,G],[44,69,20,G]); }
        else { S.push([16,17,20,G],[30,17,20,G],[44,17,20,G],[16,42,20,R],[30,42,20,R],[44,42,20,R],[16,67,20,G],[30,67,20,G],[44,67,20,G]); }
        for(const [x,y,h,c] of S) g+=souStick(x,y,h,c);

function tileHTML(code, extra){
  extra=extra||'';
  const cls=code.length===1?'z':code[1];
  return '<div class="tile '+cls+' '+extra+'">'+tileFace(code)+'</div>';
}
function parseHand(str){
  const out=[]; let nums=[];
  for(const ch of str){
    if(ch>='1'&&ch<='9') nums.push(ch);
    else if('mps'.includes(ch)){ for(const n of nums) out.push(n+ch); nums=[]; }
    else if('ESWNBGR'.includes(ch)) out.push(ch);
  }
  return out;
}
function sortTiles(tiles){
  const order=t=>t.length===1?100+'ESWNBGR'.indexOf(t):({m:0,p:10,s:20}[t[1]])+ +t[0];
  return tiles.slice().sort((a,b)=>order(a)-order(b));
}
function handHTML(str){
  return '<div class="hand">'+sortTiles(parseHand(str)).map(t=>tileHTML(t)).join('')+'</div>';
}

const TV_SEAT={E:'東',S:'南',W:'西',N:'北'};
// ドラ表示牌→実ドラ変換（麻雀の標準規則: 数牌は次の数字・9→1、風牌は東南西北の循環、三元牌は白發中の循環）
function doraFromIndicator(cd){
  if(cd.length===2){ const n=+cd[0]; return (n===9?1:n+1)+cd[1]; }
  const winds='ESWN', dragons='BGR';
  if(winds.includes(cd)) return winds[(winds.indexOf(cd)+1)%4];
  return dragons[(dragons.indexOf(cd)+1)%3];
}
const TV_REVEAL={

  T2:{myRiver:1,riichiRivers:1,honbaKyotaku:1,allRivers:1,calls:1,scores:1},

function tvRiv(str){
  return str.trim().split(/\s+/).map(tok=>{
    const r=tok.charAt(0)==='*';
    const t=r?tok.slice(1):tok;
    return r?{t,riichi:true}:{t};
  });
}
function tvRanks(scores){
  const seats=['E','S','W','N'].filter(x=>scores[x]!=null);
  const sorted=seats.slice().sort((a,b)=>scores[b]-scores[a]||seats.indexOf(a)-seats.indexOf(b));
  const r={}; sorted.forEach((x,i)=>r[x]=i+1); return r;

/* ================= Compare基盤（P4-A・ステートレス） =================
   applyPatch: フィールドパス方式。baseは変更せずdeep copyに適用（shallow merge禁止・既決定） */
function parsePath(path){
  const toks=[];
  for(const seg of path.split('.')){
    const m=seg.match(/^([^\[]+)((\[\d+\])*)$/);
    if(!m){ toks.push(seg); continue; }
    toks.push(m[1]);
    const idx=seg.match(/\[(\d+)\]/g)||[];
    for(const x of idx) toks.push(parseInt(x.slice(1,-1),10));
  }
  return toks;
}
function applyPatch(base,patch){
  const out=JSON.parse(JSON.stringify(base));
  for(const op of (patch||[])){
    const toks=parsePath(op.path);
    let cur=out;
    for(let i=0;i<toks.length-1;i++){
      const k=toks[i];
      if(cur[k]==null) cur[k]=(typeof toks[i+1]==='number')?[]:{};
      cur=cur[k];
    }
    const last=toks[toks.length-1];
    if(op.op==='delete'){
      if(Array.isArray(cur)&&typeof last==='number') cur.splice(last,1);
      else delete cur[last];
    }else{
      cur[last]=(op.value===undefined)?null:JSON.parse(JSON.stringify(op.value));
    }
  }
  return out;
}
/* changedCategories: patchのpathから表示カテゴリを自動導出（保存しない・既決定）。同一カテゴリは1つに集約 */
const PATCH_CATEGORY_MAP=[
  [/(^|\.)turn$/,'巡目'],
  [/(^|\.)scores(\.|\[|$)/,'点棒状況'],
  [/(^|\.)doraIndicators(\.|\[|$)/,'ドラ'],
  [/(^|\.)dora(\.|\[|$)/,'ドラ'],
  [/(^|\.)(dealer|seat|isDealer)(\.|$)/,'親子'],
  [/(^|\.)rivers(\.|\[|$)/,'河'],
  [/(^|\.)riichi(\.|\[|$)/,'相手リーチ'],
  [/(^|\.)calls(\.|\[|$)/,'鳴き'],
  [/(^|\.)round$/,'局'],
  [/(^|\.)hand$/,'手牌'],
  [/(^|\.)draw$/,'ツモ牌'],
  [/(^|\.)(honba|kyotaku)$/,'供託・本場'],
  [/(^|\.)note$/,'状況'],
];
function changedCategoriesOf(patch){
  const cats=[];
  for(const op of (patch||[])){
    let label='その他';
    for(const [re,lab] of PATCH_CATEGORY_MAP){ if(re.test(op.path)){ label=lab; break; } }
    if(!cats.includes(label)) cats.push(label);
  }
  return cats;
}

/* ---- 旧situ→context変換層（P3-B）。情報保存の原則:
   入力に存在しない河・点数・seat・巡目リーチ等を一切生成しない。 ---- */
function legacySituToContext(st){

    note: st.note||null,
    claim: st.claim||null,
  };
}

/* [legacy] situHTML: P3-BでTableViewへ移行済み・現在未使用。削除は別ステップで判断（物理削除禁止の指示による残置） */
function situHTML(st){

  if(st.turn) h+='<span class="sub">'+st.turn+'巡目</span>';

  h+='<span class="situ-dora">ドラ'+(st.dora?tileHTML(st.dora):'なし')+'</span>';
  h+='</div>';
  if(st.note) h+='<div class="situ-note">⚠️ '+st.note+'</div>';
  h+='</div>';
  h+=handHTML(st.hand);
  if(st.claim) h+='<div class="situ-claim">上家の捨て牌 →'+tileHTML(st.claim)+'</div>';
  return h;
}

// 1レッスンの問題数(第7段階: 原則10問・1レッスン2〜3分想定)。
// lesson.qn > subTheme.qn > theme.qn > 既定10 の順で上書きできる
// (将来: 超入門8問・まとめ12問などをデータ側だけで設定可能)
const LESSON_QN_DEFAULT=10;
// レッスン内復習(第7段階追加改善): 間違えた問題を同じレッスン内で取り返す
const REVIEW_GAP=2;   // 不正解の直後に出さず、最低この問数だけ別問題を挟んでから再出題
const REVIEW_MAX=2;   // 1問あたりの復習回数上限(初回→復習1→復習2)。超えたらneedsReviewとして残す
function themeLessons(t){                      // 小テーマを平坦化した通しレッスン一覧
  const out=[];
  t.subThemes.forEach(st=>st.lessons.forEach((ls,i)=>out.push(
    {sub:st,diff:ls.diff||null,subIdx:i,isLast:i===st.lessons.length-1,
     qn:ls.qn||st.qn||t.qn||LESSON_QN_DEFAULT})));
  return out;
}
function themeFrontier(t){ return Math.min(S.roadProgress[t.id]||0,themeLessons(t).length); }

<script>
/* ================= 状態管理 ================= */
const DEFAULT_STATE={schemaVersion:1,xp:0,hearts:5,gems:120,streak:0,lastDay:null,avatar:'🐦',

  learningDays:{},trainingBest:{},roadProgress:{},daily:null,chests:{},dev:false};
let S=loadState();
if((S.bestStreak||0)<S.streak) S.bestStreak=S.streak;  // 旧データ互換: 最長記録を現在値で初期化
// 旧データ互換: 日別履歴が無い場合、最終学習日だけ'completed'として補完(過去の全履歴は復元不能)
if(S.lastDay&&!S.learningDays[S.lastDay]) S.learningDays[S.lastDay]='completed';
// 旧データ互換: course単位の王冠進捗をtheme/lesson進捗へ一度だけ移行(王冠1つ=1レッスンクリア扱い)
if(Object.keys(S.roadProgress).length===0){
  let migrated=false;
  THEMES.forEach(t=>{ const c=S.crowns[t.course]||0;
    if(c>0){ S.roadProgress[t.id]=Math.min(c,themeLessons(t).length); migrated=true; } });
  if(migrated) save();
}
function loadState(){
  try{
    const raw=localStorage.getItem('jantore-v1');
    if(raw){ const s=JSON.parse(raw); return Object.assign({},DEFAULT_STATE,s,{owned:Object.assign({},DEFAULT_STATE.owned,s.owned||{}),crowns:s.crowns||{},best:s.best||{},
      ratings:Object.assign({},DEFAULT_STATE.ratings,s.ratings||{}),ratingN:Object.assign({},DEFAULT_STATE.ratingN,s.ratingN||{}),seenNk:s.seenNk||{},seenRq:s.seenRq||{},
      learningDays:s.learningDays||{},trainingBest:s.trainingBest||{},roadProgress:s.roadProgress||{},
      daily:s.daily||null,chests:s.chests||{}}); }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save(){ try{ localStorage.setItem('jantore-v1',JSON.stringify(S)); }catch(e){} }
// ローカル(端末)の年月日でYYYY-MM-DD。旧実装はUTC日付だったため日本の朝にストリークがずれた。
// 保存形式は同じYYYY-MM-DD文字列なので既存localStorageと互換。
function todayStr(){
  const d=new Date();
  return [d.getFullYear(),
          String(d.getMonth()+1).padStart(2,'0'),
          String(d.getDate()).padStart(2,'0')].join('-');
}

try{

  document.documentElement.style.setProperty('--m-unlock',MOTION.unlock+'ms');

// 節目コンボ: キー=コンボ数・値=サブ文言。20,30…は行を足すだけで拡張できる
const COMBO_MILESTONES={5:'いい調子！',10:'PERFECT!'};
function reducedMotion(){
  try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}
/* 中央オーバーレイ演出。pointer-events:noneで進行を塞がず、報酬・状態は一切ここで扱わない
   (報酬ロジックはanimation/timeoutに依存させない=finishLesson側で先に確定済み) */
let FX_TIMER=null;
function playFx(inner,cls,dur,done){
  const el=document.getElementById('fx');
  // reduced-motion時はオーバーレイ演出を出さず、ほぼ即時に次へ(進行はタイマーのみで保証)
  if(!el||reducedMotion()){ if(done)setTimeout(done,0); return; }
  if(FX_TIMER){ clearTimeout(FX_TIMER); FX_TIMER=null; }
  el.innerHTML='<div class="fx-box">'+inner+'</div>';
  el.className='fx show '+cls;
  FX_TIMER=setTimeout(()=>{
    el.classList.add('fade');
    FX_TIMER=setTimeout(()=>{ el.className='fx'; el.innerHTML=''; FX_TIMER=null; if(done)done(); },220);
  },dur);
}

const DAILY_MISSIONS=[

/* 進捗はローカル日付(todayStr・第5段階でローカルY-M-D化済み)単位。日付が変われば新規初期化し、
   過去日の進捗は持ち越さない。保存先はS.daily(jantore-v1内)={date,progress,completed,completedAt} */
function ensureDaily(){
  const today=todayStr();
  if(!S.daily||S.daily.date!==today){
    S.daily={date:today,progress:{},completed:false,completedAt:null};
    DAILY_MISSIONS.forEach(m=>S.daily.progress[m.id]=0);
    save();
  }
  if(!S.daily.progress) S.daily.progress={};
  return S.daily;
}
function missionProgress(m){ return Math.min(ensureDaily().progress[m.id]||0,m.target); }
function missionDone(m){ return missionProgress(m)>=m.target; }
function missionDoneCount(){ return DAILY_MISSIONS.filter(missionDone).length; }
let DAILY_FX_PENDING=false;  // DAILY COMPLETE演出の予約(解説を邪魔しないタイミング=リザルトで再生)
function bumpMission(id,amt){
  const d=ensureDaily();
  const m=DAILY_MISSIONS.find(x=>x.id===id); if(!m||amt<=0) return;
  const before=d.progress[id]||0;
  if(before>=m.target) return;                 // 二重達成防止
  d.progress[id]=Math.min(m.target,before+amt);
  if(d.progress[id]>=m.target){
    queueToast('✓ デイリーミッション達成！',m.title);
    // 3つ全達成→DAILY COMPLETE(1日1回のみ。completedフラグで再表示を防ぐ)
    if(!d.completed&&DAILY_MISSIONS.every(missionDone)){
      d.completed=true; d.completedAt=new Date().toISOString();
      DAILY_FX_PENDING=true;
    }
  }
  save();
}
/* ミッション達成トースト: 画面上部の小さなチップ。pointer-events:noneでレッスン進行・
   コンボ演出・解説と共存し、順番に1つずつ約1.3秒で自然に消える(全画面演出にしない) */
let TOAST_Q=[],TOAST_ON=false;
function queueToast(title,sub){ TOAST_Q.push({title,sub}); pumpToast(); }
function pumpToast(){
  if(TOAST_ON||!TOAST_Q.length) return;
  const el=document.getElementById('toast');
  if(!el){ TOAST_Q=[]; return; }
  TOAST_ON=true;
  const t=TOAST_Q.shift();
  el.innerHTML='<div class="toast-t">'+t.title+'</div>'+(t.sub?'<div class="toast-s">'+t.sub+'</div>':'');
  el.classList.add('show');
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>{ TOAST_ON=false; pumpToast(); },reducedMotion()?20:260);
  },reducedMotion()?300:MOTION.toast);
}

/* ================= レッスン/トレーニングの時間・ランク（第5段階） ================= */
// 経過msを読みやすく: 60秒未満=「42秒」(trainingは0.1秒精度「38.4秒」)、以上=「1:24」
function fmtDur(ms,precise){
  const s=ms/1000;
  if(s<60) return (precise?s.toFixed(1):Math.round(s))+'秒';
  const m=Math.floor(s/60), r=Math.round(s%60);
  return m+':'+String(r).padStart(2,'0');
}
/* トレーニングのタイムランク閾値(秒・種別ごと)。
   【DEV/provisional】数値はすべて開発用の仮値であり正式基準ではない——正式値は後日ゾエが設定する。
   種別キーは trainingBest と同じ粒度(将来 waits_4 / ukeire_13 等も追加可能)。
   エントリが無い種別はランク非表示。thresholds順: S→A→B、超過はC。 */
const TRAINING_RANK_THRESHOLDS={
  waits:   {S:40, A:70, B:110},   // DEV/provisional
  nanikiru:{S:50, A:90, B:140},   // DEV/provisional
  riichi:  {S:35, A:60, B:100},   // DEV/provisional
};
function rankForTime(typeKey,ms){
  const th=TRAINING_RANK_THRESHOLDS[typeKey];
  if(!th) return null;                 // 基準未設定の種別はランクを出さない
  const sec=ms/1000;
  return sec<=th.S?'S':sec<=th.A?'A':sec<=th.B?'B':'C';
}

/* ================= スキルレーティング（v2.2仕様） ================= */
const CAT_LABEL={waits:'待ち',nanikiru:'何切る',riichi:'リーチ判断',ukeire1:'受け入れ'};
const TWO_CHOICE_CATS=['riichi']; // 2択カテゴリはE'=0.5+0.5E補正（v2.2仕様どおり）
function ratingUpdate(cat,lv,qual,isReview){
  const R0=S.ratings[cat];
  const d=lv*10+5;
  let E=1/(1+Math.pow(10,(d-R0)/20));
  if(TWO_CHOICE_CATS.includes(cat)) E=0.5+0.5*E;
  // K: 排他的分岐（復習 > 収束期 > 通常）
  const K=isReview?1.5:(S.ratingN[cat]<20?6:3);
  const delta=K*(qual-E);
  const C=(delta>0&&R0>90)?(100-R0)/10:1;
  const R1=Math.min(100,Math.max(0,R0+C*delta));
  S.ratings[cat]=R1;
  S.ratingN[cat]++;
  return {R0,R1,E,K,d,delta:C*delta};
}
// 待ちS（v2.2 §5.2）: max(0,(当てた数-誤選択数)/正解数)
function qualityWaits(selSet,waitArr){
  const want=new Set(waitArr);
  let hit=0,wrongPick=0;
  for(const n of selSet){ if(want.has(n))hit++; else wrongPick++; }
  return Math.max(0,(hit-wrongPick)/want.size);
}
// 何切るS（v2.2 §5.1・シャンテン基準）: 最善=1 / シャンテン悪化=0 / 維持=min(0.9,U(x)/U(b))
function qualityNanikiru(q,chosen){
  if(chosen===q.a) return 1;
  const cnt=new Array(34).fill(0);
  const idx=t=>t.length===1?27+'ESWNBGR'.indexOf(t):({m:0,p:9,s:18}[t[1]])+ +t[0]-1;
  for(const t of parseHand(q.hand)) cnt[idx(t)]++;
  const bi=idx(q.a), xi=idx(chosen);
  cnt[bi]--; const shB=shanten(cnt); const uB=ukeire(cnt).count; cnt[bi]++;
  cnt[xi]--; const shX=shanten(cnt); const uX=(shX===shB)?ukeire(cnt).count:0; cnt[xi]++;
  if(shX>shB||uB<=0) return 0;
  return Math.min(0.9, uX/uB);
}
function qualityMark(qual,cat){
  if(qual>=1) return {icon:'◎',label:cat==='nanikiru'?'◎ 最善！':((cat==='waits'||cat==='ukeire1')?'◎ パーフェクト！':'◎ 正解！'),cls:'ok'};
  if(qual>=0.7) return {icon:'○',label:'○ 惜しい！',cls:'mid'};
  return {icon:'✕',label:'✕ ざんねん…',cls:'ng'};
}
function idx2code(t){ return t<27 ? ((t%9)+1)+'mps'[Math.floor(t/9)] : 'ESWNBGR'[t-27]; }
function tileLabel(code){ return code.length===1?HONOR[code]:code[0]+SUITCH[code[1]]; }
function countsToStr(c){
  let out='';
  for(let su=0;su<3;su++){
    let part='';
    for(let i=0;i<9;i++) for(let k=0;k<c[su*9+i];k++) part+=(i+1);
    if(part) out+=part+'mps'[su];
  }
  for(let t=27;t<34;t++) for(let k=0;k<c[t];k++) out+='ESWNBGR'[t-27];
  return out;
}
// 何切る自動生成 v2（シャンテン維持×受け入れ最大・唯一解保証・4枚使い除外）
function genNanikiru(rng,seed){
  for(let attempt=0;attempt<300;attempt++){
    const c=new Array(34).fill(0);
    const suits=[0,9,18];
    const r0=rng();
    const k = r0<0.35?3 : r0<0.8?2 : 1;
    let ok=true;
    for(let b=0;b<k;b++){
      let placed=false;
      const off=suits[Math.floor(rng()*3)];
      for(let t=0;t<20&&!placed;t++){
        if(rng()<0.25){ const x=off+Math.floor(rng()*9); if(c[x]+3<=4){c[x]+=3;placed=true;} }
        else{ const st=off+Math.floor(rng()*7); if(c[st]<4&&c[st+1]<4&&c[st+2]<4){c[st]++;c[st+1]++;c[st+2]++;placed=true;} }
      }
      if(!placed){ok=false;break;}
    }
    if(!ok) continue;
    let Lc=14-3*k;
    if(rng()<0.10&&Lc>=3){ const hz=27+Math.floor(rng()*7); c[hz]+=2; Lc-=2; }
    const sA=suits[Math.floor(rng()*3)], sB=suits[Math.floor(rng()*3)];
    for(let i=0;i<Lc;i++){
      let placed=false;
      for(let t=0;t<20&&!placed;t++){
        const x=(rng()<0.8?sA:sB)+Math.floor(rng()*9);
        if(c[x]<4){c[x]++;placed=true;}
      }
      if(!placed){ok=false;break;}
    }
    if(!ok||c.reduce((a,b)=>a+b,0)!==14) continue;
    if(c.some(x=>x===4)) continue;                 // 4枚使いは不自然なので除外
    // 【第3回レビュー修正】ツモ後14枚が既に和了形なら「何切る」として成立しないため不採用。
    // 既存エンジンのshanten()(標準形+七対子+国士対応)で判定: 完成形は-1。
    // 従来はminSh(打牌後13枚)しか見ておらず、和了形→1枚切るとテンパイ(minSh=0)で素通りしていた。
    if(shanten(c)===-1) continue;
    // 全打牌のシャンテン → 維持候補の受け入れ
    let minSh=99; const shOf={};
    for(let t=0;t<34;t++){
      if(!c[t]) continue;
      c[t]--; const sv=shanten(c); c[t]++;
      shOf[t]=sv; if(sv<minSh) minSh=sv;
    }
    if(minSh<0||minSh>2) continue;
    const cands=[];
    for(const t in shOf){
      if(shOf[t]!==minSh) continue;
      const ti=+t;
      c[ti]--; const u=ukeire(c); c[ti]++;
      cands.push({t:ti,count:u.count,kinds:u.tiles.length});
    }
    if(cands.length<2) continue;
    cands.sort((a,b)=>b.count-a.count);
    if(cands[0].count===cands[1].count) continue;  // 唯一解のみ
    const best=cands[0], second=cands[1];
    if(best.count<6) continue;
    // 難度Lv（プロト用ルール。回答ログで後日校正する前提）
    const ratio=second.count/best.count;
    let lv = minSh===0?2 : minSh===1?3 : 4;
    lv += ratio>=0.96?3 : ratio>=0.85?2 : ratio>=0.70?1 : ratio>=0.50?0 : -1;
    lv += cands.length>=5?2 : cands.length>=3?1 : 0;
    let iso=false;
    if(c[best.t]===1){
      iso=true;
      if(best.t<27){
        for(let d=-2;d<=2;d++){
          if(d===0) continue;
          const u=best.t+d;
          if(u>=0&&u<34&&Math.floor(u/9)===Math.floor(best.t/9)&&c[u]>0){iso=false;break;}
        }
      }
    }
    if(iso) lv = ratio<0.5?1:2;
    lv=Math.max(1,Math.min(9,lv));
    const bc=idx2code(best.t), sc=idx2code(second.t);
    const shTxt = minSh===0?'テンパイ':minSh+'シャンテン';
    const exp='現在'+shTxt+'。打'+tileLabel(bc)+'がシャンテンを保って受け入れ最大の'+best.count+'枚（'+best.kinds+'種）。'
      +'次善の打'+tileLabel(sc)+'は'+second.count+'枚。'
      +(iso?'孤立した'+tileLabel(bc)+'を払うのがポイント。':'');
    return {gen:true,id:'nkseed:'+seed,seed,hand:countsToStr(c),a:bc,lv,
      fs:'nk:sh'+minSh+':r'+Math.round(ratio*100)+':c'+cands.length+(iso?':iso':''),exp,
      dbg:{sh:minSh,ub:best.count,us:second.count,cand:cands.length}};
  }
  return null;
}
function waitsLv(numTiles,waitCount){
  if(numTiles===4) return waitCount>=2?3:2;
  if(numTiles===7) return waitCount>=3?5:4;
  if(numTiles===10) return waitCount>=4?7:6;
  return waitCount>=5?9:8;
}
// v2.2 §5: 中心±バンド出題（適正70% R±10 / 挑戦20% R+10〜20 / 自信10% R−20、2連続大失敗で自信回復を挿入）
function pickTargetLv(cat){
  const R=S.ratings[cat];
  const lo=cat==='waits'?2:1, hi=9;
  let d;
  if(L&&L.bigMiss>=2){ d=R-20; L.bigMiss=0; }
  else{
    const r=Math.random();
    d = r<0.7 ? R+(Math.random()*20-10) : r<0.9 ? R+10+Math.random()*10 : R-20;
  }
  return Math.max(lo,Math.min(hi,Math.round((d-5)/10)));
}
const WLV_TILES={1:4,2:4,3:4,4:7,5:7,6:10,7:10,8:13,9:13};
function genWaitsAt(targetLv){
  let bestQ=null,bestDiff=99;
  for(let tr=0;tr<25;tr++){
    const seed=(Math.random()*0x7fffffff)|0;
    const rng=mulberry32(seed);
    const nt=WLV_TILES[targetLv];
    const g=genSuitTenpai(nt,rng);
    if(!g) continue;
    const lv=waitsLv(nt,g.waits.length);
    const diff=Math.abs(lv-targetLv);
    if(diff<bestDiff){
      const ankou=g.counts.filter(x=>x>=3).length;
      bestQ={wtype:true,level:nt,counts:g.counts,waits:g.waits,
        suit:['m','p','s'][Math.floor(rng()*3)],seed,lv,
        fs:'w:t'+nt+':w'+g.waits.length+':a'+ankou};
      bestDiff=diff;
    }
    if(diff===0) break;
  }
  if(!bestQ){
    const g=genSuitTenpai(4,Math.random);   // 最終フォールバック
    if(g) bestQ={wtype:true,level:4,counts:g.counts,waits:g.waits,suit:'m',seed:-1,lv:waitsLv(4,g.waits.length),fs:'w:fallback'};
  }
  return bestQ;
}
function genNanikiruAt(targetLv){
  let bestQ=null,bestDiff=99;
  for(let tr=0;tr<12;tr++){
    const seed=(Math.random()*0x7fffffff)|0;
    const g=genNanikiru(mulberry32(seed),seed);
    if(!g) continue;
    const diff=Math.abs(g.lv-targetLv);
    if(diff<bestDiff){ bestQ=g; bestDiff=diff; }
    if(diff<=1) break;                       // ±1Lvで妥協して速度優先
  }
  if(bestQ) return bestQ;
  // 最終フォールバック: 厳選問題（無限ループ防止）
  const pool=COURSES.find(x=>x.id==='nanikiru').questions;
  return Object.assign({curated:true},pool[Math.floor(Math.random()*pool.length)]);
}

/* ================= v3 P1: Question型メタ注釈と検証（挙動不変・注釈のみ） ================= */
const COURSE_V3={
 rules:   {unit:'u0',  skill:'game_basics',        cat:null,        depth:'KNOW'},
 yaku:    {unit:'u1',  skill:'yaku_knowledge',     cat:'yaku',      depth:'KNOW'},
 score:   {unit:'u1',  skill:'score_calculation',  cat:'score',     depth:'KNOW'},
 waits:   {unit:'u3',  skill:'wait_detection',     cat:'waits',     depth:'SEE'},
 nanikiru:{unit:'u4',  skill:'tile_efficiency',    cat:'shape',     depth:'ACT'},
 riichi:  {unit:'u6',  skill:'riichi_judgment',    cat:'riichi',    depth:'ACT'},
 naki:    {unit:'u7',  skill:'call_judgment',      cat:'call',      depth:'KNOW'},
 oshihiki:{unit:'u9',  skill:'push_fold',          cat:'push_fold', depth:'KNOW'},
 gyakuten:{unit:'u11', skill:'endgame_conditions', cat:'all_last',  depth:'KNOW'},
 anzen:   {unit:'u8',  skill:'safety_theory',      cat:'safety',    depth:'SEE'},
 betaori: {unit:'u8',  skill:'betaori_procedure',  cat:'safety',    depth:'KNOW'},
};
function v3QuestionType(q,course){
  if(course.type==='waits'||q.wtype) return 'tile_select';
  if(course.type==='discard') return 'discard';
  if(q.situ&&q.choices&&q.choices.length===2) return 'action';
  if(q.tchoices) return 'tile_select';
  return 'multiple_choice';
}
function v3Scoring(qt){
  // scoring = SをどうcomputeするかのID。0/1採点はquestionTypeを問わず 'binary' に統一。
  // 2択の偶然正答補正はscoringでなくレーティング側(E')の責務（v2.2）。
  return qt==='discard' ? 'ukeire' : 'binary';
}
function initV3(){
  for(const c of COURSES){
    const m=COURSE_V3[c.id]; if(!m||!c.questions) continue;
    c.questions.forEach((q,i)=>{
      const qt=v3QuestionType(q,c);
      q.v3={
        id:'qb:'+c.id+':'+(q.id||('q'+(i+1))),
        qv:QV,
        questionType:qt,
        primarySkill:m.skill,
        secondarySkills:[],
        trainingCategory:m.cat,
        unit:m.unit,
        learningDepth:q.situ?'ACT':m.depth,
        scoring:qt==='tile_select'&&q.wtype?'waits':v3Scoring(qt),
        lv:q.lv||null,
        tags:[],
      };
    });
  }
}
// 生成問題のv3メタ（生成器は変更せず、参照時に派生）
function v3MetaOf(q){
  if(q.v3) return q.v3;
  if(q.wtype) return {id:null,qv:QV,questionType:'tile_select',primarySkill:'wait_detection',
    trainingCategory:'waits',unit:'u3',learningDepth:'SEE',scoring:'waits',lv:q.lv,tags:[]};
  if(q.gen) return {id:null,qv:QV,questionType:'discard',primarySkill:'tile_efficiency',
    trainingCategory:'shape',unit:'u4',learningDepth:'ACT',scoring:'ukeire',lv:q.lv,tags:[]};
  return null;
}
// スキーマ検証（開発用。UI挙動には関与しない）
function validateV3(){
  const errs=[]; const ids=new Set(); let count=0;
  const chk=(cond,id,msg)=>{ if(!cond) errs.push(id+': '+msg); };
  for(const c of COURSES){
    if(!c.questions) continue;
    for(const q of c.questions){
      count++;
      const v=q.v3;
      chk(!!v, c.id, 'v3メタなし');
      if(!v) continue;
      chk(!ids.has(v.id), v.id, 'ID重複'); ids.add(v.id);
      chk(QTYPES.includes(v.questionType), v.id, '不正questionType:'+v.questionType);
      chk(v.primarySkill in SKILLS, v.id, '未登録skill:'+v.primarySkill);
      chk(v.trainingCategory===null||v.trainingCategory in V3_CATEGORIES, v.id, '不正category');
      chk(DEPTHS.includes(v.learningDepth), v.id, '不正depth');
      chk(typeof q.exp==='string'&&q.exp.length>0, v.id, '解説なし');
      if(q.choices) chk(q.a>=0&&q.a<q.choices.length, v.id, '正解indexが範囲外');
      if(q.tchoices) chk(q.a>=0&&q.a<q.tchoices.length, v.id, '正解indexが範囲外(tchoices)');
      if(c.type==='discard'&&q.hand){
        const t=parseHand(q.hand);
        chk(t.length===14, v.id, 'discard手牌が14枚でない:'+t.length);
        chk(t.includes(q.a), v.id, '正解牌が手牌にない');
      }
      if(q.situ){
        const t=parseHand(q.situ.hand);
        chk(t.length===13, v.id, 'situ手牌が13枚でない:'+t.length);
        if(q.situ.dora) chk(parseHand(q.situ.dora).length===1, v.id, 'ドラ指定が不正');
      }
      if(q.hand&&!q.situ&&c.type!=='discard'){
        chk(parseHand(q.hand).length>=1, v.id, 'hand解析不能');
      }
    }
  }
  return {ok:errs.length===0, count, errors:errs};
}

function nextLessonInfo(){
  // 次に進めるレッスン: 進行中(1つ以上クリア済み)の未完了テーマを最優先し、
  // なければ表示順で最初の未完了テーマ(=学びかけの場所へ戻る「つづきから」の意味)
  let first=null;
  for(let si=0;si<SECTIONS.length;si++){
    for(const t of THEMES){
      const c=COURSES.find(x=>x.id===t.course);
      if(!c||c.section!==si||!protoCourseVisible(c.id)) continue;
      const list=themeLessons(t), fr=themeFrontier(t);
      if(fr<list.length){
        const ls=list[fr];
        const info={tid:t.id,idx:fr,icon:c.icon,title:t.title,sub:ls.sub.title,
          label:ls.isLast?'まとめ':'Lesson '+(ls.subIdx+1)};
        if(fr>0) return info;
        if(!first) first=info;
      }
    }
  }
  return first;
}

function renderPath(){
  const wrap=document.getElementById('path-wrap');

  // レーティングはマイページ・トレーニングへ移設し、開いた瞬間にSECTION→ロードが見える
  let html='';
  const offsets=['','l','r','','l','r'];
  // 階層: SECTION帯 → 大テーマ帯(theme-band) → 小テーマ見出し(subtheme-head) → レッスンマス(node)
  SECTIONS.forEach((sec,si)=>{
    const ths=THEMES.filter(t=>{
      const c=COURSES.find(x=>x.id===t.course);
      return c&&c.section===si&&protoCourseVisible(c.id);
    });
    const rest=COURSES.filter(c=>c.section===si&&protoCourseVisible(c.id)&&!THEMES.some(t=>t.course===c.id));
    if(!ths.length&&!rest.length) return;  // 表示できるものがないセクションは帯ごと出さない
    html+='<div class="section-band"><h2>SECTION '+(si+1)+'：'+sec.name+'</h2><p>'+sec.desc+'</p></div>';
    ths.forEach(t=>{
      const c=COURSES.find(x=>x.id===t.course);
      const list=themeLessons(t);
      const fr=themeFrontier(t);
      html+='<div class="theme-band"><span class="tb-ico">'+c.icon+'</span>'
        +'<div class="tb-txt"><h3>'+t.title+'</h3><p>'+t.sub+'</p></div>'
        +'<span class="tb-prog">'+fr+'/'+list.length+'</span></div>';
      let gi=0;  // テーマ内の通しレッスン番号(小テーマをまたいで連番・蛇行も連続)
      t.subThemes.forEach(st=>{
        html+='<div class="subtheme-head"><span>'+st.title+'</span></div>';
        // subtheme-road: ロード本体(path)と将来の装飾レイヤー(deco-layer)を分離。
        // キャラ・吹き出し等は将来deco-layerへ配置(現状は空・非干渉)
        html+='<div class="subtheme-road"><div class="deco-layer" aria-hidden="true"></div>';
        html+='<div class="path">';
        st.lessons.forEach((ls,i)=>{
          const idx=gi++;
          const state=idx<fr?'done':(idx===fr?'next':'locked');
          const isFinal=i===st.lessons.length-1;   // 小テーマ最終=まとめ(★)
          const off=offsets[idx%offsets.length];
          const ico=state==='done'?'✓':(state==='locked'?'🔒':(isFinal?'★':c.icon));
          // 直近クリア/解放マスの演出クラス(afterLessonでのロード復帰時に一度だけ)
          let fx='';
          if(ROAD_FX&&ROAD_FX.theme===t.id){
            if(idx===ROAD_FX.cleared) fx=' just-cleared';
            else if(idx===ROAD_FX.unlocked) fx=' just-unlocked';
          }
          html+='<button class="node '+state+(isFinal?' final':'')+' '+off+fx+'"'
            +(state==='locked'?' disabled':'')
            +' data-th="'+t.id+'" data-idx="'+idx+'"'
            +' onclick="startThemeLesson(\''+t.id+'\','+idx+')">'
            +'<span class="ico">'+ico+'</span></button>';
          html+='<div class="node-label '+off+'">'+(isFinal?'まとめ':'Lesson '+(i+1))+'</div>';
          // 宝箱(第8段階): レッスンではない任意受取ノード。中央配置で蛇行の番号は消費しない
          if(st.chest&&st.chest.after===i+1){
            const need=gi;                       // ここまでのレッスンをクリアしたら受取可
            const cs=chestState(st.id,need,t.id);
            html+='<button class="chest-node '+cs+'"'+(cs==='locked'?' disabled':'')
              +' onclick="claimChest(\''+st.id+'\','+need+',\''+t.id+'\')">'
              +'<span class="ci">🎁</span>'+(cs==='claimed'?'<span class="cb">✓</span>':'')+'</button>';
            html+='<div class="node-label">ボーナス</div>';
          }
        });
        html+='</div></div>';
      });
    });
    // テーマ未整備のコース(開発フルモードの隠しコース等)は従来どおりのコースノードで表示
    // (PROTOTYPE_MODE=falseで全機能が復帰する原則を維持)
    if(rest.length){
      html+='<div class="path">';
      rest.forEach((c,i)=>{
        const cr=S.crowns[c.id]||0;
        const off=offsets[i%offsets.length];
        const cls=cr>=3?'done':(cr>0?'next':'');
        html+='<button class="node '+cls+' '+off+'" onclick="openCourse(\''+c.id+'\')">'
          +'<span class="ico">'+c.icon+'</span>'
          +(cr>0?'<span class="crowns">👑'+cr+'</span>':'')
          +'</button>';
        html+='<div class="node-label '+off+'">'+c.title+'</div>';
      });
      html+='</div>';
    }
  });
  html+='<p style="text-align:center;color:var(--ink-soft);font-size:12px;padding:10px 24px 0;">マスを順番にクリアして進もう。クリア済みのマスは何度でも挑戦できます</p>';
  wrap.innerHTML=html;
}
