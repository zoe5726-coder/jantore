function startLesson(id,waitLevel){
  closeModal();
  if(!staminaFree()&&S.hearts<=0){ staminaModal(); return; }
  const c=COURSES.find(x=>x.id===id);
  let qs=[];
  if(c.type==='waits'){
    for(let i=0;i<5;i++){
      const seed=(Math.random()*0x7fffffff)|0;
      const rng=mulberry32(seed);
      const g=genSuitTenpai(waitLevel,rng);
      if(g){
        const ankou=g.counts.filter(x=>x>=3).length;
        qs.push({wtype:true,level:waitLevel,counts:g.counts,waits:g.waits,
          suit:['m','p','s'][Math.floor(rng()*3)],
          seed,lv:waitsLv(waitLevel,g.waits.length),
          fs:'w:t'+waitLevel+':w'+g.waits.length+':a'+ankou});
      }
    }
  }else if(c.type==='ukeire1'){
    // 本番形: 4パターンを1レッスン内で網羅し(+1問ランダム)、パターン指定で生成
    const patPlan=shuffle([1,2,3,4,1+Math.floor(Math.random()*4)]);
    for(let i=0;i<5;i++){
      const seed=(Math.random()*0x7fffffff)|0;
      const rng=mulberry32(seed);
      if(waitLevel===34){
        const g=genFullIishanten(rng,patPlan[i]);
        if(g){
          qs.push({u1:true,full:true,level:'full',counts34:g.counts,accepts:g.accepts,
            pattern:g.pattern,
            seed,lv:9,fs:'u1:full:p'+g.pattern+':a'+g.accepts.length});
        }
      }else{
        const g=genSuitIishanten(waitLevel,rng);
        if(g){
          qs.push({u1:true,level:waitLevel,counts:g.counts,accepts:g.accepts,
            suit:['m','p','s'][Math.floor(rng()*3)],
            seed,lv:u1Lv(waitLevel,g.accepts.length),
            fs:'u1:t'+waitLevel+':a'+g.accepts.length});
        }
      }
    }
  }else if(c.type==='discard'){
    for(let i=0;i<3;i++){
      const seed=(Math.random()*0x7fffffff)|0;
      const g=genNanikiru(mulberry32(seed),seed);
      if(g) qs.push(g);
    }
    const cur=c.questions[Math.floor(Math.random()*c.questions.length)];
    qs.push(Object.assign({curated:true},cur));
    qs=shuffle(qs);
  }else{
    qs=shuffle(c.questions.slice()).slice(0,5);
  }
  // ロード＝学ぶ場所: レーティングは動かさない（トレーニングのみ変動）
  L={course:c,qs,idx:0,correct:0,sel:null,checked:false,done:false,rcat:null,ratingStart:null,startedAt:Date.now(),combo:0,maxCombo:0};
  document.getElementById('lesson').classList.add('show');
  renderQ();
}

/* ================= 学習ロード(テーマ制・第6段階) ================= */
// レッスンのdiff(出題条件)に従って5問を毎回生成/抽選する。問題はマスに固定しない。
// 麻雀ロジック(生成器・判定・採点)は既存のものをそのまま呼ぶだけで、一切変更しない。
function buildThemeQuestions(c,diff,n){
  n=n||LESSON_QN_DEFAULT;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const qs=[];
  if(c.type==='waits'){
    const lvls=(diff&&diff.waitsLevels)||[4,7,10,13];
    for(let i=0;i<n;i++){
      const level=pick(lvls);
      const seed=(Math.random()*0x7fffffff)|0;
      const rng=mulberry32(seed);
      const g=genSuitTenpai(level,rng);
      if(g){
        const ankou=g.counts.filter(x=>x>=3).length;
        qs.push({wtype:true,level,counts:g.counts,waits:g.waits,
          suit:['m','p','s'][Math.floor(rng()*3)],
          seed,lv:waitsLv(level,g.waits.length),
          fs:'w:t'+level+':w'+g.waits.length+':a'+ankou});
      }
    }
  }else if(c.type==='ukeire1'){
    const lvls=(diff&&diff.ukeireLevels)||[7,10,13,34];
    // 実戦形: 4パターンを必ず網羅し、残り枠はランダム
    const patPlan=[1,2,3,4];
    while(patPlan.length<n) patPlan.push(1+Math.floor(Math.random()*4));
    shuffle(patPlan);
    for(let i=0;i<n;i++){
      const level=pick(lvls);
      const seed=(Math.random()*0x7fffffff)|0;
      const rng=mulberry32(seed);
      if(level===34){
        const g=genFullIishanten(rng,patPlan[i]);
        if(g) qs.push({u1:true,full:true,level:'full',counts34:g.counts,accepts:g.accepts,
          pattern:g.pattern,seed,lv:9,fs:'u1:full:p'+g.pattern+':a'+g.accepts.length});
      }else{
        const g=genSuitIishanten(level,rng);
        if(g) qs.push({u1:true,level,counts:g.counts,accepts:g.accepts,
          suit:['m','p','s'][Math.floor(rng()*3)],
          seed,lv:u1Lv(level,g.accepts.length),fs:'u1:t'+level+':a'+g.accepts.length});
      }
    }
  }else if(c.type==='discard'){
    const r=(diff&&diff.lvRange)||[2,9];
    for(let i=0;i<n;i++){
      const target=r[0]+Math.floor(Math.random()*(r[1]-r[0]+1));
      const g=genNanikiruAt(target);            // ±1Lv妥協・フォールバックは既存実装のまま
      if(g) qs.push(g);
    }
  }else if(c.id==='riichi'){
    const r=(diff&&diff.lvRange)||[2,5];
    let pool=c.questions.filter(q=>q.lv>=r[0]&&q.lv<=r[1]);
    if(pool.length<n) pool=c.questions;         // 帯のプールがn問未満なら全プールから(承認済み13問のみ)
    return shuffle(pool.slice()).slice(0,n);
  }else{
    return shuffle(c.questions.slice()).slice(0,n);  // 静的プール(rules/yaku/score)
  }
  return qs;
}
function startThemeLesson(tid,idx){
  const t=themeOf(tid); if(!t) return;
  const list=themeLessons(t);
  if(idx<0||idx>=list.length) return;
  if(idx>themeFrontier(t)){                     // 順次アンロック: 未解放マスは開始しない
    openModal('<h3>🔒 まだロック中</h3><p>前のレッスンをクリアすると解放されるよ。</p>'
      +'<button class="btn gray" onclick="closeModal()">とじる</button>');
    return;
  }
  if(!staminaFree()&&S.hearts<=0){ staminaModal(); return; }
  const c=COURSES.find(x=>x.id===t.course);
  const qs=buildThemeQuestions(c,list[idx].diff,list[idx].qn);
  if(!qs.length) return;
  // ロード＝学ぶ場所: レーティングは動かさない（トレーニングのみ変動）
  // baseN=基本問題数(EXP/正解率/PERFECTの基準)。review=レッスン内復習キュー(ロードのレッスン専用。
  // トレーニングはタイム比較、Compareは条件比較が目的のため復習は入れない)
  L={course:c,themeId:tid,lessonIndex:idx,qs,idx:0,correct:0,sel:null,checked:false,done:false,
     rcat:null,ratingStart:null,startedAt:Date.now(),combo:0,maxCombo:0,
     baseN:qs.length,baseAnswered:0,seq:0,review:[]};
  document.getElementById('lesson').classList.add('show');
  renderQ();
}
/* 復習キューから次に出す1問を選ぶ。出せる問題がなければnull。
   strict(基本問題が残っている間): 間隔REVIEW_GAP以上空いたものだけ差し込む。
   relaxed(基本問題を出し切った回収フェーズ): 最も間隔が空いたものから出す
   (最終問題でミスした場合など間隔を満たせないときも、レッスン終了保証を優先して出す)。
   出題する問題は元Questionの浅いコピー(_rv付き)で、選択/開示などのUI状態は一切持たない */
function pickReview(relaxed){
  if(!L||!L.review) return null;
  const cand=L.review.map((e,k)=>({e,k})).filter(x=>!x.e.resolved&&!x.e.needsReview&&!x.e.inFlight);
  if(!cand.length) return null;
  const gap=x=>L.seq-x.e.lastMissSeq;
  let pick=cand.filter(x=>gap(x)>=REVIEW_GAP).sort((a,b)=>a.e.lastMissSeq-b.e.lastMissSeq)[0]||null;
  if(!pick&&relaxed) pick=cand.sort((a,b)=>gap(b)-gap(a))[0];
  if(!pick) return null;
  pick.e.attempts++; pick.e.inFlight=true;
  return Object.assign({},pick.e.q,{_rv:{k:pick.k,attempt:pick.e.attempts}});
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function quitLesson(){
  document.getElementById('lesson').classList.remove('show');
  L=null; renderHUD(); renderPath();
  ROAD_FX=null;  // ✕離脱時は復帰演出を持ち越さない
}

/* ============================================================
   v3 P2-B: 責務分離
   1) QFORMATS  … questionType別レンダラー（render/回答取り出し/正解開示/文言）
   2) SCORERS   … 純粋関数 (Question, UserAnswer) → ScoreResult
   3) applyOutcome … 進行・報酬処理（answered/correct・ハート・レーティング・ログ・保存）
   4) renderFeedback … フィードバック描画（マーク・変動・デバッグ・スタミナ切れ）
   挙動はP2-A時点の完全再現（ゴールデンテストで固定）。
   ============================================================ */
function qFormatKey(q){
  if(q.sr) return 'riichi';  // P5: 承認済みリーチ判断問題（レーティング対象の2択）
  if(q.u1) return 'ukeire1'; // P5: 1シャンテン受け入れ当て（待ち当てと同UI）
  // 第一情報源: v3 questionType（P1注釈または問題データ自身）
  const qt=(q.v3&&q.v3.questionType)||q.questionType||null;
  if(qt==='discard') return 'discard';
  if(qt==='tile_select') return q.wtype?'waits':'tchoices';
  if(qt==='action'||qt==='multiple_choice') return 'mcq';
  // fallback: 旧フィールドから推定（生成問題・未注釈問題）
  if(q.wtype) return 'waits';
  if(q.gen) return 'discard';
  if(L&&L.course&&L.course.type==='discard') return 'discard';
  if(q.tchoices) return 'tchoices';
  return 'mcq';
}

function goalLabel(level){
  if(level===4) return '1面子＋雀頭（3枚組1つ＋同じ牌2枚）';
  if(level===13) return '4面子＋雀頭（アガリの形）';
  return ((level-1)/3)+'面子＋雀頭';
}

/* ---- scorer: 副作用なしの純粋関数 (Question, UserAnswer) → ScoreResult ---- */
const SCORERS={
  binary:(q,ans)=>{
    const ok=ans.index===q.a;
    return {S:ok?1:0, isCorrect:ok, isPerfect:ok, details:null};
  },
  waits:(q,ans)=>{
    const S=qualityWaits(ans.set,q.waits);
    return {S, isCorrect:S>=1, isPerfect:S>=1, details:{waitCount:q.waits.length}};
  },
  ukeire1:(q,ans)=>{
    const St=qualityWaits(ans.set,q.accepts); // 牌採点は待ち当てと同一: max(0,(当てた数-誤選択数)/正解数)
    const miss=q.accepts.filter(a=>!ans.set.has(a));
    const extra=[...ans.set].filter(x=>!q.accepts.includes(x));
    if(q.full){
      // 本番形: 形の判定30% + 受け入れ70%。両方完答で◎
      const patOK=ans.pat===q.pattern;
      const S=0.3*(patOK?1:0)+0.7*St;
      return {S, isCorrect:S>=0.999, isPerfect:S>=0.999,
        details:{acceptCount:q.accepts.length, patOK, tileS:St, miss, extra}};
    }
    return {S:St, isCorrect:St>=1, isPerfect:St>=1,
      details:{acceptCount:q.accepts.length, miss, extra}};
  },
  ukeire:(q,ans)=>{
    const S=qualityNanikiru(q,ans.tile);
    return {S, isCorrect:ans.tile===q.a, isPerfect:S>=1, details:{chosen:ans.tile}};
  },
};

/* ================= レッスンシェル ================= */
function renderQ(){
  if(L.course.training&&!L.qs[L.idx]){
    const lv=pickTargetLv(L.rcat);
    L.qs[L.idx]=L.rcat==='waits'?genWaitsAt(lv):genNanikiruAt(lv);
  }
  const q=L.qs[L.idx];
  L.sel=null; L.checked=false;
  // 進捗バー: 復習ありレッスンは「基本問題の消化率」(復習問題ではバーを進めない。
  // 基本10問終了後の復習回収フェーズは満タンのまま、下の復習チップで残数を示す)
  const frac=L.review?Math.min(1,L.baseAnswered/(L.baseN||1)):(L.idx/L.qs.length);
  document.getElementById('pbar-fill').style.width=(frac*100)+'%';
  document.getElementById('lesson-hearts').textContent='❤️'+(staminaFree()?'∞':S.hearts);
  const area=document.getElementById('q-area');
  let pre='';
  // 復習問題の表示: 責めずに「もう一度」のポジティブな一言だけ(第7段階追加改善)
  if(q._rv&&L.review){
    const rest=L.review.filter(e=>!e.resolved&&!e.needsReview).length;
    pre+='<div class="rv-chip">🔁 もう一度チャレンジ！'+(rest>1?'（復習 あと'+rest+'問）':'')+'</div>';
  }
  if(q.compareId){
    pre+='<div class="q-type">くらべる問題 '+q.compareStep+'</div>';
    if(q.showCompareBanner) pre+=compareBannerHTML(q);
  }
  area.innerHTML=pre+QFORMATS[qFormatKey(q)].render(q);
  area.scrollTop=0;
  L.qStart=Date.now();
  renderFoot();
}
function selChoice(i){
  if(L.checked) return;
  L.sel=i;
  const q=L.qs[L.idx];
  const n=(q.tchoices||q.choices).length;
  for(let k=0;k<n;k++){ const el=document.getElementById('ch-'+k); if(el) el.classList.toggle('sel',k===i); }
  renderFoot();
}
function selTile(i){
  if(L.checked) return;
  const tiles=sortTiles(parseHand(L.qs[L.idx].hand));
  L.sel=i;
  tiles.forEach((t,k)=>{ const el=document.getElementById('ht-'+k); if(el) el.classList.toggle('sel',k===i); });
  renderFoot();
}
function toggleNum(n){
  if(L.checked) return;
  const eln=document.getElementById('np-'+n);
  if(eln&&eln.disabled) return;  // 4枚使用済み牌は選択不可
  if(L.sel.has(n)) L.sel.delete(n); else L.sel.add(n);
  document.getElementById('np-'+n).classList.toggle('sel',L.sel.has(n));
  renderFoot();
}
function toggle34(cd){
  if(L.checked) return;
  const elc=document.getElementById('np34-'+cd);
  if(elc&&elc.disabled) return;  // 4枚使用済み牌は選択不可
  if(L.sel.has(cd)) L.sel.delete(cd); else L.sel.add(cd);
  document.getElementById('np34-'+cd).classList.toggle('sel',L.sel.has(cd));
  renderFoot();
}
// なぞり選択: 押したまま滑らせると通過した牌を連続で選択/解除できる。
// 最初に触れた牌の状態で「選択モード/解除モード」を決め、ドラッグ中は同じ操作を適用する。
function pickDrag(ev,kind){
  if(!L||L.checked) return;
  const inPicker=b=>b&&b.id&&b.id.indexOf(kind+'-')===0&&!b.disabled;
  const start=ev.target.closest?ev.target.closest('button.tile'):null;
  if(!inPicker(start)) return;
  ev.preventDefault();
  const keyOf=b=>{const k=b.id.slice(kind.length+1); return kind==='np'?parseInt(k,10):k;};
  const mode=!L.sel.has(keyOf(start));
  const visited=new Set();
  const apply=b=>{
    if(visited.has(b.id)) return;
    visited.add(b.id);
    const key=keyOf(b), has=L.sel.has(key);
    if(mode&&!has){ L.sel.add(key); b.classList.add('sel'); }
    else if(!mode&&has){ L.sel.delete(key); b.classList.remove('sel'); }
    renderFoot();
  };
  apply(start);
  const move=e=>{
    if(!L||L.checked) return;
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const b=t&&t.closest?t.closest('button.tile'):null;
    if(inPicker(b)) apply(b);
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}
function selPat(i){
  if(L.checked) return;
  L.patSel=i;
  for(let k=1;k<=4;k++){ const el=document.getElementById('pat-'+k); if(el) el.classList.toggle('sel',k===i); }
  renderFoot();
}
function renderFoot(){
  const foot=document.getElementById('lesson-foot');
  foot.className='lesson-foot';
  const qNow=L.qs[L.idx];
  const patReady=!(qNow&&qNow.full)||L.patSel!=null;
  const ready=L.sel!==null&&(!(L.sel instanceof Set)||L.sel.size>0)&&patReady;
  foot.innerHTML='<button class="btn" id="answer-btn" '+(ready?'':'disabled')+' onclick="answerNow(this)">こたえあわせ</button>';
}
// こたえあわせ: 押した瞬間に押下状態+disabledで反応を見せ、描画後に判定する(二重タップ防止)。
// 判定はローカルで即時完了するため人工的な待ち時間は入れない。
function answerNow(btn){
  if(!L||L.checked) return;
  btn.disabled=true;
  btn.classList.add('pressing');
  btn.textContent='判定中…';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(L&&!L.checked) check(); }));
}

/* ================= Compareフロー（P4-A） =================
   Compareは出題フロー: variantは通常のQuestionで、既存QFORMATS/SCORERSをそのまま使う。
   ロードのレッスンとして実行するため、既存原則（road=学ぶ場所）によりレーティング・能力測定ログは対象外。 */
function buildVariantQuestion(group,variant,index){
  const q=applyPatch(group.baseQuestion, variant.patch);   // baseはdeep copyされ不変
  q.a=variant.a;
  q.exp=variant.exp||'';
  q.lv=variant.lv!=null?variant.lv:3;
  q.compareId=group.id;
  q.variantId=variant.id;
  q.changedCategories=changedCategoriesOf(variant.patch);
  q.compareStep=(index+1)+'/'+group.variants.length;
  q.showCompareBanner=index>0&&variant.patch.length>0;
  return q;
}
function compareBannerHTML(q){
  return '<div class="cmp-banner">🔁 <b>さっきと同じ手牌です</b>'
    +'<span class="cmp-badges">変わった条件：'
    +q.changedCategories.map(c=>'<span class="cmp-badge">'+c+'</span>').join('')
    +'</span></div>';
}
function startCompare(groupId){
  const g=COMPARE_FIXTURES[groupId];
  if(!g) return;
  if(!staminaFree()&&S.hearts<=0){ staminaModal(); return; }
  const qs=g.variants.map((v,i)=>buildVariantQuestion(g,v,i));
  L={course:{id:'cmp-'+g.id,title:'くらべる問題',compare:g,training:false},
     qs,idx:0,correct:0,sel:null,checked:false,done:false,
     rcat:null,ratingStart:null,bigMiss:0,contrastShown:false,startedAt:Date.now(),combo:0,maxCombo:0};
  document.getElementById('lesson').classList.add('show');
  renderQ();
}
function showContrast(){
  L.contrastShown=true;
  const g=L.course.compare;
  document.getElementById('pbar-fill').style.width='100%';
  const cats=changedCategoriesOf(g.variants.reduce((a,v)=>a.concat(v.patch||[]),[]));
  const area=document.getElementById('q-area');
  area.innerHTML='<div class="q-type">くらべる問題</div>'
    +'<div class="q-text">なぜ判断が変わった？</div>'
    +'<div class="cmp-banner"><span class="cmp-badges">変わった条件：'
    +cats.map(c=>'<span class="cmp-badge">'+c+'</span>').join('')+'</span></div>'
    +'<div class="card" style="margin:12px 0;"><p class="fb-exp" style="margin:0;">'+g.contrastExp+'</p></div>';
  area.scrollTop=0;
  const foot=document.getElementById('lesson-foot');
  foot.className='lesson-foot';
  foot.innerHTML='<button class="btn" onclick="finishLesson()">完了</button>';
}
function logCompare(entry){
  try{
    const k='jantore-comparelog-v1';
    const arr=JSON.parse(localStorage.getItem(k)||'[]');
    arr.push(entry);
    if(arr.length>1000) arr.splice(0,arr.length-1000);
    localStorage.setItem(k,JSON.stringify(arr));
  }catch(e){}
}

/* ================= 進行・報酬処理 ================= */
function applyOutcome(q,cat,qid,res,elapsed){
  L.checked=true;
  // コンボ: 正解で+1、不正解で即0(責めない・小表示のみ)。演出専用のカウンタであり、
  // レーティング計算にもEXP計算式にも一切影響させない(第6段階指示)。maxComboは将来ミッション用に保持。
  L.prevCombo=L.combo||0;
  if(res.isCorrect){ L.combo=(L.combo||0)+1; if(L.combo>(L.maxCombo||0)) L.maxCombo=L.combo; }
  else L.combo=0;
  // デイリーミッション: 5COMBO到達(学習ロードのみ・復習中の到達もOK・二重達成はbump側で防止)
  if(L.themeId!=null&&L.combo>=5) bumpMission('dm_combo',1);
  if(cat) L.bigMiss = res.S<0.5 ? (L.bigMiss||0)+1 : 0;
  // L.correctは「基本問題の初回回答」だけを数える(EXP/正解率/PERFECTの基準)。
  // 復習(_rv付き)の正解はEXP・正解率へ加算しない(復習はEXP稼ぎでなく学習機会)
  S.answered++; if(res.isCorrect){S.correct++; if(!q._rv) L.correct++;}
  // レッスン内復習キュー管理(ロードのレッスンのみ。L.reviewはstartThemeLessonでのみ初期化)
  if(L.review){
    L.seq++;
    if(!q._rv) L.baseAnswered++;
    if(q._rv){
      const e=L.review[q._rv.k];
      if(e){
        e.inFlight=false;
        if(res.isCorrect){ e.resolved=true; }               // 復習クリア
        else if(e.attempts>=REVIEW_MAX){ e.needsReview=true; } // 上限到達: 未解決のまま記録に残す
        else { e.lastMissSeq=L.seq; }                        // 間隔を空けてキューの後ろへ
      }
    }else if(!res.isCorrect){
      L.review.push({q,no:L.seq,attempts:0,resolved:false,needsReview:false,
        lastMissSeq:L.seq,inFlight:false});
    }
  }
  if(!res.isCorrect&&!staminaFree()){ S.hearts=Math.max(0,S.hearts-1); }
  // レーティング更新＋回答ログ（トレーニングのみ。ロードは学ぶ場所なので変動なし。XPには影響しない）
  let ratingRes=null;
  if(cat&&L.course.training){
    const isReview=(cat==='nanikiru'&&q.curated)?!!S.seenNk[qid]
      :(cat==='riichi')?!!S.seenRq[qid]:false;
    ratingRes=ratingUpdate(cat,q.lv,res.S,isReview);
    if(cat==='nanikiru'&&q.curated) S.seenNk[qid]=true;
    if(cat==='riichi') S.seenRq[qid]=true;
    const vm=v3MetaOf(q);
    logAnswer({
      category:cat,
      questionId:qid,
      questionType:vm?vm.questionType:null,
      primarySkill:vm?vm.primarySkill:null,
      learningDepth:vm?vm.learningDepth:null,
      seed:(q.seed!==undefined?q.seed:null),
      featureSignature:q.fs||null,
      questionLv:q.lv,
      difficulty:q.lv*10+5,
      ratingBefore:ratingRes.R0,
      ratingAfter:ratingRes.R1,
      S:res.S,
      isReview,
      elapsedTime:elapsed,
      answeredAt:new Date().toISOString()
    });
  }
  save();
  return ratingRes;
}

/* ================= フィードバック描画 ================= */
function renderFeedback(q,cat,res,ratingRes,fb){
  document.getElementById('lesson-hearts').textContent='❤️'+(staminaFree()?'∞':S.hearts);
  let ratingLine='';
  if(ratingRes){
    const up=ratingRes.R1>=ratingRes.R0;
    ratingLine='<p class="fb-rate '+(up?'up':'down')+'">'+CAT_LABEL[cat]+' '
      +Math.floor(ratingRes.R0)+' → '+Math.floor(ratingRes.R1)+(up?' ▲':' ▼')+'</p>';
  }
  let dbgLine='';
  if(S.dev&&cat){
    const dd=q.lv*10+5;
    dbgLine='<p class="dbg">DEV Lv'+q.lv+' d'+dd
      +(q.dbg?(' sh'+q.dbg.sh+' 受'+q.dbg.ub+'/次'+q.dbg.us+' 候補'+q.dbg.cand):'')
      +(q.wtype?(' 待ち'+q.waits.length+'種'):'')
      +' S='+(res.S!=null?res.S.toFixed(2):'-')
      +(ratingRes?(' R '+ratingRes.R0.toFixed(2)+'→'+ratingRes.R1.toFixed(2)+' K'+ratingRes.K):' (ロード:変動なし)')
      +' seed:'+(q.seed!=null?q.seed:'-')+'</p>';
  }
  const foot=document.getElementById('lesson-foot');
  const mark=cat?qualityMark(res.S,cat):null;
  const cls=mark?mark.cls:(res.isCorrect?'ok':'ng');
  const title=mark?mark.label:(res.isCorrect?'せいかい！ 🎉':'ざんねん…');
  // 実機レビュー第1回: 結果・解説は問題の直下にカードで連続表示し、
  // 下部固定フットにはボタンだけを残す(問題とフィードバックの間の巨大空白を解消)
  const staminaOut=!staminaFree()&&S.hearts<=0&&!res.isCorrect;
  // コンボ表示(第7段階): 「正解！」と同じ行の右側に配置して常に目に入るように。
  // 節目(COMBO_MILESTONES)は加えて中央オーバーレイの専用演出(下)。
  // 不正解時は責めずに「コンボ終了」を小さく出すのみ(2連続以上続いていた場合のみ)。
  let comboChip='', comboEnd='';
  const milestone=!staminaOut&&res.isCorrect&&COMBO_MILESTONES[L.combo]!=null;
  if(!staminaOut){
    if(res.isCorrect&&(L.combo||0)>=2){
      comboChip='<span class="fb-combo'+(milestone?' big':'')+'">🔥 '+L.combo+' COMBO</span>';
    }else if(!res.isCorrect&&(L.prevCombo||0)>=2){
      comboEnd='<div class="combo-end">コンボ終了（'+L.prevCombo+'まで続いた）</div>';
    }
  }
  // 復習クリア: さっき間違えた問題を取り返せたことを小さく示す(コンボ節目より弱い表示のみ)
  const rvClear=(!staminaOut&&q._rv&&res.isCorrect)?'<div class="rv-clear">🔁 復習クリア ✓</div>':'';
  const card='<div class="fb-card '+(staminaOut?'ng':cls)+'" id="fb-card">'
    +'<div class="fb-head"><p class="fb-title '+(staminaOut?'ng':cls)+'">'
    +(staminaOut?'スタミナが切れた…':title)+'</p>'+comboChip+'</div>'
    +rvClear+comboEnd+ratingLine+dbgLine
    +(!staminaOut&&fb.ansText?'<p class="fb-exp"><b>'+fb.ansText+'</b></p>':'')
    +'<p class="fb-exp">'+fb.expText+'</p>'
    +'</div>';
  const area=document.getElementById('q-area');
  area.insertAdjacentHTML('beforeend',card);
  foot.className='lesson-foot '+cls;
  foot.innerHTML=staminaOut
    ?'<button class="btn red" onclick="quitLesson();staminaModal()">レッスン終了</button>'
    :'<button class="btn'+(cls==='ng'?' red':'')+'" onclick="next()">つづける</button>';
  // 解説へ自動スクロール: 画面に収まる解説はカード全体をボタンの上に収め、
  // 1画面より長い解説はカード先頭から自然に読み始められる位置へ(下へスクロールで続き)
  requestAnimationFrame(()=>{
    const fc2=document.getElementById('fb-card');
    if(!fc2) return;
    const visible=area.clientHeight-foot.offsetHeight;
    const cardTop=fc2.getBoundingClientRect().top-area.getBoundingClientRect().top+area.scrollTop;
    const target=fc2.offsetHeight<=visible-16 ? area.scrollHeight : cardTop-8;
    area.scrollTo({top:target, behavior:'smooth'});
  });
  // 節目コンボ専用演出(Level3): 中央に約1秒ポップ。解説は上で既に表示済み・進行も塞がない
  if(milestone){
    playFx('<div class="fx-ico">🔥</div><div class="fx-t">'+L.combo+' COMBO!</div>'
      +'<div class="fx-s">'+COMBO_MILESTONES[L.combo]+'</div>','fx-combo',MOTION.comboMilestone);
  }
}

/* ================= 判定（薄いオーケストレーション） ================= */
function check(){
  if(L.checked) return;  // 二重実行防止(連打対策)
  const q=L.qs[L.idx];
  const elapsed=Date.now()-(L.qStart||Date.now());
  const fmt=QFORMATS[qFormatKey(q)];
  const ans=fmt.answer(q);
  const res=SCORERS[fmt.scoring](q,ans);
  const cat=fmt.cat, qid=cat?fmt.qid(q):null;
  fmt.reveal(q,ans,res);
  const ratingRes=applyOutcome(q,cat,qid,res,elapsed);
  if(q.compareId){
    // Compare学習履歴: 能力測定ログ(jantore-anslog)とは別ストア。Ratingの根拠には使わない。
    logCompare({compareId:q.compareId,variantId:q.variantId,changedCategories:q.changedCategories,
      S:res.S,isCorrect:res.isCorrect,answeredAt:new Date().toISOString()});
  }
  renderFeedback(q,cat,res,ratingRes,fmt.feedback(q,res));
}
function next(){
  // 二重実行防止(第7段階): 未回答時・終了処理後の「つづける」連打では進まない
  // (renderQがL.checked=falseへ戻すため、連打の2回目以降はここで止まる)
  if(!L||L.done||!L.checked) return;
  L.idx++;
  if(L.course.compare&&L.idx>=L.qs.length&&!L.contrastShown){ showContrast(); return; }
  // レッスン内復習の差し込み: 間隔を満たした復習問題を次の1問として出す。
  // 基本問題を出し切った後は、残った復習を回収し切るまでレッスンを終了しない
  // (基本問題数の消化だけでは終了しない。needsReviewだけが残った時点で終了可能)
  if(L.review){
    const nq=pickReview(L.idx>=L.qs.length);
    if(nq){ L.qs.splice(L.idx,0,nq); renderQ(); return; }
  }
  if(L.idx>=L.qs.length){ finishLesson(); } else { renderQ(); }
}

/* ================= レッスン終了 ================= */
// 直近クリアしたマス/解放されたマスの演出用メモ(ロード復帰時に一度だけ使用・保存しない)
let ROAD_FX=null;
function finishLesson(){
  /* 状態確定フェーズ: 報酬(EXP/gems)・王冠・roadProgress・streak・自己ベストを
     ここで一度だけ確定する。演出(タイマー/CSS animation)には一切依存させず、
     L.doneガードで「つづける」連打等による二重発火・二重付与を防ぐ(第7段階) */
  if(L.done) return;
  L.done=true;
  document.getElementById('pbar-fill').style.width='100%';
  const foot0=document.getElementById('lesson-foot');
  foot0.className='lesson-foot'; foot0.innerHTML='';   // クリア演出中の誤タップ防止
  // L.correct=基本問題の初回正解数(復習正解は含まない)。復習で問題数が増えても
  // 最大EXPは従来どおり(10問なら40)。パーフェクトも基本問題の初回全正解のみ
  const baseN=L.baseN||L.qs.length;
  const xp=10+L.correct*3;
  const gems=5+(L.correct===baseN?10:0);
  S.xp+=xp; S.gems+=gems;
  const cid=L.course.id;
  if(!L.course.training) S.crowns[cid]=Math.min(5,(S.crowns[cid]||0)+1);
  // 学習ロード(テーマ制): 現在フロンティアのマスをクリアしたら次のマスを解放。
  // クリア済みマスの再挑戦(lessonIndex<フロンティア)では進捗は動かさない。
  // フロンティア前進時=初回クリア時のみ、小テーマ制覇/大テーマ制覇イベントを検出。
  const roadEvents=[];
  if(L.themeId!=null){
    const t=themeOf(L.themeId);
    const list=themeLessons(t);
    const cur=S.roadProgress[t.id]||0;
    if(L.lessonIndex===cur&&cur<list.length){
      S.roadProgress[t.id]=cur+1;
      ROAD_FX={theme:t.id,cleared:cur,unlocked:(cur+1<list.length)?cur+1:null};
      if(list[cur].isLast) roadEvents.push({type:'subtheme',title:list[cur].sub.title});
      if(cur+1===list.length) roadEvents.push({type:'theme',title:t.title});
    }
  }
  // レッスン単位のクリア時間(開始→終了。バックグラウンド時間の除外は将来ネイティブ化時に精密化)
  const duration=Date.now()-(L.startedAt||Date.now());
  // streak: 「この完了でその日の学習を初達成したか」を更新前に判定(当日初回のみ祝う)
  const today=todayStr();
  const firstToday=!(S.lastDay===today&&S.streak>0);
  if(S.lastDay!==today){
    if(S.lastDay){
      const gap=Math.round((new Date(today)-new Date(S.lastDay))/86400000);
      if(gap===1){ S.streak++; }
      else if(gap>1&&S.freeze>0){ S.freeze--; S.streak++; }
      else if(gap>1){ S.streak=1; }
    }else{ S.streak=1; }
    S.lastDay=today;
  }else if(S.streak===0){ S.streak=1; }
  if(S.streak>(S.bestStreak||0)) S.bestStreak=S.streak;  // 最長連続記録
  // 日別学習履歴(カレンダー用)。将来'protected'(連続記録ブロック)と区別するため状態文字列で保存
  if(S.learningDays[today]!=='protected') S.learningDays[today]='completed';
  // デイリーミッション進行(第8段階): 学習ロードのレッスンのみ対象(トレーニング/Compareは対象外)。
  // EXPミッションは実際に付与された学習EXP(復習水増しなし・宝箱ボーナス対象外)。
  // ストリークとは独立: ミッション未達成でもストリークは上の既存処理どおり継続する
  if(L.themeId!=null){
    bumpMission('dm_lesson',1);
    bumpMission('dm_xp',xp);
  }
  // トレーニング自己ベスト(完走時のみ・種別ごとに分離。将来waits_4等の粒度キーも同じ器で持てる)
  let bestInfo=null;
  if(L.course.training&&L.rcat){
    const key=L.rcat;
    const prev=S.trainingBest[key];
    const isBest=!prev||duration<prev.ms;
    if(isBest) S.trainingBest[key]={ms:duration,at:today};
    bestInfo={key,isBest,prevMs:prev?prev.ms:null,ms:duration};
  }
  // レッスン内復習の結果を専用ストアへ記録(既存の回答ログjantore-anslog-v1には手を付けない。
  // ロードのレッスンは元々レーティング対象外でanslogへ書いていないため、復習の二重記録も発生しない。
  // needsReviewを含むこの記録は将来の「あとで復習」「弱点トレーニング」「AI Coach」の入力になる)
  if(L.review&&L.review.length){
    try{
      const k='jantore-reviewlog-v1';
      const arr=JSON.parse(localStorage.getItem(k)||'[]');
      L.review.forEach(e=>{
        let qid=null;
        try{ const f=QFORMATS[qFormatKey(e.q)]; qid=f.qid?f.qid(e.q):null; }catch(_){}
        arr.push({at:new Date().toISOString(),themeId:L.themeId||null,
          lessonIndex:(L.lessonIndex!=null?L.lessonIndex:null),course:L.course.id,
          originalQuestionId:qid,seed:(e.q.seed!=null?e.q.seed:null),fs:e.q.fs||null,
          lv:(e.q.lv!=null?e.q.lv:null),firstMissNo:e.no,isReview:true,
          reviewAttempts:e.attempts,resolved:!!e.resolved,needsReview:!!e.needsReview});
      });
      if(arr.length>500) arr.splice(0,arr.length-500);
      localStorage.setItem(k,JSON.stringify(arr));
    }catch(e){}
  }
  save();
  // ここまでで報酬・進捗はすべて確定済み。以降は演出のみ:
  // 通常は直接リザルト。初回制覇時のみ COMPLETE または MASTER を1回だけ挟む
  playClearSequence(roadEvents,()=>renderResult({xp,duration,firstToday,bestInfo,cid}));
}
/* 達成演出(第7段階追補×2): 上位が下位を包含し、出るのは最大1回。
   優先順位: 大テーマMASTER > 小テーマCOMPLETE > (なし=直接リザルト)。
   通常Lesson・トレーニング・制覇済み再挑戦は中間演出も待ち時間もなく直接リザルトへ
   (達成の表示はリザルトページ自体が担うため「LESSON CLEAR!」中間演出は廃止)。
   reduced-motion時はplayFx側でスキップされ、進行はタイマーのみで保証される */
function playClearSequence(events,then){
  const ev=(events||[]).find(e=>e.type==='theme')||(events||[]).find(e=>e.type==='subtheme')||null;
  if(!ev){ if(then)then(); return; }
  const s=ev.type==='subtheme'
    ?{cls:'fx-sub',dur:MOTION.subthemeClear,
      html:'<div class="fx-ico">🏅</div><div class="fx-t">'+ev.title+' COMPLETE!</div><div class="fx-s">小テーマ制覇！</div>'}
    :{cls:'fx-theme',dur:MOTION.themeClear,
      html:'<div class="fx-ico">👑</div><div class="fx-t">'+ev.title+' MASTER!</div><div class="fx-s">テーマ制覇！</div>'};
  playFx(s.html,s.cls,s.dur,then);
}
function renderResult(ctx){
  if(!L) return;                                // 演出中に✕で離脱した場合は描画しない(状態は確定済み)
  const {xp,duration,firstToday,bestInfo,cid}=ctx;
  const area=document.getElementById('q-area');
  // 正解率・PERFECTは基本問題の初回回答のみで判定(復習で取り返しても書き換えない=従来と比較可能)
  const baseN=L.baseN||L.qs.length;
  const perfect=L.correct===baseN;
  const accuracy=Math.round(L.correct/baseN*100);
  const rv=(L.review&&L.review.length)?{n:L.review.length,ok:L.review.filter(e=>e.resolved).length}:null;
  let ratingSummary='';
  if(L.rcat){
    const r0=Math.floor(L.ratingStart), r1=Math.floor(S.ratings[L.rcat]);
    const up=S.ratings[L.rcat]>=L.ratingStart;
    ratingSummary='<div class="rating-strip" style="margin:8px 0 0;"><span class="lab">📈 '+CAT_LABEL[L.rcat]+'</span>'
      +'<b style="color:var(--'+(up?'jade-deep':'verm')+')">'+r0+' → '+r1+(up?' ▲':' ▼')+'</b></div>';
  }
  // リザルトの順次表示(第7段階): 見出し→EXP→正解率→…を短い間隔で(全体約1秒・reduced時は即時表示)
  let SI=2;                                      // 0=絵文字, 1=見出し, 以降は登場順
  const stagStyle=i=>' style="animation-delay:'+(i*MOTION.resultStagger)+'ms"';
  // 当日初回の学習達成のみ、連続記録を大きく祝う(同日2回目以降は通常リザルト)
  const streakCelebrate=firstToday
    ?'<div class="streak-celebrate stag"'+stagStyle(SI++)+'><div class="sc-flame">🔥</div>'
      +'<div class="sc-num">'+S.streak+'</div><div class="sc-label">日連続！</div>'
      +'<p class="sc-sub">今日の学習を達成しました</p></div>'
    :'';
  const statBox=(v,k,extra)=>'<div class="res-box stag'+(extra||'')+'"'+stagStyle(SI++)+'>'
    +'<div class="v">'+v+'</div><div class="k">'+k+'</div></div>';
  const noteStyle='color:var(--ink-soft);font-size:12px;margin:2px 0 0;';
  let stats;
  if(L.course.training&&bestInfo){
    // トレーニング: 正解率・今回タイム・自己ベスト・ランクが中心(ランク基準は設定データ・未設定種別は非表示)
    const rank=rankForTime(bestInfo.key,duration);
    stats='<div class="res-grid">'
      +statBox(accuracy+'%','正解率')
      +statBox(fmtDur(duration,true),'今回タイム')
      +statBox(bestInfo.isBest?fmtDur(duration,true):fmtDur(bestInfo.prevMs,true),'BEST')
      +(rank?statBox(rank,'ランク'):'')
      +'</div>'
      +(bestInfo.isBest?'<div class="best-badge stag"'+stagStyle(SI++)+'>🏅 自己ベスト！</div>':'')
      +'<div class="stag"'+stagStyle(SI++)+'><span class="xp-chip" style="font-size:12px;padding:6px 12px;">+'+xp+' EXP</span></div>'
      +ratingSummary;
  }else{
    // 通常ロード: EXP(獲得ポップ付き)・正解率・最大コンボ・クリア時間(flex-wrapで自然折返し)
    stats='<div class="res-grid">'
      +statBox('+'+xp,'EXP',' exp-pop')
      +statBox(accuracy+'%','正解率')
      +statBox('🔥'+(L.maxCombo||0),'最大コンボ')
      +statBox(fmtDur(duration),'クリアタイム')
      +(rv?statBox(rv.ok+'/'+rv.n+(rv.ok===rv.n?' ✓':''),'復習クリア'):'')
      +'</div>'
      +(rv&&rv.ok===rv.n?'<div class="best-badge stag"'+stagStyle(SI++)+'>🔁 復習コンプリート！ぜんぶ取り返した！</div>':'')
      +(L.themeId
        ?'<p class="stag" style="'+noteStyle+'animation-delay:'+(SI++)*MOTION.resultStagger+'ms">📍 '
          +themeOf(L.themeId).title+'：'+(S.roadProgress[L.themeId]||0)+'/'+themeLessons(themeOf(L.themeId)).length+' レッスン</p>'
        :'<p class="stag" style="'+noteStyle+'animation-delay:'+(SI++)*MOTION.resultStagger+'ms">👑 '
          +L.course.title+'：'+(S.crowns[cid]||0)+'/5</p>');
  }
  area.innerHTML='<div class="center-col" style="gap:12px;">'
    +'<div class="big-emoji stag"'+stagStyle(0)+'>'+(perfect?'🏆':'🐦')+'</div>'
    +'<h2 class="stag" style="margin:0;animation-delay:'+MOTION.resultStagger+'ms">'
    +(L.course.training?'トレーニング完了！':(perfect?'パーフェクト！':'レッスンクリア！'))+'</h2>'
    +streakCelebrate
    +stats
    +'</div>';
  area.scrollTop=0;
  const foot=document.getElementById('lesson-foot');
  foot.className='lesson-foot';
  foot.innerHTML='<button class="btn" onclick="afterLesson()">つづける</button>';
  // DAILY COMPLETE(第8段階): 3ミッション全達成のその日1回だけ、解説を邪魔しない
  // リザルト表示のタイミングで再生(COMPLETE/MASTER演出の後に順番に流れる。操作は塞がない)
  if(DAILY_FX_PENDING){
    DAILY_FX_PENDING=false;
    playFx('<div class="fx-ico">🎯</div><div class="fx-t">DAILY COMPLETE!</div>'
      +'<div class="fx-s">今日のミッション達成！　🔥 '+S.streak+'日連続</div>'
      +'<div class="fx-s2">また明日！</div>','fx-daily',MOTION.dailyComplete);
  }
}
function afterLesson(){
  document.getElementById('lesson').classList.remove('show');
  L=null; renderHUD(); renderPath();
  // ロード復帰演出(第7段階): クリアしたマス(✓ポップ)と解放された次マス(ロック解除グロー)が
  // 見える位置へスクロール。演出情報は一度使ったら破棄(再描画では再生しない)
  if(ROAD_FX){

  if(!PROTOTYPE_MODE&&!S.owned.adfree) showAd();  // プロトタイプでは広告モックを出さない
}

let CAL_OFFSET=0;  // 表示中の月(0=今月, -1=先月, ...)
function showStreakDetail(off){
  CAL_OFFSET=(off===undefined)?0:CAL_OFFSET+off;
  const now=new Date();
  const base=new Date(now.getFullYear(), now.getMonth()+CAL_OFFSET, 1);
  const y=base.getFullYear(), m=base.getMonth();
  const todayKey=todayStr();
  const dayKey=d=>[y,String(m+1).padStart(2,'0'),String(d).padStart(2,'0')].join('-');
  const daysInMonth=new Date(y,m+1,0).getDate();
  const firstDow=new Date(y,m,1).getDay();
  let grid='<div class="cal">'+'日月火水木金土'.split('').map(d=>'<span class="dow">'+d+'</span>').join('');
  for(let i=0;i<firstDow;i++) grid+='<span></span>';
  for(let d=1;d<=daysInMonth;d++){
    const st=S.learningDays[dayKey(d)];  // 'completed' | 'protected'(将来の連続記録ブロック) | undefined
    const cls=(st==='completed'?' done':st==='protected'?' protected':'')
      +(dayKey(d)===todayKey?' today':'');
    grid+='<span class="cal-day'+cls+'">'+d+'</span>';
  }
  grid+='</div>';
  openModal('<h3 style="margin-top:0;">🔥 '+S.streak+'日連続</h3>'
    +'<p style="margin:0 0 4px;color:var(--ink-soft);font-weight:700;font-size:13px;">最長 '+(S.bestStreak||0)+'日</p>'
    +'<div class="cal-head">'
    +'<button onclick="showStreakDetail(-1)">‹</button>'
    +'<b>'+y+'年'+(m+1)+'月</b>'
    +'<button onclick="showStreakDetail(1)">›</button></div>'
    +grid
    +'<div class="cal-legend">'
    +'<span><i style="background:var(--jade)"></i>学習した日</span>'
    +'<span><i style="background:var(--gold)"></i>記録ブロック(予定)</span>'
    +'<span><i style="border:2px solid var(--jade-deep)"></i>今日</span>'
    +'</div>');
}
