<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ルビ位置プローブ</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;}
html,body{margin:0;}
img{max-width:100%;}
[hidden]{display:none!important;}
</style>
</head>
<body>
<style>
:root{
  --ink:#1d2b27; --ink-soft:#5d726b; --line:#d3e0da; --card:#ffffff;
  --ground:#f2f6f3; --jade:#1f8a5f; --jade-soft:#e3f6ec; --jade-deep:#0f6a46;
  --warn:#b2451f; --ok:#1f7a4d; --code:#eef3f0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ink:#e6efea; --ink-soft:#9db0a8; --line:#2e4038; --card:#16201c;
    --ground:#0e1613; --jade:#4fc78f; --jade-soft:#17362a; --jade-deep:#8fe3ba;
    --warn:#f0906a; --ok:#6fd7a4; --code:#16211c;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#e6efea; --ink-soft:#9db0a8; --line:#2e4038; --card:#16201c;
  --ground:#0e1613; --jade:#4fc78f; --jade-soft:#17362a; --jade-deep:#8fe3ba;
  --warn:#f0906a; --ok:#6fd7a4; --code:#16211c;
}
body{
  background:var(--ground); color:var(--ink);
  font-family:'M PLUS Rounded 1c','Noto Sans JP',system-ui,sans-serif;
  padding:0 16px; padding-block:20px 48px; margin:0;
}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:18px;}
h1{font-size:19px; margin:0; letter-spacing:.02em;}
.sub{margin:0; font-size:13px; color:var(--ink-soft); line-height:1.7;}
.panel{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px;}
.panel h2{font-size:13px; margin:0 0 10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
.verdict{display:flex; flex-direction:column; gap:10px;}
.vrow{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;}
.vrow .k{font-size:13px; color:var(--ink-soft); min-width:9.5em;}
.vrow .a{font-size:15px; font-weight:800;}
.yes{color:var(--ok);} .no{color:var(--warn);}
.env{font-size:12px; color:var(--ink-soft); line-height:1.8; word-break:break-all;}

/* ===== 計測サンプル: アプリ(jantore.html)のルビCSSをそのまま再現 ===== */
.stage ruby{ruby-position:over; -webkit-ruby-position:before; ruby-align:center; line-height:1.15;}
.stage rt{font-size:.5em; font-weight:700; line-height:1.05; letter-spacing:-.04em; opacity:.78; white-space:nowrap; text-align:center;}
.bub{background:var(--card); border:2px solid var(--line); border-radius:14px;
     padding:10px 12px; font-size:15px; font-weight:700; line-height:1.95; color:var(--ink);}
.chip{display:inline-block; padding:1px 8px; border-radius:999px;
      background:var(--jade-soft); color:var(--jade-deep); font-weight:900;}

/* --- 検証する手法 --- */
@supports (-webkit-hyphens:none){ .mS rt{position:relative; top:4px;} }   /* 現行アプリと同じ仕組み */
.mR rt{position:relative; top:8px;}        /* @supportsを通さない無条件 relative */
.mM rt{margin-bottom:-4px;}                /* 負マージン */
.mT rt{transform:translateY(4px);}         /* transform */
.mV rt{vertical-align:-4px;}               /* vertical-align */
.mL ruby{line-height:1;}                   /* ruby自身のline-heightを詰める */
.mP{line-height:1.45;}                     /* 親のline-heightを下げる(ハーフレディング仮説) */

.case{display:flex; flex-direction:column; gap:7px;}
.case + .case{margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
.case .lbl{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12px;}
.case .lbl b{font-size:13px;}
.case .lbl span{color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
pre{background:var(--code); border:1px solid var(--line); border-radius:10px; padding:12px;
    font-size:11.5px; line-height:1.6; overflow-x:auto; margin:0; color:var(--ink);}
button{font-family:inherit; font-size:14px; font-weight:800; color:#fff; background:var(--jade);
       border:0; border-radius:10px; padding:10px 16px; cursor:pointer;}
button:focus-visible{outline:3px solid var(--jade-deep); outline-offset:2px;}
.note{font-size:12.5px; color:var(--ink-soft); line-height:1.8;}
</style>

<div class="wrap">
  <header>
    <h1>ルビ位置プローブ</h1>
    <p class="sub">iPhone Safari で、ルビ（読みがな）を本文へ近づける手法のうち<strong>どれが実際に効くか</strong>を測るための検査ページです。このページを iPhone で開いて、下の結果をそのまま送ってください。</p>
  </header>

  <section class="panel">
    <h2>判定</h2>
    <div class="verdict" id="verdict"></div>
  </section>

  <section class="panel">
    <h2>環境</h2>
    <div class="env" id="env"></div>
  </section>

  <section class="panel stage" id="stage">
    <h2>手法ごとの見え方と実測値</h2>
    <p class="note" style="margin:0 0 14px">「すき間」は <span class="mono">本文の文字の上端 − ルビの下端</span>。数字が小さいほどルビが本文に近い。Chromium では 0 前後です。</p>
    <div id="cases"></div>
  </section>

  <section class="panel">
    <h2>結果データ</h2>
    <p class="note" style="margin:0 0 10px">このテキストをコピーして送ってください（スクリーンショットでも可）。</p>
    <pre id="json">計測中…</pre>
    <div style="margin-top:12px"><button id="copy" type="button">結果をコピー</button></div>
  </section>
</div>

<script>
(function(){
  var CASES = [
    {id:'m0', cls:'',   name:'① 補正なし（素のルビ）',          desc:'基準'},
    {id:'mS', cls:'mS', name:'② 現行アプリと同じ',              desc:'@supports (-webkit-hyphens:none) → rt{position:relative; top:4px}'},
    {id:'mR', cls:'mR', name:'③ 無条件 position:relative 8px',  desc:'@supports を通さずに rt{position:relative; top:8px}'},
    {id:'mM', cls:'mM', name:'④ 負マージン',                    desc:'rt{margin-bottom:-4px}'},
    {id:'mT', cls:'mT', name:'⑤ transform',                     desc:'rt{transform:translateY(4px)}'},
    {id:'mV', cls:'mV', name:'⑥ vertical-align',                desc:'rt{vertical-align:-4px}'},
    {id:'mL', cls:'mL', name:'⑦ ruby の line-height を 1 に',   desc:'ruby{line-height:1}'},
    {id:'mP', cls:'mP', name:'⑧ 親の line-height を 1.45 に',   desc:'吹き出し側の行間を下げる'}
  ];

  var SAMPLE =
    'これから<ruby>麻雀<rt>マージャン</rt></ruby>の'
    + '<span class="chip"><ruby>牌<rt>はい</rt></ruby></span>'
    + 'にさわってみるよ。ながい<ruby>文章<rt>ぶんしょう</rt></ruby>でも'
    + '<ruby>確<rt>たし</rt></ruby>かめられるように、ここで<ruby>行<rt>ぎょう</rt></ruby>を'
    + '<ruby>折<rt>お</rt></ruby>りかえします。';

  var host = document.getElementById('cases');
  CASES.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'case';
    d.innerHTML =
      '<div class="lbl"><b>' + c.name + '</b><span id="g-' + c.id + '">–</span></div>'
      + '<div class="note mono" style="font-size:11px">' + c.desc + '</div>'
      + '<div class="bub ' + c.cls + '" id="b-' + c.id + '">' + SAMPLE + '</div>';
    host.appendChild(d);
  });

  // ベース文字を span で包む（上端を測るため）
  function wrapBases(root){
    root.querySelectorAll('ruby').forEach(function(r){
      Array.prototype.slice.call(r.childNodes).forEach(function(n){
        if(n.nodeType === 3 && n.nodeValue.trim()){
          var s = document.createElement('span');
          s.className = 'bs';
          n.parentNode.insertBefore(s, n);
          s.appendChild(n);
        }
      });
    });
  }

  function measure(id){
    var box = document.getElementById('b-' + id);
    wrapBases(box);
    var vals = [];
    box.querySelectorAll('ruby').forEach(function(r){
      var rt = r.querySelector('rt'), bs = r.querySelector('.bs');
      if(!rt || !bs) return;
      var a = rt.getBoundingClientRect(), b = bs.getBoundingClientRect();
      if(!a.width || !b.width) return;
      vals.push(b.top - a.bottom);
    });
    if(!vals.length) return null;
    vals.sort(function(x, y){ return x - y; });
    return vals[Math.floor(vals.length / 2)];   // 中央値
  }

  function round(n){ return Math.round(n * 100) / 100; }

  var res = {};
  CASES.forEach(function(c){
    var g = measure(c.id);
    res[c.id] = (g === null) ? null : round(g);
    var el = document.getElementById('g-' + c.id);
    el.textContent = (g === null) ? '計測不可' : ('すき間 ' + round(g) + 'px');
  });

  var supportsHyphens = false, supportsCallout = false, supportsScroll = false, supportsApple = false;
  try { supportsHyphens = CSS.supports('-webkit-hyphens', 'none'); } catch(e){}
  try { supportsCallout = CSS.supports('-webkit-touch-callout', 'none'); } catch(e){}
  try { supportsScroll  = CSS.supports('-webkit-overflow-scrolling', 'touch'); } catch(e){}
  try { supportsApple   = CSS.supports('-apple-pay-button-style', 'plain'); } catch(e){}

  var dS = (res.m0 !== null && res.mS !== null) ? round(res.m0 - res.mS) : null;  // 現行の効き量
  var dR = (res.m0 !== null && res.mR !== null) ? round(res.m0 - res.mR) : null;  // relative の効き量
  var dM = (res.m0 !== null && res.mM !== null) ? round(res.m0 - res.mM) : null;
  var dT = (res.m0 !== null && res.mT !== null) ? round(res.m0 - res.mT) : null;
  var dV = (res.m0 !== null && res.mV !== null) ? round(res.m0 - res.mV) : null;
  var dL = (res.m0 !== null && res.mL !== null) ? round(res.m0 - res.mL) : null;
  var dP = (res.m0 !== null && res.mP !== null) ? round(res.m0 - res.mP) : null;

  var relWorks = (dR !== null && dR > 4);
  var appWorks = (dS !== null && dS > 2);

  function row(k, ok, text){
    return '<div class="vrow"><span class="k">' + k + '</span>'
      + '<span class="a ' + (ok ? 'yes' : 'no') + '">' + text + '</span></div>';
  }

  var best = 'まだ判定できません';
  if(relWorks)      best = 'position:relative（top）で調整できます';
  else if(dT !== null && dT > 2) best = 'transform:translateY で調整できます';
  else if(dM !== null && dM > 2) best = 'margin-bottom（負の値）で調整できます';
  else if(dV !== null && dV > 2) best = 'vertical-align で調整できます';
  else if(dP !== null && dP > 2) best = '親の line-height を下げる方法が有効です';
  else if(dL !== null && dL > 2) best = 'ruby の line-height を詰める方法が有効です';

  document.getElementById('verdict').innerHTML =
      row('@supports 成立', supportsHyphens, supportsHyphens ? 'はい（Safari判定は有効）' : 'いいえ（Safari判定が効いていない）')
    + row('現行アプリの補正', appWorks, appWorks ? ('効いている（' + dS + 'px 下がった）') : '効いていない（0px）')
    + row('relative が効くか', relWorks, relWorks ? ('効く（' + dR + 'px 下がった）') : '効かない（無視されている）')
    + row('素のすき間', true, (res.m0 === null ? '–' : res.m0 + 'px'))
    + row('おすすめ手法', best !== 'まだ判定できません', best);

  document.getElementById('env').innerHTML =
      '画面幅 ' + window.innerWidth + 'px ／ 解像度倍率 ' + (window.devicePixelRatio || 1) + '<br>'
    + 'UA: ' + navigator.userAgent;

  var payload = {
    width: window.innerWidth, dpr: window.devicePixelRatio || 1,
    supports: { hyphens: supportsHyphens, touchCallout: supportsCallout,
                overflowScrolling: supportsScroll, applePay: supportsApple },
    gapPx: res,
    effect: { 'S_supports4px': dS, 'R_relative8px': dR, 'M_margin-4px': dM,
              'T_translateY4px': dT, 'V_valign-4px': dV, 'L_rubyLH1': dL, 'P_parentLH1.45': dP },
    ua: navigator.userAgent
  };
  var text = JSON.stringify(payload, null, 2);
  document.getElementById('json').textContent = text;

  document.getElementById('copy').addEventListener('click', function(){
    var btn = this;
    function done(msg){ btn.textContent = msg; setTimeout(function(){ btn.textContent = '結果をコピー'; }, 1800); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done('コピーしました'); }, function(){ select(); });
    } else { select(); }
    function select(){
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('json'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      done('選択しました（長押しでコピー）');
    }
  });
})();
</script>
</body>
</html>
